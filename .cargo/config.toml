# Cargo configuration for Loom project
# https://doc.rust-lang.org/cargo/reference/config.html

[build]
# Warnings as errors in CI (controlled via environment variable)
# Set RUSTFLAGS="-D warnings" in CI to enforce this

[target.'cfg(all())']
# Clippy lint config for all targets.
#
# IMPORTANT (#3837): this block is kept in *exact sync* with the clippy
# invocation in `.github/workflows/ci.yml` (the `backend-lint-and-check`
# job), which runs:
#
#   cargo clippy --package loom-daemon --package loom-api --all-targets -- \
#     -D warnings \
#     -A clippy::cast_precision_loss -A clippy::cast_possible_truncation \
#     -A clippy::cast_sign_loss -A clippy::too_many_lines -A clippy::panic \
#     -A clippy::unwrap_used -A clippy::nonminimal_bool \
#     -A clippy::redundant_closure -A clippy::redundant_closure_for_method_calls \
#     -A clippy::format_push_string -A clippy::uninlined_format_args
#
# Mirroring CI's allow-list here means a bare local `cargo clippy` reproduces
# CI's pass/fail — no more "is this failure mine or pre-existing?" (#3828).
#
# We intentionally do NOT enable `clippy::pedantic`: CI never enforced it, and
# enabling it locally surfaced a large class of lints CI allows (casts,
# too_many_lines, redundant closures, uninlined format args, …), reliably
# red-ing bare local clippy while CI stayed green. `-D clippy::all` (below)
# minus CI's allow-list is exactly CI's effective clippy lint set.
#
# Residual, documented divergence: CI passes `-D warnings`, which also promotes
# *rustc* warnings (e.g. `dead_code`, `unused_variables`) to hard errors. We
# keep those at `-W` here so ordinary local `cargo build`/`cargo test` stay
# dev-friendly (a warning during iteration doesn't abort the build). The clippy
# *lint selection* — the source of the #3828 confusion — is identical.
rustflags = [
    # Deny the default clippy lint set (correctness + suspicious + style +
    # complexity + perf). CI denies the same set via `-D warnings`.
    "-D", "clippy::all",

    # CI allow-list — MUST stay identical to .github/workflows/ci.yml.
    # These lints live inside `clippy::all`/pedantic; CI allows them, so we
    # allow them too (a later `-A` overrides the earlier `-D clippy::all`).
    "-A", "clippy::cast_precision_loss",
    "-A", "clippy::cast_possible_truncation",
    "-A", "clippy::cast_sign_loss",
    "-A", "clippy::too_many_lines",
    "-A", "clippy::panic",
    "-A", "clippy::unwrap_used",
    "-A", "clippy::nonminimal_bool",
    "-A", "clippy::redundant_closure",
    "-A", "clippy::redundant_closure_for_method_calls",
    "-A", "clippy::format_push_string",
    "-A", "clippy::uninlined_format_args",

    # Warn (not deny) on dead code so it surfaces locally without aborting
    # iterative builds. CI's `-D warnings` denies it — see the note above.
    "-W", "dead_code",
]

[target.aarch64-apple-darwin]
# Ad-hoc sign test binaries before execution to prevent _dyld_start hangs
# on macOS ARM64. See issue #2298.
runner = ".cargo/macos-test-runner.sh"

[env]
# #10607 review S3: every Loom spawn path exports the daemon's real
# forge-call sink as LOOM_FORGE_CALL_STATS_DIR (W5), so an agent running
# `cargo test` here would hand it to every `loom-daemon` test binary, and their
# fake-`gh` rows would land in the production ledger. Empty means "the
# default under TMPDIR", what these tests saw before W5; a test that wants a
# sink sets its own.
LOOM_FORGE_CALL_STATS_DIR = { value = "", force = true }
# #9720: `config_resolver::private_defaults_path()` returns None only under
# `cfg(test)`, and the bin target compiles the lib without it, so bin-target
# tests (fleet_captain_cmd, attend_hook) read the host's machine-tier
# `~/.local/share/loom/config/defaults.json` and fail on a host whose file
# names a captain. Empty disables that tier; a test that wants a defaults file
# sets its own via set_var, which overrides this. `force = true` also applies
# to `cargo run`, so an in-repo dev daemon (start-daemon.sh, daemon:preview)
# ignores the machine defaults file too, even with the variable exported.
LOOM_CONFIG_DEFAULTS_FILE = { value = "", force = true }
# #9851: every Loom agent session is spawned with its admitted runtime pinned
# (`launch_env::apply_launch_env`), and `runtime_admission::resolve_binding`
# reads LOOM_RUNTIME_<ROLE> / LOOM_RUNTIME before any `runtimes.*` fixture a
# test writes, so a native pin reddened ~110 dispatch-path tests in buildGate.
# Same shape as LOOM_FORGE_CALL_STATS_DIR above: empty counts as unset
# (`choose_runtime`'s `nonempty`), and a test that wants a pin sets its own via
# set_var, which overrides this. The per-role list is one entry per
# `runtime_admission::KNOWN_ROLE_KEYS` (the canonical_role outputs); a unit
# test there fails if a role is missing here. `force = true` also applies to
# `cargo run`: with no pin exported a dev daemon is unchanged; with one
# exported it is ignored and the daemon resolves from `runtimes.*` config.
LOOM_RUNTIME = { value = "", force = true }
LOOM_RUNTIME_ARCHITECT = { value = "", force = true }
LOOM_RUNTIME_AUDITOR = { value = "", force = true }
LOOM_RUNTIME_BUILDER = { value = "", force = true }
LOOM_RUNTIME_CHAMPION = { value = "", force = true }
LOOM_RUNTIME_CURATOR = { value = "", force = true }
LOOM_RUNTIME_DOCTOR = { value = "", force = true }
LOOM_RUNTIME_DRIVER = { value = "", force = true }
LOOM_RUNTIME_GUIDE = { value = "", force = true }
LOOM_RUNTIME_HERMIT = { value = "", force = true }
LOOM_RUNTIME_JUDGE = { value = "", force = true }
LOOM_RUNTIME_SWEEP_LIFECYCLE = { value = "", force = true }

[alias]
# Convenient aliases for common tasks
clippy-all = "clippy --workspace --all-targets --all-features"
clippy-fix = "clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged"
