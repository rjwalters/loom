# --- label-catalogue-transitions ---------------------------------------------

[[operation]]
id = "label.sync-catalogue"
group = "label-catalogue-transitions"
summary = "Create/edit/delete the repository label catalogue to match labels.yml."
profile = "required-coordination"
disposition = "required"
class = "write"
inputs = ["owner", "repo", "name", "color", "description"]
outputs = ["name", "id", "color", "description"]
required_fields = ["name"]
actor = "installer"
permissions = ["issues:write", "metadata:read"]
pagination = "complete-required"
consistency = "read-after-write"
idempotency = "idempotent"
retry = "reread-then-retry"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::coordination::label-sync-catalogue"
owner = "role-scripts"
risk = "normal"
github = { commands = [
  "gh label list",
  "gh label create",
  "gh label edit",
  "gh label delete",
], routes = [
  "GET repos/{owner}/{repo}/labels",
  "POST repos/{owner}/{repo}/labels",
  "PATCH repos/{owner}/{repo}/labels/{name}",
  "DELETE repos/{owner}/{repo}/labels/{name}",
] }
platform_support = "documented"
adapter_coverage = "none"
caller_integration = "none"
unknowns = [
  "Gitea addresses labels by numeric id, GitHub by name — the whole label layer needs an id/name translation with a stable mapping",
  "colon-bearing names (`loom:issue`) and URL encoding on the name-addressed routes",
]
[[operation.callers]]
kind = "script"
path = "defaults/scripts/sync-labels.sh"
[[operation.callers]]
kind = "installer"
path = "scripts/install/sync-labels.sh"

