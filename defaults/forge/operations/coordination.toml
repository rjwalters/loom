# --- issue-mutation-lifecycle ------------------------------------------------

[[operation]]
id = "issue.edit-labels"
group = "issue-mutation-lifecycle"
summary = "Add and remove labels on one issue as the claim transition."
profile = "required-coordination"
disposition = "required"
class = "write"
inputs = ["owner", "repo", "number", "add_labels", "remove_labels"]
outputs = ["labels"]
required_fields = ["labels"]
actor = "agent"
permissions = ["issues:write"]
pagination = "not-paginated"
consistency = "read-after-write"
idempotency = "idempotent"
retry = "reread-then-retry"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::coordination::issue-edit-labels"
owner = "role-scripts"
risk = "high"
high_risk_cases = ["competing-claims"]
github = { commands = [
  "gh issue edit --add-label --remove-label",
], routes = [
  "POST repos/{owner}/{repo}/issues/{number}/labels",
  "DELETE repos/{owner}/{repo}/issues/{number}/labels/{name}",
] }
platform_support = "documented"
adapter_coverage = "none"
caller_integration = "none"
unknowns = [
  "whether a concurrent add/remove pair from two hosts can land in an order that leaves BOTH loom:issue and loom:building set — the competing-claims case",
  "partial-failure reporting when a batch add succeeds and the paired remove fails",
]
notes = "This is the claim primitive. Loom's guarded claim (forge check-claim + lease) assumes the remove/add pair is observable as one transition by the next reader."
[[operation.callers]]
kind = "script"
path = "defaults/scripts/lib/forge-helpers.sh"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/forge_check_claim.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/claim_reconciliation.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/claim_reconciliation/unanchored_verdict.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/fleet/drain_reset.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/sweep_registry/park_hold.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/intake_reconcile/singleton.rs"

