[[operation]]
id = "comment.create"
group = "issue-pr-conversation"
summary = "Post a comment on an issue or PR, body preserved literally."
profile = "required-coordination"
disposition = "required"
class = "write"
inputs = ["owner", "repo", "number", "body"]
outputs = ["id", "body", "author", "created_at", "updated_at"]
required_fields = ["id", "author", "created_at"]
actor = "agent"
permissions = ["issues:write"]
pagination = "not-paginated"
consistency = "read-after-write"
idempotency = "marker-deduped"
retry = "no-auto-retry"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::coordination::comment-create"
owner = "role-scripts"
risk = "high"
high_risk_cases = ["competing-claims"]
github = { commands = [
  "gh issue comment",
  "gh pr comment",
], routes = [
  "POST repos/{owner}/{repo}/issues/{number}/comments",
] }
platform_support = "documented"
adapter_coverage = "none"
caller_integration = "none"
unknowns = [
  "lease records are comments whose liveness signal is the FORGE-assigned updated_at, and whose tie-break is forge-assigned comment ORDER; both must be preserved exactly or the claim protocol loses its arbiter",
]
notes = "Comments carry leases, verdicts and trusted workflow records — not just prose. Loom's Judge publishes verdicts as comments by design."
[[operation.callers]]
kind = "script"
path = "defaults/scripts/post-verdict.sh"
[[operation.callers]]
kind = "script"
path = "defaults/scripts/lib/forge-helpers.sh"
[[operation.callers]]
kind = "role-prompt"
