# coordination.toml — the required-coordination profile.
#
# Issues, labels, comments, timeline and epic relationships: the operations the
# primary forge owns as the coordination authority (ADR-0014). Every row here
# is `profile = "required-coordination"`; a provider that cannot do one of them
# cannot be a Loom primary forge, which is why none of these may be waived by a
# profile reduction.
#
# Field semantics: loom-daemon/src/forge_inventory/model.rs.

# --- issue-creation-discovery ------------------------------------------------

[[operation]]
id = "issue.create"
group = "issue-creation-discovery"
summary = "File a new issue with labels applied atomically."
profile = "required-coordination"
disposition = "required"
class = "write"
inputs = ["owner", "repo", "title", "body", "labels"]
outputs = ["number", "id", "html_url", "created_at"]
required_fields = ["number"]
actor = "agent"
permissions = ["issues:write"]
pagination = "not-paginated"
consistency = "read-after-write"
idempotency = "not-idempotent"
retry = "no-auto-retry"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::coordination::issue-create"
owner = "role-scripts"
risk = "normal"
github = { commands = [
  "gh issue create",
], routes = [
  "POST repos/{owner}/{repo}/issues",
] }
platform_support = "documented"
adapter_coverage = "none"
caller_integration = "none"
unknowns = [
  "whether Gitea applies labels in the same request or needs a second call (atomicity matters: #5047 exists because a split write left unlabelled issues)",
]
notes = "Loom files issues through create-issue.sh, which falls back to one REST POST when the GraphQL pool is exhausted."
[[operation.callers]]
kind = "script"
path = "defaults/scripts/create-issue.sh"
[[operation.callers]]
kind = "role-prompt"
path = "defaults/.claude/commands/loom/curator.md"

[[operation]]
id = "issue.list"
group = "issue-creation-discovery"
summary = "List open issues filtered by label, state and sort order."
profile = "required-coordination"
disposition = "required"
class = "read"
inputs = ["owner", "repo", "labels", "state", "sort", "limit"]
outputs = ["number", "title", "labels", "state", "updated_at", "author"]
required_fields = ["number", "labels", "state"]
actor = "daemon"
permissions = ["issues:read"]
pagination = "complete-required"
consistency = "fresh-read"
idempotency = "idempotent"
retry = "backoff-safe"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::coordination::issue-list"
owner = "daemon-sweep"
risk = "normal"
github = { commands = [
  "gh issue list",
], routes = [
  "GET repos/{owner}/{repo}/issues",
] }
platform_support = "documented"
adapter_coverage = "partial"
caller_integration = "partial"
unknowns = [
  "Gitea label-filter semantics for multi-label AND queries (gh ANDs --label; a provider that ORs would silently widen every work-finder query)",
]
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/work_finder/forge.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/forge_listing.rs"
[[operation.callers]]
kind = "role-prompt"
path = "defaults/.claude/commands/loom/guide.md"

