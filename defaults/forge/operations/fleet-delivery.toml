# fleet-delivery.toml — identity, quota, bootstrap and delivery profiles.
#
# The cross-cutting rows: who Loom is and what it may do (identity-authentication,
# a NON-waivable group), how it measures and conserves quota, how a host or
# worker repo gets bootstrapped, how fleet-config proposals and CI repairs write
# git objects, how CI is diagnosed, and how releases/artifacts/images are
# published and fetched.
#
# Delivery is deliberately a SEPARATE profile from landing: a delayed artifact
# publication must never become a required merge check (#9769).

# --- identity-authentication -------------------------------------------------

[[operation]]
id = "identity.viewer"
group = "identity-authentication"
summary = "Who am I, and what may I do in this repository?"
profile = "required-coordination"
disposition = "required"
class = "read"
inputs = ["host"]
# `provider` + `origin` are NOT decoration. A bare `login` is ambiguous the
# moment a second forge exists — the same name can be two different accounts on
# github.com and on a hosted Gitea — and an ambiguous identity is how a trust or
# claim decision gets made against the wrong actor. The qualified identity is
# (provider, origin, login), so both are required fields, not optional outputs.
outputs = [
  "provider",
  "origin",
  "login",
  "id",
  "account_type",
  "viewer_permission",
  "token_scopes",
]
required_fields = ["provider", "origin", "login", "viewer_permission"]
actor = "daemon"
permissions = ["metadata:read"]
pagination = "not-paginated"
consistency = "fresh-read"
idempotency = "idempotent"
retry = "backoff-safe"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::fleet-delivery::identity-viewer"
test_status = "declared"
owner = "daemon-forge"
risk = "high"
high_risk_cases = ["revoked-permissions", "cross-origin-identity"]
github = { commands = [
  "gh auth status",
  "gh repo view --json viewerPermission",
], routes = [
  "GET user",
  "GET repos/{owner}/{repo}",
] }
platform_support = "documented"
adapter_coverage = "partial"
caller_integration = "partial"
unknowns = [
  "a permission probe that FAILS must not read as `permitted`; #9769 states explicitly that unavailable permission/state is not an affirmative answer",
  "whether a revoked write scope is reported at probe time or only at first write",
]
notes = "The qualified identity (provider + origin host + login) is what distinguishes two accounts with the same slug on different forges."
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/forge_identity.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/credential_preflight.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/credential_preflight/pool.rs"
[[operation.callers]]
kind = "installer"
path = "scripts/install/validate-target.sh"

[[operation]]
