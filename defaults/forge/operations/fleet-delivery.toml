group = "identity-authentication"
summary = "Is this comment/verdict author a trusted actor for this repository?"
profile = "required-coordination"
disposition = "required"
class = "read"
inputs = ["owner", "repo", "login"]
outputs = ["login", "author_association", "permission", "is_bot"]
required_fields = ["login", "permission"]
actor = "daemon"
permissions = ["metadata:read"]
pagination = "complete-required"
consistency = "fresh-read"
idempotency = "idempotent"
retry = "backoff-safe"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::fleet-delivery::identity-actor-trust"
test_status = "declared"
owner = "daemon-forge"
risk = "high"
high_risk_cases = ["cross-origin-identity", "revoked-permissions"]
github = { commands = [], routes = [
  "GET repos/{owner}/{repo}/collaborators/{login}/permission",
  "GET users/{login}",
] }
platform_support = "unknown"
adapter_coverage = "partial"
caller_integration = "partial"
unknowns = [
  "GitHub authorAssociation is a GitHub contract to translate; a provider with a different role model changes who counts as trusted for an `ac-verified` or verdict marker",
  "the same login string on two origins is NOT the same actor — trust decisions must key on provider+origin+login, never the bare slug",
]
notes = "comment_trust gates which markers Loom believes. A trust decision made on an unqualified login is exactly the cross-origin-identity failure."
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/comment_trust.rs"

[[operation]]
id = "identity.app-installation-token"
group = "identity-authentication"
summary = "Mint a short-lived installation access token for a repository."
profile = "optional"
disposition = "optional"
class = "write"
inputs = ["app_id", "installation_id", "private_key_ref"]
outputs = ["token", "expires_at", "permissions"]
required_fields = []
actor = "operator"
permissions = ["app:installation"]
pagination = "not-paginated"
consistency = "read-after-write"
idempotency = "not-idempotent"
retry = "no-auto-retry"
version_support = { github = "0" }
test_id = "forge-probe::fleet-delivery::identity-app-installation-token"
test_status = "declared"
owner = "role-scripts"
risk = "normal"
github = { commands = [], routes = [
  "GET repos/{owner}/{repo}/installation",
  "POST app/installations/{id}/access_tokens",
] }
platform_support = "unsupported"
adapter_coverage = "partial"
caller_integration = "partial"
exclusion_reason = "GitHub-App token minting is GitHub-specific (epic #4432's rate-limit protection). An alternate provider supplies scoped credentials by another mechanism; the REQUIREMENT it serves is `identity.viewer` + `identity.actor-trust`, which are required rows in their own right."
preflight = "warn-and-disable"
# `identity-authentication` is non-waivable. Declining App-token minting is
# allowed only because the identity/trust requirement itself is carried by two
# required rows — stated as data so the validator can check it, not just prose.
requirement_carried_by = ["identity.viewer", "identity.actor-trust"]
unknowns = [
  "the equivalent short-lived-credential mechanism on a replacement provider, and whether its quota is pooled or per-credential",
]
notes = "Never record a token value in evidence. The accounting layer records provider/origin/repo identifiers only — see loom-daemon/src/forge_call_stats.rs."
[[operation.callers]]
kind = "script"
path = "defaults/scripts/lib/github-app-token.sh"

