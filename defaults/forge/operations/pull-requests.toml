  "thread_id",
  "is_resolved",
  "is_outdated",
  "path",
  "line",
  "comments",
  "author",
]
required_fields = ["thread_id", "is_resolved", "is_outdated"]
actor = "daemon"
permissions = ["pull_requests:read"]
pagination = "complete-required"
consistency = "fresh-read"
idempotency = "idempotent"
retry = "backoff-safe"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::pull-requests::review-thread-resolution"
test_status = "declared"
owner = "role-scripts"
risk = "high"
high_risk_cases = ["review-resolution"]
github = { commands = [], routes = [
  "GET repos/{owner}/{repo}/pulls/{number}/comments",
  "GRAPHQL repository.pullRequest.reviewThreads(isResolved,isOutdated)",
] }
platform_support = "unknown"
adapter_coverage = "none"
caller_integration = "none"
unknowns = [
  "thread RESOLUTION state is GraphQL-only on GitHub; whether Gitea exposes resolved-vs-unresolved at all is the single largest known mapping gap (#9769 names it a known Loom thread-state gap)",
  "cursor pagination semantics for threads, and whether an outdated thread is still returned",
]
notes = "Seeded first on purpose: an unresolvable `is this thread still open?` question makes the Doctor loop unable to tell a fixed finding from an unaddressed one."
[[operation.callers]]
kind = "script"
path = "defaults/scripts/lib/forge-helpers.sh"

[[operation]]
id = "review.publish-formal-verdict"
group = "formal-reviews-inline-comments"
summary = "Submit a formal APPROVE / REQUEST_CHANGES review as the acting identity."
profile = "required-coordination"
disposition = "unsupported"
class = "write"
inputs = ["owner", "repo", "number", "event", "body"]
outputs = ["id", "state"]
required_fields = []
actor = "operator"
permissions = ["pull_requests:write"]
pagination = "not-paginated"
consistency = "read-after-write"
idempotency = "not-idempotent"
retry = "no-auto-retry"
version_support = { github = "0" }
test_id = "forge-probe::pull-requests::review-publish-formal-verdict"
test_status = "declared"
owner = "role-prompts"
risk = "normal"
github = { commands = [
  "gh pr review --approve",
  "gh pr review --request-changes",
], routes = [
  "POST repos/{owner}/{repo}/pulls/{number}/reviews",
] }
platform_support = "unsupported"
adapter_coverage = "none"
caller_integration = "none"
preflight = "fail-closed"
unknowns = []
# `formal-reviews-inline-comments` is non-waivable. The *review* requirement is
# carried by the two required rows below; what is unsupported here is only the
# formal self-approval API, which Loom deliberately does not use.
requirement_carried_by = ["review.list-formal", "review.thread-resolution"]
notes = "Recorded as explicitly UNSUPPORTED-by-design, not missing: GitHub blocks self-review and Loom agents routinely create and review the same PR, so Judge publishes a comment plus labels instead. A replacement forge that only offered formal self-approval would NOT satisfy this row — it must preserve the comment+label path. Classified here so a future adapter cannot `helpfully` wire it up."
[[operation.callers]]
kind = "role-prompt"
path = "defaults/.claude/commands/loom/judge.md"

# --- issue-closing-relationships ---------------------------------------------

[[operation]]
id = "issue.closed-by-pull-requests"
group = "issue-closing-relationships"
summary = "Resolve, for a batch of issues, which PRs are declared to close each one (number and state)."
profile = "required-coordination"
disposition = "required"
class = "read"
inputs = ["owner", "repo", "issue_numbers"]
outputs = ["pr_numbers", "pr_states", "total_count"]
required_fields = ["pr_numbers", "total_count"]
actor = "daemon"
permissions = ["pull_requests:read", "issues:read"]
pagination = "complete-required"
consistency = "fresh-read"
idempotency = "idempotent"
retry = "backoff-safe"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::pull-requests::issue-closed-by-pull-requests"
test_status = "declared"
owner = "daemon-landing"
risk = "normal"
github = { commands = [
  "gh api graphql (issue.closedByPullRequestsReferences, aliased per issue)",
] }
platform_support = "unknown"
adapter_coverage = "partial"
caller_integration = "partial"
unknowns = [
  "REST has no equivalent: timeline cross-referenced events do not say whether a closing keyword was used, so this read is GraphQL-only on GitHub",
  "whether another forge exposes the issue-to-closing-PR direction at all, rather than only the PR-to-issue one (pr.closing-issue-references)",
]
notes = "The opposite direction of pr.closing-issue-references. Batched as one aliased query per 100 issues with gh's own arguments (first: 100, closed-unmerged PRs excluded) so the verdicts match `gh issue view --json closedByPullRequestsReferences`."
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/stale_blocked/batch.rs"

[[operation]]
id = "pr.closing-issue-references"
group = "issue-closing-relationships"
summary = "Resolve which issues a PR closes, and which PRs closed an issue."
profile = "required-coordination"
disposition = "required"
class = "read"
inputs = ["owner", "repo", "number"]
outputs = ["issue_numbers", "pr_numbers", "source"]
required_fields = ["issue_numbers"]
actor = "daemon"
permissions = ["pull_requests:read", "issues:read"]
pagination = "complete-required"
consistency = "fresh-read"
idempotency = "idempotent"
retry = "backoff-safe"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::pull-requests::pr-closing-issue-references"
test_status = "declared"
owner = "daemon-landing"
risk = "normal"
github = { commands = [
  "gh pr view --json closingIssuesReferences",
  "gh pr list --json closingIssuesReferences",
  "gh issue view --json closedByPullRequestsReferences",
], routes = [
  "GET repos/{owner}/{repo}/issues/{number}/timeline",
  "GET repos/{owner}/{repo}/pulls",
] }
platform_support = "unknown"
adapter_coverage = "partial"
caller_integration = "partial"
unknowns = [
  "whether a provider resolves closing keywords server-side at all; #9769 records this as a known Loom gap and merge-pr.sh already carries a body-parsing fallback",
  "negative and quoted text handling: a body saying `this does NOT close #N` or quoting `Closes #N` inside a code fence must not produce a closing edge",
]
notes = "`Part of #N` vs `Closes #N` is how a multi-PR landing keeps its parent issue open; a provider that cannot express the distinction forces the body-parsing fallback to become primary."
[[operation.callers]]
kind = "script"
path = "defaults/scripts/lib/forge-helpers.sh"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/cli/merge_pr_refs.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/eta/fleet_events_forge.rs"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/cli/eta_backtest_cases.rs"
[[operation.callers]]
kind = "role-prompt"
path = "defaults/.claude/commands/loom/curator.md"
