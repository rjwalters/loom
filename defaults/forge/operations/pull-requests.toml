notes = "ETag'd REST pages (#10349); an unchanged repo answers with free 304s. A truncated listing is a completeness bug, not a display one. Since #10514 it is also leg 0 of both open-linked-PR probes (body linking phrase or feature/issue-N head); the closes-graph is only their fallback."
[[operation.callers]]
