# pull-requests.toml — PR lifecycle, diffs, reviews and closing references.
#
# Still the required-coordination profile: Loom's review loop (Builder opens,
# Judge publishes a comment verdict plus labels, Doctor fixes) is coordination,
# not landing. The landing half — checks, protection, guarded merge — is in
# ci-landing.toml.
#
# Note on reviews: Loom deliberately does NOT use `gh pr review --approve` /
# `--request-changes`, because GitHub blocks self-review and Loom agents
# routinely create and review the same PR. Reading OUTSIDE reviewers' formal
# reviews and inline threads is still required. A replacement forge must
# preserve that asymmetry rather than require formal self-approval.

# --- pr-creation-discovery-state ---------------------------------------------

[[operation]]
id = "pr.create"
group = "pr-creation-discovery-state"
summary = "Open a PR for a pushed branch, or adopt the one that already exists."
profile = "required-coordination"
disposition = "required"
class = "write"
inputs = ["owner", "repo", "head", "base", "title", "body", "draft", "labels"]
outputs = ["number", "html_url", "head_sha", "draft", "state"]
required_fields = ["number", "head_sha"]
actor = "agent"
permissions = ["pull_requests:write", "contents:read"]
pagination = "not-paginated"
consistency = "read-after-write"
idempotency = "marker-deduped"
retry = "reread-then-retry"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::pull-requests::pr-create"
test_status = "declared"
owner = "role-scripts"
risk = "normal"
github = { commands = [
  "gh pr create",
], routes = [
  "POST repos/{owner}/{repo}/pulls",
] }
platform_support = "documented"
adapter_coverage = "none"
caller_integration = "none"
unknowns = [
  "the #6074 adoption path: create-pr.sh must treat an already-open PR for the same head as success, which needs a reliable head-branch lookup, not an error-string match",
]
[[operation.callers]]
kind = "script"
path = "defaults/scripts/create-pr.sh"

[[operation]]
id = "pr.list-by-head"
group = "pr-creation-discovery-state"
summary = "Find the open PR whose head is a given branch (claim and shadow guards)."
profile = "required-coordination"
disposition = "required"
class = "read"
inputs = ["owner", "repo", "head_branch", "state"]
outputs = ["number", "state", "merged", "head_ref", "head_sha", "author"]
required_fields = ["number", "state", "head_ref"]
actor = "daemon"
permissions = ["pull_requests:read"]
pagination = "complete-required"
consistency = "fresh-read"
idempotency = "idempotent"
retry = "backoff-safe"
version_support = { github = "0", gitea = "1.24" }
test_id = "forge-probe::pull-requests::pr-list-by-head"
test_status = "declared"
owner = "daemon-sweep"
risk = "high"
high_risk_cases = ["competing-claims"]
github = { commands = [
  "gh pr list --head",
], routes = [
  "GET repos/{owner}/{repo}/pulls",
] }
platform_support = "documented"
adapter_coverage = "partial"
caller_integration = "partial"
unknowns = [
  "an inconclusive read must stay distinguishable from `confirmed no PR` — #7863 regressed exactly by collapsing those two, and the open-PR leg of `forge check-claim` is a claim guard",
]
notes = "This is the OPEN_PR leg of the pre-claim guard: a false negative duplicates in-flight work."
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/forge_check_open_pr.rs"
[[operation.callers]]
kind = "script"
path = "defaults/scripts/lib/worktree-forge-pr-check.sh"
[[operation.callers]]
kind = "rust"
path = "loom-daemon/src/forge_pull_listing.rs"

[[operation]]
id = "pr.list-open"
group = "pr-creation-discovery-state"
summary = "List every open PR of a repo (the daemon's PR-side reconciliation passes, client-side label filter; the open-linked-PR guard's leg 0)."
profile = "required-coordination"
