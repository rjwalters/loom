name: "Development Task"
description: "Create a development task"
labels: ["loom:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for an actionable development task: a bug to fix, a feature to build, or other concrete work.

        This repository uses GitHub Issues to drive an AI-assisted development workflow. A new task starts with the `loom:triage` label and is reviewed before any work begins.

  - type: dropdown
    id: task_type
    attributes:
      label: "Task Type"
      description: "What type of development task is this?"
      options:
        - Bug Fix
        - Feature
        - Refactoring
        - Documentation
        - Testing
        - Infrastructure
        - Research
        - Improvement
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Task Description"
      description: "Clear, actionable description of what needs to be done"
      placeholder: |
        For bugs:
        Steps to reproduce:
        1. First step
        2. Second step
        3. Third step

        Expected: What should happen
        Actual: What happens instead

        For features/improvements:
        - What problem does this solve?
        - How should it work?
        - Why is this needed?
        - Acceptance criteria?
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: "Technical Notes"
      description: "Implementation details, affected files, environment details, dependencies"
      placeholder: |
        - Files to modify: path/to/file
        - Related issues: #123, #456
        - Environment: OS and version, tool versions
        - Breaking changes: No
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "Priority (optional)"
      description: "How urgent is this task?"
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: false
