name: loom-clickstack
services:
  clickstack:
    # Dockerfile pins the multi-platform upstream index and removes its fixed
    # session-secret assignment so the required machine secret reaches the API.
    build: .
    image: loom-clickstack-trial:2.39.1-session-secret-v1
    restart: unless-stopped
    mem_limit: 3g
    cpus: 4.0
    environment:
      # Bootstrap key works before UI signup; never use a model-provider key here.
      INGESTION_API_KEY: ${CLICKSTACK_INGESTION_API_KEY:?Set a private ClickStack ingestion key}
      EXPRESS_SESSION_SECRET: ${CLICKSTACK_SESSION_SECRET:?Set a private ClickStack session-signing secret}
      FRONTEND_URL: http://localhost:18080
      HYPERDX_OTEL_EXPORTER_TABLES_TTL: ${CLICKSTACK_RETENTION:-168h}
      HYPERDX_OTEL_EXPORTER_CREATE_LEGACY_SCHEMA: 'true'
      USAGE_STATS_ENABLED: 'false'
    ports:
      - '127.0.0.1:18080:8080'
    volumes:
      - ./supervisor.yaml:/etc/otel/supervisor.yaml.tmpl:ro

      - metadata:/data/db
      - telemetry:/var/lib/clickhouse
      - server_logs:/var/log/clickhouse-server
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--fail-early', 'http://localhost:8080/api/health', 'http://localhost:13133']
      interval: 10s
      timeout: 30s
      start_period: 900s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      trial:
        aliases: [clickstack-collector]
volumes:
  metadata:
  telemetry:
  server_logs:
networks:
  trial:
    external: true
    name: loom-observability
