# Pinned Collector 0.161.0. Secrets are files, never incoming client metadata.
extensions:
  bearertokenauth/loom:
    filename: /run/secrets/loom_ingest_key
    wait_for_token_file: true
    retry_on_failure:
      enabled: true
      interval: 1s
      max_retries: 5
  bearertokenauth/clickstack:
    filename: /run/secrets/clickstack_ingest_key
    scheme: ""
    wait_for_token_file: true
    retry_on_failure:
      enabled: true
      interval: 1s
      max_retries: 5
  file_storage/clickstack:
    directory: /var/lib/otelcol/clickstack
    create_directory: true
    fsync: true
  file_storage/signoz:
    directory: /var/lib/otelcol/signoz
    create_directory: true
    fsync: true
  file_storage/filelog:
    directory: /var/lib/otelcol/filelog
    create_directory: true
    fsync: true
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
        auth:
          authenticator: bearertokenauth/loom
  # Interactive-runtime session-store tails (#8664 item 2 / #8669). Each parses
  # its JSONL lines to reach a handful of structural fields, moves ONLY those
  # into loom.* attributes, then discards everything else — including the
  # parsed body itself via `remove: body` — before the record ever reaches
  # transform/privacy below. `retain` is an explicit allowlist of attribute
  # keys: it drops the raw parsed fields (prompts, tool output, model
  # completions) that json_parser produced, not just the ones we did not name.
  # transform/privacy's keep_keys is therefore a second, independent
  # enforcement layer on top of this receiver-level one, not the only one.
  # Field-path verification state (2026-09-23, #8686; details in README.md):
  # Claude `sessionId` and pi `model_change` `provider`/`modelId` are verified
  # against real on-disk files; pi `sessionId`/agent lineage had no carrying
  # record in the available sample; Claude `durationMs` was absent from every
  # real transcript sampled (its guarded operator is a no-op on current data);
  # Codex paths remain entirely unverified — no sample existed on the
  # verifying host. The host-side mounts these receivers depend on are wired
  # in compose.yaml behind required *_SESSIONS_DIR/*_PROJECTS_DIR env vars.
  file_log/codex:
    include: ["/var/lib/loom-sessions/codex/**/*.jsonl"]
    start_at: beginning
    storage: file_storage/filelog
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes
        on_error: send_quiet
      - type: add
        field: attributes["loom.runtime"]
        value: "codex"
      - type: move
        from: attributes.payload.id
        to: attributes["loom.session_id"]
        if: 'attributes.type == "session_meta"'
      - type: move
        from: attributes.payload.model
        to: attributes["loom.model"]
        if: 'attributes.type == "turn_context"'
      - type: retain
        fields: ["attributes[\"loom.runtime\"]", "attributes[\"loom.session_id\"]", "attributes[\"loom.model\"]"]
      - type: remove
        field: body
  file_log/pi:
    include: ["/var/lib/loom-sessions/pi/**/*.jsonl"]
    start_at: beginning
    storage: file_storage/filelog
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes
        on_error: send_quiet
      - type: add
        field: attributes["loom.runtime"]
        value: "pi"
      - type: move
        from: attributes.sessionId
        to: attributes["loom.session_id"]
        if: 'attributes.sessionId != nil'
      - type: move
        from: attributes.provider
        to: attributes["loom.provider"]
        if: 'attributes.type == "model_change"'
      - type: move
        from: attributes.modelId
        to: attributes["loom.model"]
        if: 'attributes.type == "model_change"'
      - type: move
        from: attributes.agentId
        to: attributes["loom.agent_id"]
        if: 'attributes.type == "agent_change"'
      - type: move
        from: attributes.parentAgentId
        to: attributes["loom.parent_agent_id"]
        if: 'attributes.type == "agent_change" && attributes.parentAgentId != nil'
      - type: retain
        fields: ["attributes[\"loom.runtime\"]", "attributes[\"loom.session_id\"]", "attributes[\"loom.provider\"]", "attributes[\"loom.model\"]", "attributes[\"loom.agent_id\"]", "attributes[\"loom.parent_agent_id\"]"]
      - type: remove
        field: body
  # Retroactive-only (#8668 covers the live path). toolUseResult and message
  # content are Claude transcript fields that hold raw tool output / model
  # text; they are deliberately never referenced by a move/copy operator here,
  # so `retain` drops them unconditionally.
  file_log/claude:
    include: ["/var/lib/loom-sessions/claude/**/*.jsonl"]
    start_at: beginning
    storage: file_storage/filelog
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes
        on_error: send_quiet
      - type: add
        field: attributes["loom.runtime"]
        value: "claude"
      - type: move
        from: attributes.sessionId
        to: attributes["loom.session_id"]
        if: 'attributes.sessionId != nil'
      - type: add
        field: attributes["loom.duration_sec"]
        value: 'EXPR(attributes.durationMs / 1000)'
        if: 'attributes.durationMs != nil'
      - type: retain
        fields: ["attributes[\"loom.runtime\"]", "attributes[\"loom.session_id\"]", "attributes[\"loom.duration_sec\"]"]
      - type: remove
        field: body
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  # ---------------------------------------------------------------------
  # ci.job.log secret scrubbing (#8825) — THE REDACTION BOUNDARY.
  #
  # `ci.job.log` is the one and only record kind whose body is free text the
  # daemon did not author: GitHub Actions job logs, forwarded unfiltered
  # apart from a per-job size cap, because the operator decision for #8825
  # makes this collector — not the source — responsible for redaction.
  #
  # Scope. Every statement is guarded by `attributes["loom.ci.chunk_index"]
  # != nil and IsString(body)`. That attribute is emitted by, and only by,
  # ci.job.log chunks (CI_LOG_CHUNK_MARKER_KEY in
  # loom-daemon/src/telemetry/ci.rs), so no other kind's body can ever be
  # rewritten here, and a non-string body is left alone rather than erroring
  # the batch. This stage runs BEFORE transform/privacy so a secret is gone
  # before anything else touches the record.
  #
  # The class list below is the reviewable source of truth together with
  # CI_LOG_SCRUB_CLASSES in loom-daemon/src/telemetry/ci.rs; the contract
  # test `collector_fanout::gateway_scrubs_exactly_the_declared_ci_log_classes`
  # fails if the two disagree in either direction, so a new secret family is
  # added HERE, to that constant, and to the test in the same PR.
  #
  # Order matters and is load-bearing:
  #   1. `authorization` eats the rest of an `Authorization:` header line
  #      before anything can leave its value behind.
  #   2. `bearer-token` catches `Bearer <token>` anywhere else.
  #   3..7 each consume their own key name along with the value.
  #   8. `credential` is the broad `name=value` sweep; its value pattern
  #      excludes `[` so it can never re-redact an earlier `[REDACTED:...]`
  #      marker into a less specific one.
  # Every statement below is a YAML SINGLE-quoted scalar on purpose: it reaches
  # OTTL verbatim (only '' -> ' is unescaped), so the backslash escapes in the
  # regexes are OTTL's, not YAML's. A double-quoted scalar would consume them
  # twice and silently change what is matched.
  transform/ci_log_redaction:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - 'replace_pattern(body, "(?i)authorization[\"'' ]*[:=].*", "[REDACTED:authorization]") where attributes["loom.ci.chunk_index"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?i)bearer\\s+[A-Za-z0-9._~+/-]{16,}=*", "[REDACTED:bearer-token]") where attributes["loom.ci.chunk_index"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}", "[REDACTED:github-token]") where attributes["loom.ci.chunk_index"] != nil and IsString(body)'
          - 'replace_pattern(body, "github_pat_[A-Za-z0-9_]{20,}", "[REDACTED:github-token]") where attributes["loom.ci.chunk_index"] != nil and IsString(body)'
          - 'replace_pattern(body, "sk-ant-[A-Za-z0-9_-]{16,}", "[REDACTED:anthropic-key]") where attributes["loom.ci.chunk_index"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?i)(?:api[_-]?key|apikey|secret[_-]?key|access[_-]?token)[\"'' ]*[:=][\"'' ]*sk-[A-Za-z0-9_-]{16,}", "[REDACTED:api-key]") where attributes["loom.ci.chunk_index"] != nil and IsString(body)'
          - 'replace_pattern(body, "AKIA[0-9A-Z]{16}", "[REDACTED:aws-access-key-id]") where attributes["loom.ci.chunk_index"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?i)aws_secret_access_key[\"'' ]*[:=][\"'' ]*[A-Za-z0-9/+=]{40}", "[REDACTED:aws-secret-access-key]") where attributes["loom.ci.chunk_index"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?i)(?:password|passwd|secret|token|api[_-]?key)[\"'' ]*[:=][\"'' ]*[^\\s\"''&\\[]{6,}", "[REDACTED:credential]") where attributes["loom.ci.chunk_index"] != nil and IsString(body)'
  # ---------------------------------------------------------------------
  # session.output secret scrubbing (#9764) — DEFENCE IN DEPTH, NOT THE
  # BOUNDARY.
  #
  # `session.output` is the second kind whose body is text the daemon did not
  # author: readable agent output from a live run. Unlike ci.job.log, its
  # PRIMARY redaction happens at the source — every body passes
  # `telemetry::kinds::session_output::redact::scrub` before a record is even
  # constructed, and the applied policy rides on the record as
  # `loom.session.output.redaction`. This stage applies the same classes
  # again so that neither layer is ever the only one, and so a body that
  # reached this gateway from an older producer build is still scrubbed.
  #
  # Scope. Every statement is guarded by
  # `attributes["loom.session.output.event_id"] != nil and IsString(body)`.
  # That attribute is emitted by, and only by, session.output records
  # (`observability/otlp/mapping/session_output.rs`), so no other kind's body
  # can be rewritten here. Like the CI stage it runs BEFORE
  # transform/privacy.
  #
  # NOTE: this stage is NOT what keeps prompts, thinking blocks, tool
  # arguments or raw tool results out of the feed. Those never become a
  # record at all (`observability/session_output/claude.rs`). A regex is the
  # wrong boundary for a content category, and is not used as one.
  #
  # Single-quoted YAML scalars for the same reason as the CI stage above: the
  # backslash escapes are OTTL's, not YAML's.
  transform/session_output_redaction:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - 'replace_pattern(body, "(?i)authorization[\"'' ]*[:=].*", "[REDACTED:authorization]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?i)bearer\\s+[A-Za-z0-9._~+/-]{16,}=*", "[REDACTED:bearer-token]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}", "[REDACTED:github-token]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "github_pat_[A-Za-z0-9_]{20,}", "[REDACTED:github-token]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "sk-ant-[A-Za-z0-9_-]{16,}", "[REDACTED:anthropic-key]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?i)(?:api[_-]?key|apikey|secret[_-]?key|access[_-]?token)[\"'' ]*[:=][\"'' ]*sk-[A-Za-z0-9_-]{16,}", "[REDACTED:api-key]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "AKIA[0-9A-Z]{16}", "[REDACTED:aws-access-key-id]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?i)aws_secret_access_key[\"'' ]*[:=][\"'' ]*[A-Za-z0-9/+=]{40}", "[REDACTED:aws-secret-access-key]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?i)(?:password|passwd|secret|token|api[_-]?key)[\"'' ]*[:=][\"'' ]*[^\\s\"''&\\[]{6,}", "[REDACTED:credential]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED:email]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
          - 'replace_pattern(body, "(?s)-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----", "[REDACTED:private-key]") where attributes["loom.session.output.event_id"] != nil and IsString(body)'
  # Allow only Loom's structured operational attributes. Source-side privacy
  # enforcement owns free-text bodies, span names and nested values for every
  # record kind EXCEPT TWO:
  #
  #   - `ci.job.log` (#8825) carries a GitHub Actions job log as its body, by
  #     operator decision, scrubbed by transform/ci_log_redaction above.
  #   - `session.output` (#9764) carries live, ALREADY producer-redacted agent
  #     output, re-scrubbed by transform/session_output_redaction above as
  #     defence in depth.
  #
  # Both scrub stages run before this one, and each is scoped to its own kind
  # by its own unique marker attribute — a different key per kind, so neither
  # exception can widen the other. That is the whole set: no other kind's body
  # is touched, and no attribute of either kind is derived from body text, so
  # the allowlist below stays the only gate on attributes. The reviewed
  # registry is `BODY_EXCEPTIONS` in loom-daemon/tests/collector_filelog.rs.
  transform/privacy:
    error_mode: propagate
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "service.instance.id", "host.id", "host.name"])
      - context: log
        statements:
          # loom.session_id / loom.agent_id / loom.parent_agent_id (#8669): the
          # interactive-session filelog receivers above are the only current
          # producers of these three keys. session.summary (#8757) adds
          # loom.parent_session_id plus its counter/histogram keys.
          # session.analysis (#8760) adds loom.cost_usd, loom.retry_loops,
          # loom.longest_tool_call.{tool,duration_ms} and loom.anomalies.
          # #9445 adds loom.session_kind to session.summary (sweep / role /
          # interactive) — dropping it here would make an issue-less row
          # ambiguous again, which is the defect that issue fixed.
          # daemon.event (#8760, G4) adds loom.topic and loom.payload — the
          # payload is already-reviewed, small, operator-facing event-bus
          # JSON (never transcript content), carried whole as one string.
          # ci.run / ci.job (#8824) and ci.job.log (#8825) add exactly the
          # loom.ci.* keys below — CI_LOG_ATTRIBUTE_KEYS in
          # loom-daemon/src/telemetry/ci.rs, asserted byte-for-byte by the
          # ci_telemetry contract test. Since #9089, loom.ci.queued_ms is also
          # set on ci.job (started_at - created_at, the per-job analogue of
          # ci.run's queue segment), ci.job adds loom.ci.shard.{index,
          # total,kind} for a matrix leg, and ci.job adds
          # loom.ci.dependency_wait_ms — the segment BEFORE its queue segment,
          # time blocked on `needs:` predecessors before the job existed.
          # loom.ci.chunk_index is additionally the
          # predicate transform/ci_log_redaction is scoped by, so dropping it
          # here would break nothing at ingest but WOULD make a job log
          # unreconstructable (chunk ordering is the only contract).
          # sweep.outcome (#9440) adds loom.tokens_status and, on a
          # non-`measured` status, loom.tokens_status_reason: the pair that
          # separates "this sweep burned nothing" from "this sweep burned
          # something we could not read". Both are closed vocabularies, so a
          # SigNoz query can GROUP BY either; stripping them here would leave
          # an absent loom.tokens_in unreadable again, which is the whole hole
          # #9440 closed.
          # sweep.started / sweep.outcome (#9432, epic #9429) add
          # loom.story_points -- the Curator's a-priori size estimate as a
          # NUMERIC attribute, present only when the issue carried exactly
          # one legal points:* label. The points-throughput rollup (#9433)
          # reads it off sweep.outcome rows; stripping it here would make
          # "points landed per day" silently unanswerable -- every sweep
          # would look unsized, which is the absent-vs-zero confusion that
          # question set exists to prevent.
          # sweep.started (#11280) carries the dispatch facts under
          # sweep.outcome's key names: loom.model / loom.effort /
          # loom.runtime / loom.attempt_index / loom.trigger /
          # loom.previous_sweep_id, plus loom.model_source (explicit|default)
          # (SWEEP_START_FACT_LOG_ATTRIBUTE_KEYS in
          # loom-daemon/src/telemetry/start_facts.rs, contract-tested).
          # sweep.outcome adds the sweep-facts keys (#9586): loom.disposition
          # (#9441) and loom.tokens_unattributed_* (#9443) are already emitted;
          # loom.hw_lines_* / loom.hw_files / loom.generated_lines /
          # loom.test_lines carry the #9466 landed-size split (the story-points
          # rubric's anchor); loom.attempt_index / loom.previous_sweep_id /
          # loom.trigger / loom.pr_numbers / loom.rework_events carry the
          # #9444 attempt lineage. The sweep-facts extraction (#9555, SF1..SF8)
          # reads all of them -- a key stripped here is a silently-NULL column,
          # never an error (contract-tested by
          # loom-daemon/tests/sweep_facts_gateway_survival.rs).
          # pr.resolved (#10519) and eta.stage_outcome (#10929) add the
          # loom.eta.pr.* / loom.eta.stage_outcome.* keys and loom.fact_id
          # (OUTCOME_FACT_LOG_ATTRIBUTE_KEYS in
          # loom-daemon/src/telemetry/kinds/stage_outcome.rs, contract-tested);
          # their body is the record's JSON, which keep_keys does not touch.
          # The wire tags and keys keep their historical `eta` prefix. The rest
          # of the former ETA kinds were retired by #11098.
          # auto_update.tick (#10414) adds the loom.auto_update.* keys
          # (AUTO_UPDATE_LOG_ATTRIBUTE_KEYS in
          # loom-daemon/src/telemetry/kinds/auto_update_tick.rs, contract-tested).
          # pass.summary / pass.verdict (#10752) add the loom.pass.* keys
          # (PASS_LOG_ATTRIBUTE_KEYS in loom-daemon/src/telemetry/kinds/pass.rs,
          # contract-tested) beside the shared loom.repo / loom.role.
          # token_ranking.refresh (#10744) adds the loom.token_ranking.* keys
          # (TOKEN_RANKING_LOG_ATTRIBUTE_KEYS in
          # loom-daemon/src/telemetry/kinds/token_ranking_refresh.rs, contract-tested);
          # loom.token_ranking.workspace is the workspace root's final path
          # component, never the absolute path.
          # fleet.state (#10196) adds the loom.fleet.* anchor/delta/chunk scalars
          # (FLEET_STATE_LOG_ATTRIBUTE_KEYS in
          # loom-daemon/src/telemetry/kinds/fleet_state.rs, contract-tested);
          # its rows and census are the body.
          # host.export (#11124) adds the loom.host_export.* keys
          # (HOST_EXPORT_LOG_ATTRIBUTE_KEYS in
          # loom-daemon/src/telemetry/kinds/host_export.rs, contract-tested).
          # daemon.start / daemon.shutdown / daemon.heartbeat (#10023) add
          # loom.daemon.* and loom.export.* (contract-tested in
          # observability/daemon_lifecycle_tests.rs); body is the payload JSON.
          - keep_keys(attributes, ["loom.kind", "loom.record_id", "loom.fact_id", "loom.repo", "loom.repo.visibility", "loom.sweep_id", "loom.issue", "loom.pr_number", "loom.role", "loom.phase", "loom.attempt", "loom.runtime", "loom.provider", "loom.model", "loom.model_source", "loom.configured_model", "loom.result", "loom.failure_class", "loom.effort", "loom.doctor_cycles", "loom.judge_verdict", "loom.recovered", "loom.timing_source", "loom.story_points", "loom.disposition", "loom.tokens_unattributed_in", "loom.tokens_unattributed_out", "loom.hw_lines_added", "loom.hw_lines_deleted", "loom.hw_files", "loom.generated_lines", "loom.test_lines", "loom.attempt_index", "loom.previous_sweep_id", "loom.trigger", "loom.pr_numbers", "loom.rework_events", "loom.tool.name", "loom.duration_sec", "loom.total_duration_sec", "loom.phase_durations", "loom.models_used", "loom.tokens_by_model", "loom.judge_verdicts", "loom.tokens_in", "loom.tokens_out", "loom.tokens_status", "loom.tokens_status_reason", "loom.lines_added", "loom.lines_deleted", "loom.config.runtime", "loom.config.provider", "loom.config.configured_model", "loom.config.arm", "loom.gated_pool", "loom.actions.comments_posted", "loom.actions.issues_labeled", "loom.actions.prs_merged", "loom.session_id", "loom.agent_id", "loom.parent_agent_id", "loom.parent_session_id", "loom.session_kind", "loom.wall_ms", "loom.turns", "loom.tool_calls", "loom.tool_errors", "loom.outcome", "loom.tokens.input", "loom.tokens.output", "loom.tokens.cache_read", "loom.tokens.cache_write", "loom.cost_usd", "loom.retry_loops", "loom.longest_tool_call.tool", "loom.longest_tool_call.duration_ms", "loom.anomalies", "loom.topic", "loom.payload", "loom.ci.run_id", "loom.ci.run_attempt", "loom.ci.workflow", "loom.ci.ref", "loom.ci.head_sha", "loom.ci.event", "loom.ci.status", "loom.ci.conclusion", "loom.ci.trigger_reason", "loom.ci.triggered_by", "loom.ci.started_at", "loom.ci.completed_at", "loom.ci.observed_at", "loom.ci.duration_ms", "loom.ci.que