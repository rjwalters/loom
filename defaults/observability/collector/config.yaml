      - context: datapoint
        statements:
          # loom.ci.{run,job}.duration_ms histograms (#8824) add the
          # low-cardinality CI_METRIC_LABEL_KEYS: repo, workflow, job, runner,
          # conclusion — never a sha, ref, or run/issue number.
          # metric.points (#8860) adds OPS_METRIC_LABEL_KEYS: reason and
          # provider (account/model/state were already kept). provider also
          # stops stripping the existing loom.tokens.* per-provider label.
          # github.ratelimit.* (#10022) adds resource (core|graphql).
          # loom.daemon.task_* (#10414) adds task (a fixed daemon loop name).
          # W1 adds owner (per-bucket github.ratelimit.* gauges; #10343 adds
