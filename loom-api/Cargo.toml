[package]
name = "loom-api"
version = "0.15.0"
edition = "2021"
description = "External REST API for Loom analytics data access"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
# Reuse the production activity-DB schema (loom-daemon::activity::init_schema)
# for test fixtures instead of a hand-rolled schema that can drift — see #3964.
loom-daemon = { path = "../loom-daemon" }

[[bin]]
name = "loom-api"
path = "src/main.rs"
