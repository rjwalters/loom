[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-tools"
version = "0.1.0"
description = "Shared Python utilities for Loom orchestration scripts"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "rich>=13.0",
    "requests>=2.28",
]

[project.scripts]
# loom-shepherd removed in Phase 3.3 (#3400) — shepherd brain deleted
# loom-shepherd = "loom_tools.shepherd.cli:main"
loom-agent-wait = "loom_tools.agent_wait:main"
# loom-daemon-diagnostic removed in epic #4081 phase 3 (#4274) — daemon_diagnostic.py
# deleted; the native `loom-daemon status` reports daemon/registry health.
# loom-daemon-loop removed in Phase 3.2 (#3399) — daemon.py (V1) deleted
# loom-daemon-loop = "loom_tools.daemon:main"
# loom-stuck-detection removed in epic #4081 phase 3 (#4274) — stuck_detection.py
# deleted (safe no-op since v0.11.0); native surface is `loom-daemon status` + the
# sweep registry (mcp__loom__list_sweeps).
loom-claim = "loom_tools.claim:main"
# loom-clean removed in epic #4081 Phase 3 family 2 (#4272) — ported to
# native `loom-daemon clean` (loom-tools/src/loom_tools/clean.py deleted)
# loom-clean = "loom_tools.clean:main"
# loom-milestone removed in Phase 3.3 (#3400) — milestones.py deleted with shepherd brain
# loom-worktree removed in epic #4081 Phase 3 family 2 (#4272) — pure
# argparse-over-bash glue with zero execution-path callers; deleted outright
# (worktree.py never delegated to from defaults/scripts/worktree.sh)
# loom-worktree = "loom_tools.worktree:main"
# loom-recover-orphans removed in epic #4081 Phase 3 family 2 (#4272) —
# ported to native `loom-daemon recover-orphans`
# (loom-tools/src/loom_tools/orphan_recovery.py deleted)
# loom-recover-orphans = "loom_tools.orphan_recovery:main"
# loom-validate-state removed in Phase 3.2 (#3399) — validate_state.py deleted
# loom-validate-state = "loom_tools.validate_state:main"
# loom-status removed in epic #4081 phase 3 (#4274) — status.py deleted; the
# `loom status` verb execs the native bash defaults/scripts/cli/loom-status.sh, and
# `loom-daemon status [--json|--pipeline]` is the native pipeline/health surface.
# loom-cleanup removed in epic #4081 Phase 3 family 2 (#4272) — ported to
# native `loom-daemon cleanup logs` (loom-tools/src/loom_tools/cleanup.py deleted)
# loom-cleanup = "loom_tools.cleanup:main"
# loom-agent-metrics removed in epic #4081 phase 3 (#4274) — agent_metrics.py
# deleted; ported to native `loom-daemon stats <command>` (summary/effectiveness/
# costs/velocity, incl. --period and --by-model parity); agent-metrics.sh
# repointed.
# loom-agent-metrics = "loom_tools.agent_metrics:main"
loom-validate-phase = "loom_tools.validate_phase:main"
loom-agent-spawn = "loom_tools.agent_spawn:main"
# loom-health-monitor removed in epic #4081 phase 3 (#4274) — health_monitor.py
# deleted (safe no-op since v0.11.0); native surface is loom-daemon/src/health_monitor.rs
# + `loom-daemon status`.
# loom-snapshot removed in Phase 3.2 (#3399) — snapshot.py (daemon brain) deleted.
# forge_snapshot.py removed in epic #4081 phase 3 (#4274); pipeline data is native
# via loom-daemon/src/pipeline_snapshot.rs (`loom-daemon status --pipeline`).
loom-checkpoint = "loom_tools.checkpoints:main"
# loom-daemon removed in Phase 3.2 (#3399) — daemon_v2/ brain deleted
# loom-daemon = "loom_tools.daemon_v2.cli:main"
# loom-test-failure-analysis removed in Phase 3.2 (#3399) — test_failure_analysis.py retiring
# loom-test-failure-analysis = "loom_tools.test_failure_analysis:main"
loom-usage = "loom_tools.common.usage:main"
loom-backlog = "loom_tools.backlog:main"
# loom-forge / loom-auto-merge ported to the native `loom-daemon forge`
# subcommand group (epic #4081 Phase 3, family 3). The shared client stack in
# loom_tools/common/{forge,github,gitea,cached_forge}.py is preserved — it still
# backs backlog/clean/daemon_cleanup/daemon_diagnostic/forge_snapshot/
# orphan_recovery/stuck_detection.
loom-tokens = "loom_tools.tokens.cli:main"
loom-resolve-model = "loom_tools.model_tiers:main"
loom-search = "loom_tools.semantic_search:main"

[project.optional-dependencies]
# Tier B pluggable vector-embeddings for loom-search (#4370, follow-up to
# #4339). Never a default/required dependency — only pulled in when a host
# opts into `search.embeddings.provider=local`. See
# defaults/docs/semantic-search.md and loom_tools/embedders.py.
search = ["fastembed>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
