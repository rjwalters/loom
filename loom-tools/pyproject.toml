[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# `loom-search` carve-out (epic #4081 Phase 4, #4557)
#
# The Python `loom-tools` package was retired in epic #4081 Phase 4: everything
# it used to provide is now native in the Rust `loom-daemon` binary (tokens,
# clean, forge, claim, checkpoint, agent-spawn/agent-wait, status/stats,
# resolve-model, validate-phase, …) or in `defaults/scripts/*.sh`.
#
# ONE module was carved out of that deletion: `loom_tools.semantic_search`
# (console script `loom-search`), which backs the opt-in, off-by-default
# semantic-search feature documented in `defaults/docs/semantic-search.md`. It
# has no native Rust port, and no epic #4081 phase ever decided whether to port
# or retire it — so it survives here, unchanged, until that product decision is
# made. See `docs/adr/0013-loom-tools-python-retirement.md`.
#
# Nothing on the core Loom daemon path imports this package. A fresh machine
# provision needs no Python at all; installing this package is only required to
# use `loom-search`.
#
# The three surviving `loom_tools/common/` modules (`config.py`,
# `config_resolver.py`, `repo.py`) are here solely because
# `semantic_search.py` imports them. `config_resolver.py` additionally remains
# one of the three implementations bound by the #4039 cross-language
# conformance fixture (`tests/fixtures/config_resolver/`, also consumed by
# `loom-daemon/src/config_resolver.rs` and
# `defaults/scripts/tests/test-config-resolver.sh`) — do not delete that
# fixture tree with this package.
# ---------------------------------------------------------------------------

[project]
name = "loom-tools"
version = "0.1.0"
description = "loom-search: opt-in local semantic search over Loom sweep summaries and PR history"
requires-python = ">=3.10"
license = "MIT"
# Zero runtime dependencies: `semantic_search.py` is stdlib-only (sqlite3 FTS5
# + subprocess `gh`). The former `rich`/`requests` dependencies belonged to the
# modules retired in epic #4081.
dependencies = []

[project.scripts]
# `loom-search` is the ONLY surviving console script. Every other entry point
# this package used to ship was ported to the native `loom-daemon` binary or
# deleted outright over epic #4081 Phases 1-3; the full removed-entry-point map
# lives in `docs/adr/0013-loom-tools-python-retirement.md` (and, for the
# pre-#4081 shepherd/daemon removals, ADR-0009 +
# `docs/migration/v0.10.0-shepherd-deprecation.md`).
#
# In particular `loom-tokens` is gone: use `loom-daemon tokens <subcommand>`
# (bootstrap / check / unblock / …).
loom-search = "loom_tools.semantic_search:main"

[project.optional-dependencies]
# Tier B pluggable vector-embeddings for loom-search (#4370, follow-up to
# #4339). Never a default/required dependency — only pulled in when a host
# opts into `search.embeddings.provider=local`. See
# defaults/docs/semantic-search.md and loom_tools/embedders.py.
search = ["fastembed>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
