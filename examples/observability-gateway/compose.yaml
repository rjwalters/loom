name: loom-cloud-observability
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command:
    - --config=/etc/otelcol/config.yaml
    user: ${LOOM_COLLECTOR_UID:?set a non-root UID}:${LOOM_COLLECTOR_GID:?set its
      GID}
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 30s
    restart: unless-stopped
    ports:
    - 127.0.0.1:14318:4318
    - 127.0.0.1:13133:13133
    - 127.0.0.1:18888:8888
    volumes:
    - ./config.yaml:/etc/otelcol/config.yaml:ro
    - ${LOOM_CODEX_SESSIONS_DIR:?set an absolute path to the Codex session store}:/hostsessions/codex:ro
    - ${LOOM_PI_SESSIONS_DIR:?set an absolute path to the pi session store}:/hostsessions/pi:ro
    - ${LOOM_CLAUDE_PROJECTS_DIR:?set an absolute path to the Claude Code transcript store}:/hostsessions/claude:ro
    - ${LOOM_COLLECTOR_STATE_DIR:?set an absolute local writable directory}:/var/lib/otelcol
    secrets:
    - loom_ingest_key
    - signoz_ingest_key
    - clickhouse_password
    environment:
      LOOM_HOST_ID: ${LOOM_HOST_ID:?set the host telemetry identity}
      LOOM_SIGNOZ_OTLP_ENDPOINT: ${LOOM_SIGNOZ_OTLP_ENDPOINT:?set the HTTPS SigNoz
        OTLP base endpoint}
      LOOM_CLICKHOUSE_ENDPOINT: ${LOOM_CLICKHOUSE_ENDPOINT:?set actual ClickHouse
        service HTTPS endpoint}
      LOOM_CLICKHOUSE_USERNAME: ${LOOM_CLICKHOUSE_USERNAME:?set dedicated database
        ingestion user}
secrets:
  loom_ingest_key:
    file: ${LOOM_COLLECTOR_INGEST_KEY_FILE:?set an absolute local secret file}
  signoz_ingest_key:
    file: ${LOOM_SIGNOZ_INGEST_KEY_FILE:?set external SigNoz key file}
  clickhouse_password:
    file: ${LOOM_CLICKHOUSE_PASSWORD_FILE:?set external database password file}
