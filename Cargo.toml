[workspace]
members = ["loom-api", "loom-daemon"]
resolver = "2"

# Single source of the crate version (#7780). Both members inherit via
# `version.workspace = true`, mirroring how they already inherit shared
# dependencies from [workspace.dependencies] below. Before this, each crate
# hardcoded its own version, so every bump edited two files that could drift
# apart independently -- the "the bump missed a file" class of #6536/#6730.
[workspace.package]
version = "0.19.1176"
# The repo this workspace is built from — compiled into `loom-daemon` via
# `repository.workspace = true` + `env!("CARGO_PKG_REPOSITORY")` (#8513). This
# is the build-time fallback `auto_update`'s release resolver falls back to
# when neither `LOOM_DAEMON_UPDATE_GH_REPO` nor `LOOM_MACHINE_CHECKOUT` is set:
# unlike the runtime workspace's own `origin` remote, it can never resolve to
# a consumer repo's own (possibly lower-versioned) releases, because it is
# baked in at compile time from the checkout the release was actually built
# from.
repository = "https://github.com/rjwalters/loom"
# Both members inherit this (#9085). It records the licence this repo already
# ships in LICENSE; without it both crates appear in `cargo deny check
# licenses` as unlicensed packages, and the daily supply-chain job cannot
# distinguish "this workspace declares nothing" from a real dependency
# problem. Metadata correction, not a licensing decision.
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0"

# Cap rustc's peak memory for the dev/test profiles (#11094, item 4). One
# `loom-daemon` codegen unit peaked at 7-13 GB with full debuginfo, enough for
# two concurrent sweeps to OOM a 30 GB worker. `line-tables-only` keeps
# backtraces and drops the type-level DWARF that dominates that peak. This
# matches CI (CARGO_PROFILE_{DEV,TEST}_DEBUG in ci.yml), so local builds now
# compile the same way CI does. Release is untouched.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
