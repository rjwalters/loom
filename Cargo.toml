[workspace]
members = ["loom-api", "loom-daemon"]
resolver = "2"

# Single source of the crate version (#7780). Both members inherit via
# `version.workspace = true`, mirroring how they already inherit shared
# dependencies from [workspace.dependencies] below. Before this, each crate
# hardcoded its own version, so every bump edited two files that could drift
# apart independently -- the "the bump missed a file" class of #6536/#6730.
[workspace.package]
version = "0.19.56"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0"
