[package]
name = "loom-daemon"
version.workspace = true
repository.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.23", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
base64 = "0.23"
# `functions` enables `create_scalar_function`, which the landed-size
# execution test (`tests/landed_size_sqlite.rs`) uses to provide the `ln`/`exp`
# math functions D1 ships and the bundled build does not (#9934). `limits`
# enables `set_limit`, which the D1 execution tests use to apply D1's 5-term
# compound-SELECT ceiling (`tests/support/d1_sqlite.rs`, #10066).
rusqlite = { version = "0.40", features = ["bundled", "functions", "limits"] }
regex = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
sha2 = "0.11.0"
hex = "0.4.3"
toml = "1.1"
# Minimal async HTTP client for the observability exporter (#4705): JSON-over-
# HTTPS push only, no TLS-backend duplication with other tooling in this repo.
# `rustls-tls` avoids an OpenSSL system dependency; `default-features = false`
# drops reqwest's default blocking/cookie/multipart surface this exporter
# never touches.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "json"] }
# Ed25519 verification of signed operator-decision markers (#10827). Already
# compiled into this binary as rustls' crypto provider (via reqwest above), so
# naming it directly adds no new crate; the feature set matches what rustls
# already enables, so feature unification changes nothing. Verify-only: Loom
# never holds a signing key.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
libc = "0.2"
# OTLP wire-format types for the optional `otlp` exporter (#4858, Epic #4702
# Phase 4) — gated behind the `otlp` feature so a default (`HttpsExporter`-
# only) build adds no new dependency. `gen-tonic-messages` generates the OTLP
# request/record structs via `prost` (message types only); `with-serde` adds
# JSON (de)serialization to those structs. `gen-tonic`/`tonic` themselves are
# deliberately NOT enabled — `OtlpExporter` posts the JSON encoding over the
# existing `reqwest` client (reusing `super::sender`'s drain/retry loop), so
# no gRPC transport stack is pulled in.
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["logs", "metrics", "trace", "gen-tonic-messages", "with-serde"], optional = true }

tempfile = "3.27"
# `.tar.zst` transcript archiving (#8494): `tar` builds/reads the archive
# container, `zstd` (bundled C library, same "vendor the native dep" pattern
# `rusqlite`'s `bundled` feature above already uses) compresses it. Default
# features only — no `zstdmt`/`pkg-config`/`cmake`, so a plain build needs
# nothing beyond the C toolchain `rusqlite`'s bundled build already requires.
tar = "0.4.46"
zstd = "0.14.0"
# Format-preserving TOML for pooled-profile provisioning (#8672): the
# key-merge into a profile's `config.toml` must leave every key Loom does not
# own — comments included — byte-identical, which a parse/re-serialize round
# trip through a value-tree crate (`toml`) cannot promise. `toml_edit` is the
# same document model cargo itself uses. Default features only (`parse` +
# `display`); `serde` is deliberately off — the provisioner walks the document
# tree directly rather than deserializing a profile's config into typed structs.
toml_edit = "0.25"

[dev-dependencies]
tokio-test = "0.4"
serial_test = "4.0"
criterion = "0.8"

[[bench]]
name = "terminal_benchmarks"
harness = false

[features]
# Off by default — enabling it selects `OtlpExporter` (see
# `observability.exporter = "otlp"`); a plain `cargo build`/`cargo test` never
# pulls in `opentelemetry-proto`.
otlp = ["dep:opentelemetry-proto"]
