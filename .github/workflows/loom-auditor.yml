name: Loom Auditor

# Periodic support role for the Loom orchestration system.
#
# Auditor validates the main branch build and runtime health, filing issues
# (with the `loom:auditor` proposal label) when regressions are detected.
#
# Cadence: every 10 minutes (matches the daemon's historical interval).
#
# SECURITY -- read before enabling. Running this workflow runs a Claude agent
# with permissive tool access (`--dangerously-skip-permissions`) and a
# write-scoped GITHUB_TOKEN over issue and PR text that anyone can author on
# a public repository. That text is agent input, and a write-scoped agent
# acting on untrusted input is a trust decision, not a default. Only enable
# the schedule on repositories where you accept that tradeoff (for example,
# private repos, or public repos where only trusted collaborators can open
# issues and PRs), and never add a `pull_request_target` trigger to this
# workflow: that event runs with the base repository's secrets and write
# token on behalf of fork-authored changes.
#
# Disabled by default. To enable on your fork:
#   1. Uncomment the `schedule:` block below.
#   2. Add a `CLAUDE_API_KEY` secret to the repository
#      (Settings -> Secrets and variables -> Actions).
#
# This is Phase 2a of the shepherd/daemon deprecation epic (#3372 / #3375).

on:
  # Not dead code: this commented block IS the fork opt-in the header describes (#8060).
  # schedule:
  #   # Uncomment and set CLAUDE_API_KEY secret to enable.
  #   - cron: "*/10 * * * *"
  workflow_dispatch:  # Allow manual runs for testing.

jobs:
  auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run auditor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Bare tier alias, not a pinned ID (#8060). The #3477 Phase 1 rule was
        # "pin an exact ID and bump deliberately on lineup changes"; nobody
        # bumped, and these five files sat two generations behind while the
        # daemon path resolved `sonnet`/`opus` to the current generation. A
        # deliberate bump nobody performs is a stale pin, so the alias — which
        # the CLI resolves at dispatch — is the honest encoding of the intent.
        # `stale-model-pins` in ci.yml keeps a pinned ID from creeping back.
        run: claude -p "/loom:auditor" --model sonnet --dangerously-skip-permissions
