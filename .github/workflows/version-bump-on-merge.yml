name: Version Bump on Merge

# Single post-merge owner for VERSION (and the other version-bearing files
# scripts/version.sh manages) -- see #7743.
#
# Why this exists: previously every PR touching `defaults/` had to carry a
# 9(then 7)-file mechanical version-bump diff, which conflicted under any
# concurrency and produced a steady stream of Doctor/operator rounds re-cut
# against a moved `main` (nine closed issues about this in 60 days, #7743's
# own body has the table). Moving the bump here removes the requirement
# instead of teaching every actor to comply with it better: one workflow,
# always bumping from the tree it is bumping -- correct by construction, not
# by review. `defaults/scripts/check-defaults-version-bump.sh --forbid-bump`
# (wired into ci.yml's `defaults-version-bump-check` job) is the matching
# gate: it now REJECTS a PR that hand-edits a version-bearing file's value,
# since that value change should only ever come from this workflow.
#
# Self-trigger note: the bump commit this workflow publishes never touches
# `defaults/` (it only rewrites the version-bearing files themselves --
# `package.json`, `mcp-loom/package.json`, `Cargo.toml`,
# `VERSION`, `.loom/install-metadata.json` if present, plus the derived
# `Cargo.lock` / `mcp-loom/package-lock.json`), so the `paths: ['defaults/**']`
# filter below can never see its own push and re-trigger a loop. Do NOT add
# an extra guard for that -- a naive one (e.g. skipping when the pusher is
# this workflow's own bot identity) would also suppress a legitimate human
# push that happens to share that identity, for no benefit, since the path
# filter already makes the loop structurally impossible.
#
# Publishing (2AMLogic/2am#4617 slice 3, rulings on #12063): this workflow
# never pushes. It used to push the bump commit with a `loom-fleet-dispatch`
# App token, which needed a bypass on main's ruleset that could also skip
# required checks. Now the bump is POSTed to the fleet publisher
# (https://fleet-publish.2amlogic.com/v1/publish_version_bump), which holds
# the only key (`loom-fleet-publisher`) and commits exactly the version files,
# exactly one patch step, compare-and-swap on the parent we name. The caller
# is authenticated by this job's GitHub Actions OIDC token; the publisher pins
# repository, this workflow file at refs/heads/main, a GitHub-hosted runner
# and event_name push / schedule / workflow_dispatch. No secret is read here.
# There is no fallback to a direct push: a refusal fails the run red.
#
# Two jobs, because every step of a job holding `id-token: write` can mint a
# token for that audience (PR review of 2AMLogic/2am#4621). `bump-version`
# needs the toolchain actions (cargo and npm regenerate the lockfiles) and
# gets no id-token; `publish` has `id-token: write` and runs NO action at all,
# only its own shell: it clones main with plain git, re-runs the cadence gate,
# applies the computed bump and calls the publisher.
#
# Releasing is not this workflow's job (#10826): a version in a bump commit is
# released only if that commit, or a later `main` commit carrying the same
# unreleased `VERSION`, finishes green in `CI` — release.yml runs on
# `workflow_run` of `CI`, not on this push. A version whose commits never go
# green is skipped (no tag); see defaults/docs/release-cadence.md.
#
# Cadence (#11174): at most ONE bump per RELEASE_MIN_INTERVAL (repo variable
# `vars.RELEASE_MIN_INTERVAL`, seconds, default 86400 = 24 h). Before this,
# every `defaults/` merge cut a version (52 bumps, ~955 workflow runs in one
# day), each bump commit its own `main` CI run plus a release. Now merges
# inside the window just accumulate, unreleased; scripts/version-bump-gate.sh
# decides, from local git history only (no forge calls: this workflow makes
# no `gh` call at all and is off the bypass ledger), whether this run bumps:
#   push              bump if the window has elapsed, else `deferred:` (exit 0)
#   schedule (hourly) the catch-up for a quiet day: bump if the window has
#                     elapsed AND defaults/ changed since the last bump
#   workflow_dispatch `force: true` + `reason` skips the window (operator
#                     hotfix path, e.g. a fix a `loom_min_version` floor needs
#                     now); the reason and actor are recorded in the commit
# Every path still requires an unreleased defaults/ change, so no no-op
# version is ever cut. The gate runs before any toolchain setup, so a
# deferred run costs seconds.

on:
  push:
    branches: [main]
    paths:
      - "defaults/**"
  # Hourly, not daily: against a 24 h window that started at an arbitrary
  # time, a once-a-day cron can push the catch-up out to ~48 h. Hourly bounds
  # the worst case at RELEASE_MIN_INTERVAL + ~1 h (+ GitHub's own schedule
  # delay); each run is a seconds-long gate check.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bump now, skipping the release interval (operator hotfix path)"
        type: boolean
        default: false
      reason:
        description: "Why the bump is forced (required with force; recorded in the bump commit)"
        type: string
        default: ""

# Serialize runs instead of racing them -- deliberately NOT cancel-in-progress:
# a queued run re-checks the gate against whatever `main` looks like when it
# starts (which already includes any earlier run's bump commit, so it defers
# instead of bumping twice), and GitHub keeps at most one pending run per
# group anyway. Cancelling a started run would only lose a gate verdict (see
# .loom/docs/ci-principles.md).
concurrency:
  group: version-bump-on-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Computes the bump; publishes nothing and holds no id-token. Its outputs
  # are the gate's verdict, the main SHA the bump was computed on, the new
  # version and the bump itself as a gzip+base64 `git diff` of the version
  # files (a few KB; the publish job re-applies it to the same files).
  bump-version:
    name: Compute the version bump (at most once per release interval)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      parent: ${{ steps.bump.outputs.parent }}
      version: ${{ steps.bump.outputs.version }}
      patch: ${{ steps.bump.outputs.patch }}
    steps:
      # No `ref:`/pinned sha here -- always check out the CURRENT tip of
      # `main` at run start. For a queued run that matters: it must bump from
      # wherever `main` actually is now, not from the commit that originally
      # triggered it (which may already be several bumps behind by the time
      # this run gets to the front of the concurrency group).
      # Full commit history (trees, no blobs): the gate looks up the last
      # bump, which after a quiet stretch can be weeks back. With depth 1 the
      # lookup would see one commit and decide wrongly; the gate refuses a
      # shallow clone outright. Nothing in this job pushes, so the read-only
      # token is not persisted either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Before any toolchain setup or mutation. Exit 0 with decision=deferred
      # or nothing leaves VERSION alone; an unreadable history or a bad
      # RELEASE_MIN_INTERVAL fails red (never "always bump", never a silent
      # stop). inputs.reason reaches the shell only through env:, never as an
      # expression inside run: (template injection).
      - name: Release cadence gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          FORCE_REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.triggering_actor }}
          RELEASE_MIN_INTERVAL: ${{ vars.RELEASE_MIN_INTERVAL }}
        run: |
          set -euo pipefail
          # Capture the exit code instead of letting set -e end the step at
          # the assignment: the gate prints decision=error/reason=... to stdout
          # on failure, and that reason must reach the log and job summary.
          rc=0
          out="$(bash scripts/version-bump-gate.sh --event "$EVENT_NAME" --force "$FORCE" \
            --reason "$FORCE_REASON" --actor "$ACTOR" --ref origin/main)" || rc=$?
          echo "$out"
          decision="$(sed -n 's/^decision=//p' <<<"$out")"
          reason="$(sed -n 's/^reason=//p' <<<"$out")"
          echo "decision=$decision" >>"$GITHUB_OUTPUT"
          {
            echo "### Version bump gate: ${decision}"
            echo ""
            echo "$reason"
            echo ""
            echo '```'
            echo "$out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - if: steps.gate.outputs.decision == 'bump'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - if: steps.gate.outputs.decision == 'bump'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # scripts/version.sh does the bump exactly as before (cargo and npm
      # regenerate the lockfiles, which is why the toolchain actions are
      # here and not in the publish job). Nothing is committed: the
      # publisher builds the commit from the files.
      - name: Compute the version bump (no commit, no push)
        id: bump
        if: steps.gate.outputs.decision == 'bump'
        run: |
          set -euo pipefail

          # The only paths the publisher accepts; .loom/install-metadata.json
          # only where it exists (version.sh skips it otherwise).
          files=(VERSION package.json mcp-loom/package.json mcp-loom/package-lock.json
                 Cargo.toml Cargo.lock)
          if [ -f .loom/install-metadata.json ]; then
            files+=(.loom/install-metadata.json)
          fi

          parent="$(git rev-parse origin/main)"
          if [ "$(git rev-parse HEAD)" != "$parent" ]; then
            echo "ERROR: checkout HEAD is not origin/main ($parent); refusing to compute a bump on another commit." >&2
            exit 1
          fi

          ./scripts/version.sh bump patch
          version="$(./scripts/version.sh show)"

          # The bump may change version files and nothing else: anything
          # else would be silently dropped from the published commit.
          stray="$(git status --porcelain --untracked-files=all -- . \
            | cut -c4- | grep -vxF -f <(printf '%s\n' "${files[@]}") || true)"
          if [ -n "$stray" ]; then
            echo "ERROR: version.sh changed files outside the version set:" >&2
            echo "$stray" >&2
            exit 1
          fi

          patch="$(git diff --binary HEAD -- "${files[@]}" | gzip -9n | base64 -w0)"
          {
            echo "parent=$parent"
            echo "version=$version"
            echo "patch=$patch"
          } >>"$GITHUB_OUTPUT"
          echo "Computed bump to $version on $parent ($(git diff --name-only HEAD -- "${files[@]}" | wc -l) files)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Publishes the bump through the fleet publisher. `id-token: write` lives
  # here and only here, and this job runs no action (no `uses:`): every step
  # of a job that may mint an OIDC token could mint one, so the only code in
  # it is this file's shell, the repo's own gate script, git, curl and jq.
  publish:
    name: Publish the bump through fleet-publish (never a direct push)
    needs: bump-version
    if: needs.bump-version.outputs.decision == 'bump'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Publish version bump (re-checks the gate on the current tip)
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          FORCE_REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.triggering_actor }}
          RELEASE_MIN_INTERVAL: ${{ vars.RELEASE_MIN_INTERVAL }}
          BUMP_PARENT: ${{ needs.bump-version.outputs.parent }}
          BUMP_VERSION: ${{ needs.bump-version.outputs.version }}
          BUMP_PATCH: ${{ needs.bump-version.outputs.patch }}
          PUBLISH_URL: https://fleet-publish.2amlogic.com/v1/publish_version_bump
        run: |
          set -euo pipefail

          die() {
            echo "ERROR: $*" >&2
            echo "**Version bump not published:** $*" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # The publisher pins ref refs/heads/main; say so here rather than
          # as a 403 wrong_ref after the work.
          [ "$GITHUB_REF" = "refs/heads/main" ] || die "runs only on refs/heads/main (got $GITHUB_REF)"

          files=(VERSION package.json mcp-loom/package.json mcp-loom/package-lock.json
                 Cargo.toml Cargo.lock .loom/install-metadata.json)

          work="$RUNNER_TEMP/publish"
          mkdir -p "$work"
          printf '%s' "$BUMP_PATCH" | base64 -d | gunzip >"$work/bump.patch"

          # Plain git, no action: rjwalters/loom is public, so this read needs
          # no credential. Full history, no blobs, for the gate (as above);
          # the working tree is only the gate script and the version files.
          git clone --quiet --filter=blob:none --no-checkout --branch main \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$work/repo"
          cd "$work/repo"
          git sparse-checkout set --no-cone /scripts/version-bump-gate.sh "${files[@]/#//}"

          message="chore: bump version to $BUMP_VERSION"
          if [ "$FORCE" = "true" ]; then
            message+=$'\n\n'"Forced-by: $ACTOR"$'\n\n'"Reason: $FORCE_REASON"
          fi

          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            # Re-read main every attempt: after a 409 head_moved or an
            # ambiguous outcome the publisher expects us to decide again.
            git fetch --quiet origin main
            git checkout --quiet -f -B main origin/main
            head="$(git rev-parse origin/main)"

            # Re-check the gate against the current tip: a bump that landed
            # meanwhile (ours after an ambiguous outcome, a forced dispatch, a
            # queued run) makes this run stop rather than bump twice.
            gate_rc=0
            gate="$(bash scripts/version-bump-gate.sh --event "$EVENT_NAME" --force "$FORCE" \
              --reason "$FORCE_REASON" --actor "$ACTOR" --ref origin/main)" || gate_rc=$?
            if [ "$gate_rc" -ne 0 ]; then
              echo "$gate"
              echo "Gate re-check failed (exit $gate_rc) on the current tip:" >>"$GITHUB_STEP_SUMMARY"
              echo "$gate" >>"$GITHUB_STEP_SUMMARY"
              exit "$gate_rc"
            fi
            if ! grep -qx 'decision=bump' <<<"$gate"; then
              echo "$gate"
              if [ "$(git show origin/main:VERSION)" = "$BUMP_VERSION" ]; then
                echo "main is already at $BUMP_VERSION (an earlier attempt landed) -- done." | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "Gate no longer says bump on the current tip -- not bumping." | tee -a "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi

            # The bump was computed on BUMP_PARENT. If main has moved but no
            # version file changed, the same bump IS the bump of the new tip
            # (byte-identical inputs), so it is sent with the new tip as its
            # parent. If a version file changed, the bump has to be recomputed
            # with the toolchain, which this job deliberately lacks.
            parent="$BUMP_PARENT"
            if [ "$head" != "$BUMP_PARENT" ]; then
              if git diff --quiet "$BUMP_PARENT" "$head" -- "${files[@]}"; then
                parent="$head"
              elif [ "$FORCE" = "true" ]; then
                die "a version file changed on main since the bump was computed; dispatch the forced bump again"
              else
                echo "A version file changed on main since the bump was computed -- not publishing; the next run (push or the hourly schedule) recomputes it." \
                  | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi

            git apply "$work/bump.patch"
            [ "$(cat VERSION)" = "$BUMP_VERSION" ] || die "the applied bump does not set VERSION to $BUMP_VERSION"

            # The request: only the files the bump changed (the publisher
            # refuses an unchanged one), each base64-encoded from disk.
            changed=()
            while IFS= read -r path; do changed+=("$path"); done \
              < <(git diff --name-only HEAD -- "${files[@]}")
            : >"$work/files.jsonl"
            for path in "${changed[@]}"; do
              base64 -w0 "$path" >"$work/content.b64"
              jq -cn --arg path "$path" --rawfile b64 "$work/content.b64" \
                '{path: $path, content_b64: $b64}' >>"$work/files.jsonl"
            done
            jq -n --arg parent "$parent" --arg version "$BUMP_VERSION" --arg message "$message" \
              --slurpfile files "$work/files.jsonl" \
              '{parent: $parent, version: $version, message: $message, files: $files}' >"$work/body.json"

            # A fresh OIDC token per attempt (they are short-lived). Both
            # bearer values travel to curl on stdin (--config -), never argv.
            oidc="$(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              | curl -sS --fail --max-time 30 --config - \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://fleet-publish.2amlogic.com" \
              | jq -r '.value // empty')" || oidc=""
            [ -n "$oidc" ] || die "could not mint a GitHub Actions OIDC token (is id-token: write granted?)"
            echo "::add-mask::$oidc"

            rm -f "$work/response.json"
            code="$(printf 'header = "Authorization: Bearer %s"\n' "$oidc" \
              | curl -sS --max-time 90 --config - -X POST \
                  -H 'Content-Type: application/json' \
                  --data-binary "@$work/body.json" \
                  -o "$work/response.json" -w '%{http_code}' \
                  "$PUBLISH_URL")" || code="000"
            unset oidc

            error="$(jq -r '.error // empty' "$work/response.json" 2>/dev/null || true)"
            reason="$(jq -r '.reason // empty' "$work/response.json" 2>/dev/null || true)"
            request_id="$(jq -r '.request_id // empty' "$work/response.json" 2>/dev/null || true)"
            outcome="HTTP $code ${error:-no error code}${reason:+ ($reason)}${request_id:+ request_id=$request_id}"

            case "$code:$error" in
              200:*)
                commit="$(jq -r '.commit' "$work/response.json")"
                reconciled="$(jq -r '.reconciled' "$work/response.json")"
                echo "Published version bump to $BUMP_VERSION: $commit (parent $parent, reconciled=$reconciled)" \
                  | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              # Main moved under the compare-and-swap, or the outcome is
              # unknown (the bump may have landed): re-read main and decide
              # again, as the publisher asks.
              409:* | 503:upstream_ambiguous | 000:*)
                echo "Attempt $attempt/$attempts: $outcome -- re-reading main" >&2
                ;;
              # Transient, nothing written.
              502:upstream_error | 503:oidc_unavailable | 429:*)
                echo "Attempt $attempt/$attempts: $outcome -- retrying" >&2
                ;;
              *)
                die "the publisher refused the bump: $outcome"
                ;;
            esac
            sleep $((attempt * 5))
          done

          die "no publish after $attempts attempts -- main kept moving or the publisher kept failing"
