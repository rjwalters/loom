  codex-adapter-smoke:
    name: Codex Adapter Smoke (mocked)
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.backend == 'true')
    # Tier-2 admission gate for the Codex runtime adapter (epic #4167 Phase 2,
    # issue #4468): a green leg here is what admits the adapter per
    # defaults/docs/runtime-adapters.md's tier policy.
    #
    # NO LIVE OpenAI CALLS. The suite is hermetic by construction — it uses
    # spawn-codex.sh's LOOM_CODEX_NO_EXEC argv-only hook plus a fake `codex`
    # shim on a temp PATH, so the real Codex CLI is never installed or invoked
    # and no credential is required. `codex` is deliberately NOT on PATH here,
    # which also exercises the missing-binary (exit 127) path.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build native worker dispatcher
        run: cargo build --package loom-daemon
      - name: Syntax-check the Codex adapter and its test
        run: |
          bash -n defaults/scripts/spawn-codex.sh
          bash -n defaults/scripts/tests/test-spawn-codex.sh
      - name: Assert the suite cannot reach a real Codex CLI
        # Structural guard: the test must never install, download, or otherwise
        # obtain the real Codex CLI. Combined with `codex` being absent from
        # this runner's PATH, that makes a live OpenAI call impossible.
        run: |
          if grep -nE '(npm|brew|pipx?|curl|wget) .*(codex|openai)' \
              defaults/scripts/tests/test-spawn-codex.sh; then
            echo "::error::test-spawn-codex.sh must not install or fetch a real Codex CLI"
            exit 1
          fi
          # This leg is expected to run on a runner with no Codex CLI at all.
          # A warning rather than a failure: if a future runner image ships
          # `codex`, the suite is still hermetic (every dispatch test prepends
          # its own mock to PATH, and the argv tests never exec anything), so a
          # hard failure here would be spurious rather than protective.
          if command -v codex >/dev/null 2>&1; then
            echo "::warning::a real 'codex' is on PATH; the suite still mocks every dispatch, but verify no test bypasses the mock"
          fi
      - name: Validate the Codex runtime capability manifest
        run: |
          # Valid JSON with the tri-state schema check-runtime-capabilities.sh reads.
          jq -e '.runtime == "codex" and (.capabilities | type == "object")' \
            defaults/runtimes/codex.json > /dev/null
          bad="$(jq -r '.capabilities | to_entries[]
                        | select(.value != "yes" and .value != "no" and .value != "partial")
                        | .key' defaults/runtimes/codex.json)"
          if [[ -n "$bad" ]]; then
            echo "::error::codex.json capability value outside yes|no|partial: $bad"
            exit 1
          fi
          # Codex declares worktreeIsolation=partial, so the Builder role (which
          # requires it) must fail closed with EX_CONFIG (78). This pins the
          # guardrail-parity doc's residual gap 2 to an executable assertion.
          rc=0
          bash defaults/scripts/check-runtime-capabilities.sh \
            --role builder --runtime codex --dir defaults >/dev/null 2>&1 || rc=$?
          if [[ "$rc" != "78" ]]; then
            echo "::error::builder+codex must be incompatible (expected 78, got $rc)"
            exit 1
          fi
          # Judge requires only mcp (declared "yes"), so it must be compatible.
          bash defaults/scripts/check-runtime-capabilities.sh \
            --role judge --runtime codex --dir defaults >/dev/null
      - name: Assert the guardrail-parity doc exists (contract point 6)
        # No runtime is admitted without a parity doc naming its residual gaps.
        run: |
          test -f defaults/docs/guardrail-parity-codex.md
          grep -q '## Residual gaps' defaults/docs/guardrail-parity-codex.md
      - name: Run the mocked Codex adapter test suite
        run: bash defaults/scripts/tests/test-spawn-codex.sh
      - name: Verify persistent-session cancellation with fake workers
        env:
          LOOM_TEST_SESSION_IMAGE: ubuntu:24.04
        run: |
          docker pull ubuntu:24.04
          cargo test -p loom-daemon --test session_exec_docker -- --ignored --nocapture
      - name: Verify account-private clones and exclusive jobs with Docker fixtures
        # Owner-only synthetic profiles must belong to the session image's UID.
        # Build as runner; execute only this fixture as UID 1000 with Docker access.
        # Stage public inputs outside the runner's owner-only home. Account
        # profiles and the checkout's .git directory are never shared.
        run: |
          fixture_source="$(mktemp -d /tmp/loom-private-ci.XXXXXX)"
          chmod 0755 "$fixture_source"
          git archive HEAD | tar -x -C "$fixture_source"
          mkdir "$fixture_source/target"
          sudo --non-interactive mount --bind "$PWD/target" "$fixture_source/target"
          trap 'sudo --non-interactive umount "$fixture_source/target"' EXIT
          cd "$fixture_source"
          cargo test -p loom-daemon --test private_workspace_docker --no-run --message-format=json > fixture-artifacts.json
          fixture_test="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "private_workspace_docker" and .executable != null) | .executable' fixture-artifacts.json)"
          namei -l "$PWD/defaults/scripts" "$PWD/defaults/runtimes" "$PWD/defaults/roles" "$PWD/defaults/.claude/commands/loom" "$PWD/target/debug/loom-daemon"
          sudo --non-interactive setpriv --reuid=1000 --regid=1000 --groups=docker --reset-env -- sh -c 'id && test -x "$1" && test -r "$PWD/target/debug/loom-daemon" && test -x "$PWD/target/debug/loom-daemon" && tar -cf /dev/null "$PWD/defaults"' sh "$fixture_test"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER='sudo --non-interactive setpriv --reuid=1000 --regid=1000 --groups=docker --reset-env --' cargo test -p loom-daemon --test private_workspace_docker -- --ignored --nocapture

  shell-suite-tests:
    name: Shell Test Suites (hermetic, ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.scripts == 'true')
    # Audit-and-wire of the defaults/scripts/tests/ population (#4455). Before
    # this job, exactly one suite there ran in CI (Installer Integration Tests)
    # while ~70 others rode to main untested. run-ci-suites.sh runs every suite
    # listed in ci-wired.txt (hermetic + ubuntu-portable); check-ci-suite-
    # manifest.sh enforces that every test-*.sh is either wired or excluded-
    # with-a-reason, so a new suite cannot silently join an unwired pool.
    # Measured runtime: 613s p50 (636s p95) sequential across 22 CI runs,
    # 2026-08-18..20 (#6622) — ci-wired.txt now lists 174 wired suites, not
    # the ~72 this comment used to cite; run-ci-suites.sh prints per-suite
    # timing and a total either way. As of #6622, suites run CONCURRENTLY
    # (default: one worker per runner core, LOOM_CI_PARALLELISM to override)
    # since they are hermetic by construction (this job's own name) — the
    # report is still printed in MANIFEST order after every suite finishes,
    # so "deterministic ordering" no longer requires sequential execution.
    # "Hermetic by construction" is enforced, not assumed: a suite observed
    # failing only under concurrency is pinned to run alone via the runner's
    # SERIAL_LANE_SUITES quarantine list (#6622 AC5).
    #
    # Since #4769 ci-wired.txt also covers the tests/hooks/ Claude-path guard
    # suites (repo root, not defaults/scripts/tests/ — previously unwired
    # entirely). tests/hooks/test-guard-destructive.sh alone adds several
    # minutes (531 assertions); run-ci-suites.sh's per-suite timeout was
    # raised accordingly (see its header comment).
    #
    # Since #4451 ci-wired.txt also covers defaults/hooks/tests/ — the last
    # unwired guard-hook location (background-subagents, loom-workspace,
    # worktree-paths, methodology-inject, skill-router; 128 assertions across
    # the 5 suites). Measured ~1m43s combined on a loaded macOS dev machine
    # (this repo's only prior execution environment); ubuntu-latest is
    # expected to be faster (no per-exec Gatekeeper/codesign overhead, cheaper
    # fork/exec) but this is the suites' first CI run — watch the actual
    # ubuntu wall-clock here and tighten LOOM_CI_SUITE_TIMEOUT only if needed.
    #
    # Since #5275 ci-wired.txt also covers tests/install/ (installer/
    # uninstaller unit suites — previously appeared in this job's `changes`
    # paths-filter trigger only, never actually invoked) and tests/hermit/
    # (the Hermit role's stateless-ceremony heuristic regression guard,
    # previously not referenced by CI at all). All 8 suites are hermetic
    # (fake/stub binaries or local python3 AST fixtures, no live network or
    # forge calls) and run in well under a second each.
    # Two runners split ci-wired.txt round-robin via LOOM_CI_SHARD (#9065);
    # every suite runs in exactly one leg. Measured on PR #9074: the suite step
    # took 113s per leg vs ~230s on one runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        # The denominator is `strategy.job-total`, never a literal: editing
        # this list alone cannot silently drop a slice (a gap such as [1, 3]
        # yields an out-of-range k/N, which fails loudly).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git identity for suite fixtures
        # Several worktree/merge-pr suites create fixture commits; a fresh
        # runner has no global identity, so set a throwaway one.
        run: |
          git config --global user.email "ci@loom.test"
          git config --global user.name "Loom CI"
      - name: Assert the wired/excluded manifest invariant (#4455)
        run: bash defaults/scripts/tests/check-ci-suite-manifest.sh
      # Retry-once-and-record (#7791): a suite that fails its first attempt is
      # re-run exactly once; a suite failing BOTH attempts still fails this
      # step exactly as before. Every retry is recorded twice — a distinct
      # "PASS (retried once …)" / "FAIL … failed both attempts" line in this
      # step's own log, AND a $GITHUB_STEP_SUMMARY table (populated by
      # run-ci-suites.sh itself, since GITHUB_STEP_SUMMARY is already set in
      # every Actions job) — plus the durable TSV record uploaded below, so
      # the retry data survives past this run for #7789's quarantine
      # measurement rather than only ever being read by eye.
      - name: Run the CI-wired shell test suites
        # LOOM_TEST_ALLOW_SYSTEMD (#8077): the #4862 real-systemd regression
        # block writes real unit files into $HOME/.config/systemd/user and
        # reloads the user manager. That is safe HERE — a throwaway runner with
        # no production daemon — and unsafe on a fleet worker, where the same
        # manager supervises the live daemon. So the block is opt-in and this
        # is the one place that opts in; a sweep never does. If the runner has
        # no reachable user manager the block still self-skips, unchanged.
        env:
          LOOM_TEST_ALLOW_SYSTEMD: "1"
          LOOM_CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bash defaults/scripts/tests/run-ci-suites.sh
      - name: Upload CI suite retry log (#7791)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-suite-retry-log-${{ matrix.shard }}
          path: /tmp/ci-suite-retry-log.tsv
          if-no-files-found: ignore
          retention-days: 14

  worker-image-smoke:
    name: loom-worker Image Smoke Test
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-daemon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Native build (the runner IS x86_64-unknown-linux-gnu) — a full
      # cross-compile matrix has no place in a per-PR smoke test; the release
      # workflow's own `build-daemon` matrix already covers every published
      # target, this job only needs the one Linux artifact the Dockerfile
      # actually consumes.
      - name: Build loom-daemon (release)
        run: cargo build --release --package loom-daemon
      - name: Package binary at the path the Dockerfile expects
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/loom-daemon dist/loom-daemon-linux-amd64
      - name: Build the loom-worker image (no push)
        run: docker build -f docker/worker/Dockerfile -t loom-worker:ci-smoke .
      - name: Run the smoke test
        run: ./docker/worker/test-image.sh loom-worker:ci-smoke
      - name: Run the mount-contract worktree-correctness test
        run: ./docker/worker/test-mount-contract.sh loom-worker:ci-smoke
      # Epic #6896 Phase 4 (#7853). The hermetic suite in
      # defaults/scripts/tests/ proves the seam's logic against a fake docker;
      # this leg is the only place the claim under test can actually be made —
      # a run-job client inside the shipped image, with no docker socket, against
      # this runner's real docker daemon.
      - name: Run the run-job seam end-to-end test (client in a socket-less container)
        run: ./docker/worker/test-run-job.sh loom-worker:ci-smoke

  session-image-smoke:
    name: loom-worker-session Image Smoke Test
    # Mirrors worker-image-smoke exactly (same `changes.docker` gate — this
    # image is FROM loom-worker, so any docker/** change, including a
    # loom-worker-only one, is worth re-validating this layer against): #6899,
    # Epic #6896 Phase 1. Builds the base loom-worker image locally first
    # (needed as this Dockerfile's FROM target) rather than pulling
    # ghcr.io/rjwalters/loom-worker — a PR's Dockerfile changes are not
    # published anywhere to pull from, and this keeps the check hermetic.
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-daemon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build loom-daemon (release)
        run: cargo build --release --package loom-daemon
      - name: Package binary at the path the Dockerfile expects
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/loom-daemon dist/loom-daemon-linux-amd64
      - name: Build the loom-worker base image (no push, local FROM target)
        run: docker build -f docker/worker/Dockerfile -t ghcr.io/rjwalters/loom-worker:ci-smoke .
      - name: Build the loom-worker-session image (no push)
        run: |
          docker build -f docker/session/Dockerfile \
            --build-arg BASE_IMAGE=ghcr.io/rjwalters/loom-worker:ci-smoke \
            -t loom-worker-session:ci-smoke .
      - name: Run the smoke test
        run: ./docker/session/test-image.sh loom-worker-session:ci-smoke

  native-image-smoke:
    name: loom-worker-native Image Smoke Test
    # Mirrors session-image-smoke exactly (#8403, Epic #6896 Phase 3): same
    # `changes.docker` gate, same local base-image rebuild as this
    # Dockerfile's FROM target (a PR's Dockerfile changes are published
    # nowhere to pull from), same timeout. A sibling job rather than a matrix
    # over the two overlay images on purpose — a matrix would couple two
    # independent deliverables' failure modes, and CI here is deliberately
    # dumb and reliable.
    #
    # This leg is where the pinned-CLI claim is actually made: the version
    # equality assertions in docker/native/Dockerfile and
    # docker/native/test-image.sh fail HERE, on the PR that changes a pin,
    # instead of during a release.
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-daemon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build loom-daemon (release)
        run: cargo build --release --package loom-daemon
      - name: Package binary at the path the Dockerfile expects
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/loom-daemon dist/loom-daemon-linux-amd64
      - name: Build the loom-worker base image (no push, local FROM target)
        run: docker build -f docker/worker/Dockerfile -t ghcr.io/rjwalters/loom-worker:ci-smoke .
      - name: Build the loom-worker-native image (no push)
        run: |
          docker build -f docker/native/Dockerfile \
            --build-arg BASE_IMAGE=ghcr.io/rjwalters/loom-worker:ci-smoke \
            -t loom-worker-native:ci-smoke .
      - name: Run the smoke test
        run: ./docker/native/test-image.sh loom-worker-native:ci-smoke
