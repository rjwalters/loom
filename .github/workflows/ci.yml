name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which file groups changed to skip irrelevant jobs on PRs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'loom-daemon/**'
              - 'loom-api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            mcp:
              - 'mcp-loom/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'defaults/**'
              - '.github/workflows/ci.yml'

  backend-lint-and-check:
    name: Rust Linting & Build Check
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --package loom-daemon --package loom-api -- -D warnings -A clippy::cast_precision_loss -A clippy::cast_possible_truncation -A clippy::cast_sign_loss -A clippy::too_many_lines -A clippy::panic -A clippy::unwrap_used -A clippy::nonminimal_bool -A clippy::redundant_closure -A clippy::redundant_closure_for_method_calls -A clippy::format_push_string -A clippy::uninlined_format_args
      - run: cargo check --workspace --all-targets

  backend-tests:
    name: Rust Unit Tests
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Per-test process isolation (#4385): the daemon suite mutates
      # process-global env vars in ~700 places, and `#[serial]` only serializes
      # *marked* tests against each other — an unmarked `Command::spawn` test
      # still races them. nextest runs one process per test, killing that whole
      # class of flake by construction. Config: `.config/nextest.toml`.
      - uses: taiki-e/install-action@nextest
      - name: Run tests (process-per-test)
        run: cargo nextest run --workspace --profile ci
      # nextest does not run doctests, so libtest still owns those (#4385).
      - name: Run doctests
        run: cargo test --workspace --doc

  mcp-build:
    name: MCP Server Build
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.mcp == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build unified MCP server
        run: cd mcp-loom && npm install && npm run build
      - name: Verify build output
        run: test -f mcp-loom/dist/index.js

  claude-md-budget:
    name: CLAUDE.md Line Budget
    # Cheap structural check; always runs (CLAUDE.md is prepended to every
    # agent's context, so its size is load-bearing — see #4014).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check CLAUDE.md line budget
        run: bash scripts/check-claude-md-budget.sh

  installer-tests:
    name: Installer Integration Tests
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.scripts == 'true')
    # Portable across GNU/BSD sed (temp-file + mv idiom) — runs on ubuntu (#3515)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check role prompts reference only real labels (#3786)
        run: bash defaults/scripts/check-phantom-labels.sh
      - name: Check labels.yml copies are in sync (#3896)
        run: bash defaults/scripts/check-labels-drift.sh
      - name: Check label descriptions fit GitHub's 100-char limit (#4335)
        run: bash defaults/scripts/check-label-descriptions.sh
      - name: Run installer tests
        run: bash scripts/test-installer.sh
      - name: Run installer reinstall-safety tests (#4188)
        run: bash defaults/scripts/tests/test-install-reinstall-safety.sh
