name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which file groups changed to skip irrelevant jobs on PRs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'loom-daemon/**'
              - 'loom-api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            mcp:
              - 'mcp-loom/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'defaults/**'
              - 'tests/hooks/**'
              - '.github/workflows/ci.yml'

  backend-lint-and-check:
    name: Rust Linting & Build Check
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --package loom-daemon --package loom-api -- -D warnings -A clippy::cast_precision_loss -A clippy::cast_possible_truncation -A clippy::cast_sign_loss -A clippy::too_many_lines -A clippy::panic -A clippy::unwrap_used -A clippy::nonminimal_bool -A clippy::redundant_closure -A clippy::redundant_closure_for_method_calls -A clippy::format_push_string -A clippy::uninlined_format_args
      - run: cargo check --workspace --all-targets

  backend-tests:
    name: Rust Unit Tests
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Per-test process isolation (#4385). The daemon suite mutates the process
      # environment at ~774 call sites while other tests in the same binary
      # `Command::spawn` children; `Command::spawn` reads the environ
      # non-atomically, so those two classes raced and produced intermittent
      # failures in hermetic, untouched tests (2026-07-29: pipeline_snapshot on
      # PR #4305, then quarantine_reconciliation on PR #4320). `#[serial]` only
      # serializes *marked* tests against each other, so it never closed that
      # window. nextest runs each test in its own process, which closes it by
      # construction. Tests whose shared state is genuinely cross-process (the
      # host-global `tmux -L loom` server) are serialized by the
      # `daemon-integration` test group in `.config/nextest.toml`.
      - uses: taiki-e/install-action@nextest
      - name: Run tests (process-per-test)
        run: cargo nextest run --workspace --profile ci
      # nextest does not run doctests, so libtest still owns those (#4385).
      - name: Run doctests
        run: cargo test --workspace --doc

  mcp-build:
    name: MCP Server Build
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.mcp == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build unified MCP server
        run: cd mcp-loom && npm install && npm run build
      - name: Verify build output
        run: test -f mcp-loom/dist/index.js

  claude-md-budget:
    name: CLAUDE.md Line Budget
    # Cheap structural check; always runs (CLAUDE.md is prepended to every
    # agent's context, so its size is load-bearing — see #4014).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check CLAUDE.md line budget
        run: bash scripts/check-claude-md-budget.sh

  agents-md-sync:
    name: AGENTS.md Sync Check
    # Cheap structural check; always runs. defaults/.loom/AGENTS.md is generated
    # from defaults/.loom/CLAUDE.md's agents-md:include marker ranges — this
    # fails if the checked-in artifact is stale, keeping instructions
    # single-source (#4479, epic #4167).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check AGENTS.md is in sync with its source
        run: bash scripts/check-agents-md-sync.sh

  installer-tests:
    name: Installer Integration Tests
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.scripts == 'true')
    # Portable across GNU/BSD sed (temp-file + mv idiom) — runs on ubuntu (#3515)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check role prompts reference only real labels (#3786)
        run: bash defaults/scripts/check-phantom-labels.sh
      - name: Check labels.yml copies are in sync (#3896)
        run: bash defaults/scripts/check-labels-drift.sh
      - name: Check label descriptions fit GitHub's 100-char limit (#4335)
        run: bash defaults/scripts/check-label-descriptions.sh
      - name: Run installer tests
        run: bash scripts/test-installer.sh
      - name: Run installer reinstall-safety tests (#4188)
        run: bash defaults/scripts/tests/test-install-reinstall-safety.sh

  codex-adapter-smoke:
    name: Codex Adapter Smoke (mocked)
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.scripts == 'true')
    # Tier-2 admission gate for the Codex runtime adapter (epic #4167 Phase 2,
    # issue #4468): a green leg here is what admits the adapter per
    # defaults/docs/runtime-adapters.md's tier policy.
    #
    # NO LIVE OpenAI CALLS. The suite is hermetic by construction — it uses
    # spawn-codex.sh's LOOM_CODEX_NO_EXEC argv-only hook plus a fake `codex`
    # shim on a temp PATH, so the real Codex CLI is never installed or invoked
    # and no credential is required. `codex` is deliberately NOT on PATH here,
    # which also exercises the missing-binary (exit 127) path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check the Codex adapter and its test
        run: |
          bash -n defaults/scripts/spawn-codex.sh
          bash -n defaults/scripts/tests/test-spawn-codex.sh
      - name: Assert the suite cannot reach a real Codex CLI
        # Structural guard: the test must never install, download, or otherwise
        # obtain the real Codex CLI. Combined with `codex` being absent from
        # this runner's PATH, that makes a live OpenAI call impossible.
        run: |
          if grep -nE '(npm|brew|pipx?|curl|wget) .*(codex|openai)' \
              defaults/scripts/tests/test-spawn-codex.sh; then
            echo "::error::test-spawn-codex.sh must not install or fetch a real Codex CLI"
            exit 1
          fi
          # This leg is expected to run on a runner with no Codex CLI at all.
          # A warning rather than a failure: if a future runner image ships
          # `codex`, the suite is still hermetic (every dispatch test prepends
          # its own mock to PATH, and the argv tests never exec anything), so a
          # hard failure here would be spurious rather than protective.
          if command -v codex >/dev/null 2>&1; then
            echo "::warning::a real 'codex' is on PATH; the suite still mocks every dispatch, but verify no test bypasses the mock"
          fi
      - name: Validate the Codex runtime capability manifest
        run: |
          # Valid JSON with the tri-state schema check-runtime-capabilities.sh reads.
          jq -e '.runtime == "codex" and (.capabilities | type == "object")' \
            defaults/runtimes/codex.json > /dev/null
          bad="$(jq -r '.capabilities | to_entries[]
                        | select(.value != "yes" and .value != "no" and .value != "partial")
                        | .key' defaults/runtimes/codex.json)"
          if [[ -n "$bad" ]]; then
            echo "::error::codex.json capability value outside yes|no|partial: $bad"
            exit 1
          fi
          # Codex declares worktreeIsolation=partial, so the Builder role (which
          # requires it) must fail closed with EX_CONFIG (78). This pins the
          # guardrail-parity doc's residual gap 2 to an executable assertion.
          rc=0
          bash defaults/scripts/check-runtime-capabilities.sh \
            --role builder --runtime codex --dir defaults >/dev/null 2>&1 || rc=$?
          if [[ "$rc" != "78" ]]; then
            echo "::error::builder+codex must be incompatible (expected 78, got $rc)"
            exit 1
          fi
          # Judge requires only mcp (declared "yes"), so it must be compatible.
          bash defaults/scripts/check-runtime-capabilities.sh \
            --role judge --runtime codex --dir defaults >/dev/null
      - name: Assert the guardrail-parity doc exists (contract point 6)
        # No runtime is admitted without a parity doc naming its residual gaps.
        run: |
          test -f defaults/docs/guardrail-parity-codex.md
          grep -q '## Residual gaps' defaults/docs/guardrail-parity-codex.md
      - name: Run the mocked Codex adapter test suite
        run: bash defaults/scripts/tests/test-spawn-codex.sh

  shell-suite-tests:
    name: Shell Test Suites (hermetic)
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.scripts == 'true')
    # Audit-and-wire of the defaults/scripts/tests/ population (#4455). Before
    # this job, exactly one suite there ran in CI (Installer Integration Tests)
    # while ~70 others rode to main untested. run-ci-suites.sh runs every suite
    # listed in ci-wired.txt (hermetic + ubuntu-portable); check-ci-suite-
    # manifest.sh enforces that every test-*.sh is either wired or excluded-
    # with-a-reason, so a new suite cannot silently join an unwired pool.
    # Measured runtime: ~3 min (72 suites; run-ci-suites.sh prints per-suite
    # timing and a total). Kept sequential for deterministic ordering.
    #
    # Since #4769 ci-wired.txt also covers the tests/hooks/ Claude-path guard
    # suites (repo root, not defaults/scripts/tests/ — previously unwired
    # entirely). tests/hooks/test-guard-destructive.sh alone adds several
    # minutes (531 assertions); run-ci-suites.sh's per-suite timeout was
    # raised accordingly (see its header comment).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure git identity for suite fixtures
        # Several worktree/merge-pr suites create fixture commits; a fresh
        # runner has no global identity, so set a throwaway one.
        run: |
          git config --global user.email "ci@loom.test"
          git config --global user.name "Loom CI"
      - name: Assert the wired/excluded manifest invariant (#4455)
        run: bash defaults/scripts/tests/check-ci-suite-manifest.sh
      - name: Run the CI-wired shell test suites
        run: bash defaults/scripts/tests/run-ci-suites.sh
