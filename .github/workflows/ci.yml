  native-port-daemon-lifecycle:
    name: Native Port Suites (daemon lifecycle, watchdog)
    needs: [changes, build-daemon]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.scripts == 'true')
    # Split out of Native Port Suites by #9065, which see for everything else
    # about this family: that job ran ~420s of suites back to back, the
    # longest pole in CI. The steps are unchanged; only which runner runs
    # them moved. Same trigger, same build, and the same FAIL-never-SKIP
    # contract without a binary.
    # The spawn-claude suite moved back to Native Port Suites (#9065 follow-up):
    # with it, this job was the critical path (build-daemon, then 265s). Every
    # suite runs under !cancelled(), so one red suite cannot hide the others.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git identity for suite fixtures
        # These suites create fixture commits; a fresh runner has no global
        # identity. Same step shell-suite-tests carries, for the same reason.
        run: |
          git config --global user.email "ci@loom.test"
          git config --global user.name "Loom CI"
      # Built once by build-daemon (#9065). download-artifact FAILS
      # when the artifact is missing, so a broken build turns this job red
      # rather than letting it pass on nothing (ci-principles.md rule 6).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loom-daemon-debug
          path: target/debug
      - run: chmod +x target/debug/loom-daemon && target/debug/loom-daemon --version
      # Moved out of shell-suite-tests by #8087, the same move #8086 made for
      # the watchdog (now in native-port-watchdog-spawn) and for the same
      # reason: cli/loom-daemon-start.sh is now a thin stub over `loom-daemon
      # daemon-start`, so these three suites need the binary this job downloads.
      # Each pins it via loom_test_require_daemon_bin --self-only, which leaves
      # $LOOM_DAEMON_BIN free to keep meaning "the daemon this caller starts or
      # probes" — the fake-daemon seam every launch-path case drives — and each
      # FAILS (never SKIPs) without a binary, so this job cannot report green
      # while running nothing.
      #
      # All three, not just the start suite: test-loom-daemon-launchd-plist.sh
      # renders every plist by invoking the real start script, and
      # test-loom-daemon-update.sh builds its fixtures from
      # lib/daemon-update-fixtures.sh, which copies that script in and execs it
      # on the restart / --relaunch / full-update flows.
      #
      # Running them here rather than in shell-suite-tests also means the
      # live-daemon guard (#6386) no longer covers the two that are
      # LIVE_DAEMON_GUARDED_SUITES members. Same reasoning as the watchdog's:
      # safe on THIS runner and only here — a GitHub runner has no
      # daemon, no pid file and nothing to bootout. On a developer host, run
      # them through run-ci-suites.sh, which still names both in that guard.
      #
      # This job's steps are sequential, so the pair also gets the isolation
      # run-ci-suites.sh's SERIAL_LANE_SUITES pin (#6622 AC5, #6639/#7391) was
      # giving them inside its concurrent pool — by construction rather than by
      # quarantine list.
      - name: loom-daemon-start (#4773, #6568, #7391, ported in #8087)
        if: ${{ !cancelled() }}
        run: bash defaults/scripts/tests/test-loom-daemon-start.sh
      - name: loom-daemon-start launchd plist rendering (#5343, #6387, #8087)
        if: ${{ !cancelled() }}
        run: bash defaults/scripts/tests/test-loom-daemon-launchd-plist.sh
      - name: loom-daemon-update (#4078, #6639, #8087)
        if: ${{ !cancelled() }}
        run: bash defaults/scripts/tests/test-loom-daemon-update.sh
      # Moved out of shell-suite-tests by #8086: cli/loom-daemon-watchdog.sh is
      # now a thin stub over `loom-daemon daemon-watchdog`, so these two suites
      # (188 + 27 assertions, unchanged from the shell implementation apart
      # from four explicitly-retired cases) need the binary this job downloads.
      # They pin it via loom_test_require_daemon_bin --self-only, which leaves
      # $LOOM_DAEMON_BIN free to keep meaning "the daemon this watchdog probes"
      # — the mock seam every IPC-probe case drives.
      #
      # Running them here rather than in shell-suite-tests also means the
      # live-daemon guard (#6386) no longer covers them. That is safe on THIS
      # runner and only here: a GitHub runner has no daemon, no pid file and
      # nothing to bootout. On a developer host, run them through
      # run-ci-suites.sh — the guard still names test-loom-daemon-watchdog.sh.
      - name: loom-daemon-watchdog (#4011, #4398, #5118, ported in #8086)
        if: ${{ !cancelled() }}
        run: bash defaults/scripts/tests/test-loom-daemon-watchdog.sh

