name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Belt-and-suspenders cancellation (#6683): the native `cancel-in-progress`
  # above does NOT reliably cancel a superseded run that is still `queued`
  # (zero jobs materialized yet) — only a run that has already reached
  # `in_progress` is cancelled reliably. Observed 2026-08-21 on PR #6680: a
  # force-pushed rebase created a new run that sat `pending` with zero jobs
  # for ~20 minutes because the OLD run was `queued` (not yet `in_progress`)
  # and kept holding the `ci-${{ github.ref }}` concurrency group; a manual
  # `POST actions/runs/<id>/cancel` on the old run unblocked the new one
  # immediately. This job explicitly cancels any other queued/in_progress run
  # of THIS workflow on the SAME head branch, scoped strictly by `--branch`
  # so it can never touch an unrelated ref's run. It has no `needs:` so it
  # starts immediately in parallel with every other job below, and it does
  # not gate them — its only side effect is cancelling stale runs elsewhere.
  cancel-superseded:
    name: Cancel Superseded Runs (same ref)
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older queued/in_progress runs for this ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          REF: ${{ github.head_ref || github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Checking for superseded '$WORKFLOW' runs on ref '$REF' (current run: $CURRENT_RUN_ID)"
          gh run list --repo "$REPO" --workflow "$WORKFLOW" --branch "$REF" \
            --json databaseId,status --jq \
            '.[] | select(.status == "queued" or .status == "in_progress") | .databaseId' \
            | while read -r run_id; do
                if [[ "$run_id" != "$CURRENT_RUN_ID" ]]; then
                  echo "Cancelling superseded run $run_id (workflow=$WORKFLOW ref=$REF)"
                  gh run cancel "$run_id" --repo "$REPO" \
                    || echo "::warning::failed to cancel run $run_id (may have already completed, or GITHUB_TOKEN lacks actions:write — e.g. a fork PR)"
                fi
              done

  # Detect which file groups changed to skip irrelevant jobs on PRs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      scripts: ${{ steps.filter.outputs.scripts }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'loom-daemon/**'
              - 'loom-api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            mcp:
              - 'mcp-loom/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'defaults/**'
              - 'tests/hooks/**'
              - 'tests/install/**'
              - 'tests/hermit/**'
              - 'install.sh'
              # .loom/hooks/** is git-tracked (self-install dogfooding) and
              # several defaults/hooks/tests/*.sh + tests/hooks/*.sh suites
              # assert it's byte-identical to defaults/hooks/** (#4451) — a
              # drift here without a matching defaults/ change should still
              # re-run shell-suite-tests on the PR, not just on push to main.
              - '.loom/hooks/**'
              - '.github/workflows/ci.yml'

  backend-lint-and-check:
    name: Rust Linting & Build Check
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --package loom-daemon --package loom-api -- -D warnings -A clippy::cast_precision_loss -A clippy::cast_possible_truncation -A clippy::cast_sign_loss -A clippy::too_many_lines -A clippy::panic -A clippy::unwrap_used -A clippy::nonminimal_bool -A clippy::redundant_closure -A clippy::redundant_closure_for_method_calls -A clippy::format_push_string -A clippy::uninlined_format_args
      - run: cargo check --workspace --all-targets

  backend-tests:
    name: Rust Unit Tests
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    # Heavy jobs run on the dedicated CI runner (2AMLogic/2am#29). The
    # expression routes same-repo runs to it and sends fork PRs back to
    # GitHub-hosted instead of skipping them, so required checks never go
    # missing and no outside fork ever executes on our host.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Per-test process isolation (#4385). The daemon suite mutates the process
      # environment at ~774 call sites while other tests in the same binary
      # `Command::spawn` children; `Command::spawn` reads the environ
      # non-atomically, so those two classes raced and produced intermittent
      # failures in hermetic, untouched tests (2026-07-29: pipeline_snapshot on
      # PR #4305, then quarantine_reconciliation on PR #4320). `#[serial]` only
      # serializes *marked* tests against each other, so it never closed that
      # window. nextest runs each test in its own process, which closes it by
      # construction. Tests whose shared state is genuinely cross-process (the
      # host-global `tmux -L loom` server) are serialized by the
      # `daemon-integration` test group in `.config/nextest.toml`.
      - uses: taiki-e/install-action@nextest
      - name: Run tests (process-per-test)
        run: cargo nextest run --workspace --profile ci
      # nextest does not run doctests, so libtest still owns those (#4385).
      - name: Run doctests
        run: cargo test --workspace --doc

  backend-otlp-feature:
    name: Rust OTLP Feature Build & Test
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    # Heavy jobs run on the dedicated CI runner (2AMLogic/2am#29). The
    # expression routes same-repo runs to it and sends fork PRs back to
    # GitHub-hosted instead of skipping them, so required checks never go
    # missing and no outside fork ever executes on our host.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `otlp` feature (#4858, Epic #4702 Phase 4) is off by default, so
      # the default-feature jobs above never compile or run it — confirmed
      # during Judge review of PR #4879 that CI had zero `--features otlp` /
      # `--all-features` coverage anywhere (#4905). --all-targets is required
      # here (unlike backend-lint-and-check's default job) so the feature's
      # own unit tests (`otlp/mod.rs`, `otlp/mapping.rs`) are linted too, not
      # just its non-test code paths.
      - run: cargo clippy --package loom-daemon --features otlp --all-targets -- -D warnings -A clippy::cast_precision_loss -A clippy::cast_possible_truncation -A clippy::cast_sign_loss -A clippy::too_many_lines -A clippy::panic -A clippy::unwrap_used -A clippy::nonminimal_bool -A clippy::redundant_closure -A clippy::redundant_closure_for_method_calls -A clippy::format_push_string -A clippy::uninlined_format_args
      - uses: taiki-e/install-action@nextest
      - name: Run tests (otlp feature)
        run: cargo nextest run --package loom-daemon --features otlp --profile ci

  mcp-build:
    name: MCP Server Build
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.mcp == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build unified MCP server
        run: cd mcp-loom && npm install && npm run build
      - name: Run MCP server test suite
        run: cd mcp-loom && npm test
      - name: Verify build output
        run: test -f mcp-loom/dist/index.js

  dashboard-tests:
    name: Dashboard Tests (Workers backend + web UI)
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.dashboard == 'true')
    # 442 tests (#4849) across two runtimes that were previously unwired: the
    # Cloudflare Workers backend (dashboard/, 152 Miniflare/vitest-pool-workers
    # tests — no Cloudflare credentials needed, runs against local D1 + DO
    # simulation) and the dashboard UI (dashboard/web/, 290 happy-dom tests).
    # `npm run check:all` runs both in one command (backend typecheck+test,
    # then `web`'s typecheck+test via --prefix); `dashboard/package.json`'s
    # `pretest` hook already runs `scripts/ensure-web-dist.sh` first, since
    # Wrangler will not parse `wrangler.toml` (and therefore Miniflare will not
    # boot) until `web/dist/` exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install backend dependencies
        run: npm ci
        working-directory: dashboard
      - name: Install web UI dependencies
        run: npm ci
        working-directory: dashboard/web
      - name: Run backend (Miniflare) + web (happy-dom) suites
        run: npm run check:all
        working-directory: dashboard

  claude-md-budget:
    name: CLAUDE.md Line Budget
    # Cheap structural check; always runs (CLAUDE.md is prepended to every
    # agent's context, so its size is load-bearing — see #4014).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check CLAUDE.md line budget
        run: bash scripts/check-claude-md-budget.sh

  conflict-markers:
    name: Conflict Marker Check
    # Cheap structural check; always runs, on every path group. #6499: an
    # abandoned `git stash pop` left live conflict markers in the tracked
    # `.loom/config.json`, a later `chore: resync installed Loom surfaces`
    # pass COMMITTED them, and the daemon then silently ran on built-in
    # defaults (observability/safehouse/roleRunner config lost) for ~70
    # minutes. Every other detector is blind to the committed case:
    # check-main-clean.sh (#6162 AC3) and primary_checkout_reaper key on an
    # unmerged INDEX entry, which a commit clears; check-shell-syntax.sh
    # (#6162) only covers `*.sh` via `bash -n`. This is the content-level
    # gate for every tracked file, and must NOT be path-filtered — the
    # corruption can land in any file, including one whose path group the
    # PR did not otherwise touch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the conflict-marker detector
        run: bash defaults/scripts/check-conflict-markers.sh --self-test
      - name: Check no tracked file carries git conflict markers (#6499)
        run: bash defaults/scripts/check-conflict-markers.sh
      - name: Check .loom/config.json parses as JSON (#6499)
        # The specific consequence #6499 was filed over: an unparseable
        # workspace config makes config_resolver fall back to `{}` for that
        # tier, silently disabling every block the file configured. Conflict
        # markers are only the most common way to break it.
        run: |
          if [ -f .loom/config.json ]; then
            jq -e . .loom/config.json > /dev/null
          fi

  agents-md-sync:
    name: AGENTS.md Sync Check
    # Cheap structural check; always runs. defaults/.loom/AGENTS.md is generated
    # from defaults/.loom/CLAUDE.md's agents-md:include marker ranges — this
    # fails if the checked-in artifact is stale, keeping instructions
    # single-source (#4479, epic #4167).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check AGENTS.md is in sync with its source
        run: bash scripts/check-agents-md-sync.sh

  config-host-paths:
    name: Config Host-Path Guard
    # Cheap structural check; always runs. #6504: a per-host absolute path
    # (observability.ingestKeyFile, safehouse.socket, …) committed into the
    # TRACKED .loom/config.json is correct on at most one host and silently
    # wrong on every other one that `git pull`s it — this recurred three
    # times (#5354, #5464, #6499's config half) before this guard existed.
    # This is the config-content structural counterpart to the conflict-
    # marker gate (#6499): a content-level check on every tracked config
    # tier, independent of changed-path filtering, so it catches a
    # newly-committed offender wherever it lands.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the host-path detector
        run: bash defaults/scripts/check-config-no-host-paths.sh --self-test
      - name: Check tracked config carries no home-directory absolute paths (#6504)
        run: bash defaults/scripts/check-config-no-host-paths.sh

  docs-defaults-parity:
    name: Docs/Defaults Parity Check
    # Cheap structural check; always runs. Consumer repos populate .loom/docs/
    # FROM defaults/docs/ (resync-installed.sh), so a doc authored only in
    # .loom/docs/ never ships, and a defaults/docs/ link to a sibling that only
    # exists in .loom/docs/ is a dead link in every install — this happened
    # twice (safehouse.md, token-pool.md) before anything caught it (#4841).
    # The self-test step regression-tests the checker itself against a
    # synthetic fixture reproducing that exact case.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the checker against a synthetic fixture
        run: bash scripts/check-docs-defaults-parity.sh --self-test
      - name: Check .loom/docs/ orphans and defaults/docs/ sibling links
        run: bash scripts/check-docs-defaults-parity.sh

  vendored-private-refs:
    name: Vendored Private-Reference Scrub
    # Cheap structural check; always runs. Everything under defaults/ is
    # copy-installed into every consumer repo's .loom/ + .claude/ tree, so a
    # prose incident narrative naming a private org/repo/host ships that
    # identifier to every repo Loom is installed on — and a downstream fix
    # reverts on the next resync (#6190). This asserts the inverse of a
    # denylist: every cross-repo `owner/repo#N` reference and every hostname
    # under defaults/ must be a public or placeholder identifier. The
    # self-test step regression-tests the checker itself against synthetic
    # clean/dirty fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the checker against synthetic fixtures
        run: bash scripts/check-vendored-private-refs.sh --self-test
      - name: Check defaults/ for private repo/host identifiers
        run: bash scripts/check-vendored-private-refs.sh

  defaults-version-bump-check:
    name: defaults/ Changes Require a VERSION Bump
    # PR-only: needs the PR's base commit to diff against, which only exists
    # for pull_request events (a push to main has already merged). Every file
    # under defaults/ is copied into consumers' installed
    # .loom/{scripts,hooks,roles,docs,bin}/ + .claude/commands/loom/ surfaces
    # at install time, NOT refreshed by a git pull -- so a PR that changes
    # defaults/ without bumping VERSION leaves every currency check (fleet
    # resync dry-run, install.sh's own check, /repo:update-tools) reporting
    # "current" while installed surfaces silently diverge (#5874, surfaced by
    # #5846 changing 5 role prompts + a doc with no version bump).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 + an explicit head sha (instead of the default
      # single-commit fetch of the synthetic refs/pull/<N>/merge ref) are
      # both required for the script's `git log BASE..HEAD` commit-message
      # marker check to see the PR's real commits (#6577) -- a shallow
      # merge-ref checkout lands on a synthetic "Merge <head> into <base>"
      # commit with no reachable branch history, silently defeating a
      # marker placed in a real commit message.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check defaults/ changes carry a VERSION bump or marker (#5874, #6577)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash defaults/scripts/check-defaults-version-bump.sh \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  dangling-links:
    name: Dangling Link Check
    # Cheap structural check; always runs. Generalizes #4988 (six dangling
    # internal links shipped in Loom's own docs, caught only by a periodic
    # filer well after the introducing PR merged) into a pre-merge gate:
    # every git-tracked *.md file outside defaults/ (an install-time template
    # tree checked separately by docs-defaults-parity above) must have
    # relative markdown links that resolve to a real file/dir in the repo.
    # The self-test step regression-tests the checker itself against a
    # synthetic fixture (dangling link, fenced-code-block example, valid
    # link, templated placeholder).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the checker against a synthetic fixture
        run: bash scripts/check-dangling-links.sh --self-test
      - name: Check for dangling internal markdown links
        run: bash scripts/check-dangling-links.sh

  gitignore-convergence:
    name: .gitignore Convergence Check
    # Always runs (not gated on backend changes — a drifted .gitignore is
    # detectable regardless of what a PR touches). Generalizes #5014 (the
    # managed gitignore block was missing .loom/account-health.json, found by
    # hand well after the pattern was added to EPHEMERAL_PATTERNS) into a
    # pre-merge gate. `loom-daemon update-gitignore` is already idempotent
    # when the block is converged, so this needs zero new Rust code: build
    # the binary, run update-gitignore against the checked-out repo, then
    # diff .gitignore against the PR's committed version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build loom-daemon
        run: cargo build --package loom-daemon
      - name: Check .gitignore matches the current EPHEMERAL_PATTERNS set
        run: bash scripts/check-gitignore-convergence.sh . target/debug/loom-daemon

  installer-tests:
    name: Installer Integration Tests
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.scripts == 'true')
    # Portable across GNU/BSD sed (temp-file + mv idiom) — runs on ubuntu (#3515)
    # Heavy jobs run on the dedicated CI runner (2AMLogic/2am#29). The
    # expression routes same-repo runs to it and sends fork PRs back to
    # GitHub-hosted instead of skipping them, so required checks never go
    # missing and no outside fork ever executes on our host.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check role prompts reference only real labels (#3786)
        run: bash defaults/scripts/check-phantom-labels.sh
      - name: Check labels.yml copies are in sync (#3896)
        run: bash defaults/scripts/check-labels-drift.sh
      - name: Check label descriptions fit GitHub's 100-char limit (#4335)
        run: bash defaults/scripts/check-label-descriptions.sh
      - name: Check Verdict-Time CAS Recheck sections are intact (#4570)
        run: bash defaults/scripts/check-cas-recheck-consistency.sh
      - name: Run installer tests
        run: bash scripts/test-installer.sh
      - name: Run installer reinstall-safety tests (#4188)
        run: bash defaults/scripts/tests/test-install-reinstall-safety.sh
      - name: Run install --local/--gitignore mode tests (#5276)
        run: bash scripts/test-install-local-mode.sh
      - name: Run migrate-consumer tests (#5276)
        run: bash scripts/test-migrate-consumer.sh

  codex-adapter-smoke:
    name: Codex Adapter Smoke (mocked)
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.scripts == 'true')
    # Tier-2 admission gate for the Codex runtime adapter (epic #4167 Phase 2,
    # issue #4468): a green leg here is what admits the adapter per
    # defaults/docs/runtime-adapters.md's tier policy.
    #
    # NO LIVE OpenAI CALLS. The suite is hermetic by construction — it uses
    # spawn-codex.sh's LOOM_CODEX_NO_EXEC argv-only hook plus a fake `codex`
    # shim on a temp PATH, so the real Codex CLI is never installed or invoked
    # and no credential is required. `codex` is deliberately NOT on PATH here,
    # which also exercises the missing-binary (exit 127) path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check the Codex adapter and its test
        run: |
          bash -n defaults/scripts/spawn-codex.sh
          bash -n defaults/scripts/tests/test-spawn-codex.sh
      - name: Assert the suite cannot reach a real Codex CLI
        # Structural guard: the test must never install, download, or otherwise
        # obtain the real Codex CLI. Combined with `codex` being absent from
        # this runner's PATH, that makes a live OpenAI call impossible.
        run: |
          if grep -nE '(npm|brew|pipx?|curl|wget) .*(codex|openai)' \
              defaults/scripts/tests/test-spawn-codex.sh; then
            echo "::error::test-spawn-codex.sh must not install or fetch a real Codex CLI"
            exit 1
          fi
          # This leg is expected to run on a runner with no Codex CLI at all.
          # A warning rather than a failure: if a future runner image ships
          # `codex`, the suite is still hermetic (every dispatch test prepends
          # its own mock to PATH, and the argv tests never exec anything), so a
          # hard failure here would be spurious rather than protective.
          if command -v codex >/dev/null 2>&1; then
            echo "::warning::a real 'codex' is on PATH; the suite still mocks every dispatch, but verify no test bypasses the mock"
          fi
      - name: Validate the Codex runtime capability manifest
        run: |
          # Valid JSON with the tri-state schema check-runtime-capabilities.sh reads.
          jq -e '.runtime == "codex" and (.capabilities | type == "object")' \
            defaults/runtimes/codex.json > /dev/null
          bad="$(jq -r '.capabilities | to_entries[]
                        | select(.value != "yes" and .value != "no" and .value != "partial")
                        | .key' defaults/runtimes/codex.json)"
          if [[ -n "$bad" ]]; then
            echo "::error::codex.json capability value outside yes|no|partial: $bad"
            exit 1
          fi
          # Codex declares worktreeIsolation=partial, so the Builder role (which
          # requires it) must fail closed with EX_CONFIG (78). This pins the
          # guardrail-parity doc's residual gap 2 to an executable assertion.
          rc=0
          bash defaults/scripts/check-runtime-capabilities.sh \
            --role builder --runtime codex --dir defaults >/dev/null 2>&1 || rc=$?
          if [[ "$rc" != "78" ]]; then
            echo "::error::builder+codex must be incompatible (expected 78, got $rc)"
            exit 1
          fi
          # Judge requires only mcp (declared "yes"), so it must be compatible.
          bash defaults/scripts/check-runtime-capabilities.sh \
            --role judge --runtime codex --dir defaults >/dev/null
      - name: Assert the guardrail-parity doc exists (contract point 6)
        # No runtime is admitted without a parity doc naming its residual gaps.
        run: |
          test -f defaults/docs/guardrail-parity-codex.md
          grep -q '## Residual gaps' defaults/docs/guardrail-parity-codex.md
      - name: Run the mocked Codex adapter test suite
        run: bash defaults/scripts/tests/test-spawn-codex.sh

  shell-suite-tests:
    name: Shell Test Suites (hermetic)
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.scripts == 'true')
    # Audit-and-wire of the defaults/scripts/tests/ population (#4455). Before
    # this job, exactly one suite there ran in CI (Installer Integration Tests)
    # while ~70 others rode to main untested. run-ci-suites.sh runs every suite
    # listed in ci-wired.txt (hermetic + ubuntu-portable); check-ci-suite-
    # manifest.sh enforces that every test-*.sh is either wired or excluded-
    # with-a-reason, so a new suite cannot silently join an unwired pool.
    # Measured runtime: 613s p50 (636s p95) sequential across 22 CI runs,
    # 2026-08-18..20 (#6622) — ci-wired.txt now lists 174 wired suites, not
    # the ~72 this comment used to cite; run-ci-suites.sh prints per-suite
    # timing and a total either way. As of #6622, suites run CONCURRENTLY
    # (default: one worker per runner core, LOOM_CI_PARALLELISM to override)
    # since they are hermetic by construction (this job's own name) — the
    # report is still printed in MANIFEST order after every suite finishes,
    # so "deterministic ordering" no longer requires sequential execution.
    # "Hermetic by construction" is enforced, not assumed: a suite observed
    # failing only under concurrency is pinned to run alone via the runner's
    # SERIAL_LANE_SUITES quarantine list (#6622 AC5).
    #
    # Since #4769 ci-wired.txt also covers the tests/hooks/ Claude-path guard
    # suites (repo root, not defaults/scripts/tests/ — previously unwired
    # entirely). tests/hooks/test-guard-destructive.sh alone adds several
    # minutes (531 assertions); run-ci-suites.sh's per-suite timeout was
    # raised accordingly (see its header comment).
    #
    # Since #4451 ci-wired.txt also covers defaults/hooks/tests/ — the last
    # unwired guard-hook location (background-subagents, loom-workspace,
    # worktree-paths, methodology-inject, skill-router; 128 assertions across
    # the 5 suites). Measured ~1m43s combined on a loaded macOS dev machine
    # (this repo's only prior execution environment); ubuntu-latest is
    # expected to be faster (no per-exec Gatekeeper/codesign overhead, cheaper
    # fork/exec) but this is the suites' first CI run — watch the actual
    # ubuntu wall-clock here and tighten LOOM_CI_SUITE_TIMEOUT only if needed.
    #
    # Since #5275 ci-wired.txt also covers tests/install/ (installer/
    # uninstaller unit suites — previously appeared in this job's `changes`
    # paths-filter trigger only, never actually invoked) and tests/hermit/
    # (the Hermit role's stateless-ceremony heuristic regression guard,
    # previously not referenced by CI at all). All 8 suites are hermetic
    # (fake/stub binaries or local python3 AST fixtures, no live network or
    # forge calls) and run in well under a second each.
    # Heavy jobs run on the dedicated CI runner (2AMLogic/2am#29). The
    # expression routes same-repo runs to it and sends fork PRs back to
    # GitHub-hosted instead of skipping them, so required checks never go
    # missing and no outside fork ever executes on our host.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure git identity for suite fixtures
        # Several worktree/merge-pr suites create fixture commits; a fresh
        # runner has no global identity, so set a throwaway one.
        run: |
          git config --global user.email "ci@loom.test"
          git config --global user.name "Loom CI"
      - name: Assert the wired/excluded manifest invariant (#4455)
        run: bash defaults/scripts/tests/check-ci-suite-manifest.sh
      - name: Run the CI-wired shell test suites
        run: bash defaults/scripts/tests/run-ci-suites.sh

  worker-image-smoke:
    name: loom-worker Image Smoke Test
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.docker == 'true')
    # Heavy jobs run on the dedicated CI runner (2AMLogic/2am#29). The
    # expression routes same-repo runs to it and sends fork PRs back to
    # GitHub-hosted instead of skipping them, so required checks never go
    # missing and no outside fork ever executes on our host.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Native build (the runner IS x86_64-unknown-linux-gnu) — a full
      # cross-compile matrix has no place in a per-PR smoke test; the release
      # workflow's own `build-daemon` matrix already covers every published
      # target, this job only needs the one Linux artifact the Dockerfile
      # actually consumes.
      - name: Build loom-daemon (release)
        run: cargo build --release --package loom-daemon
      - name: Package binary at the path the Dockerfile expects
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/loom-daemon dist/loom-daemon-x86_64-unknown-linux-gnu
      - name: Build the loom-worker image (no push)
        run: docker build -f docker/worker/Dockerfile -t loom-worker:ci-smoke .
      - name: Run the smoke test
        run: ./docker/worker/test-image.sh loom-worker:ci-smoke

  session-image-smoke:
    name: loom-worker-session Image Smoke Test
    # Mirrors worker-image-smoke exactly (same `changes.docker` gate — this
    # image is FROM loom-worker, so any docker/** change, including a
    # loom-worker-only one, is worth re-validating this layer against): #6899,
    # Epic #6896 Phase 1. Builds the base loom-worker image locally first
    # (needed as this Dockerfile's FROM target) rather than pulling
    # ghcr.io/rjwalters/loom-worker — a PR's Dockerfile changes are not
    # published anywhere to pull from, and this keeps the check hermetic.
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build loom-daemon (release)
        run: cargo build --release --package loom-daemon
      - name: Package binary at the path the Dockerfile expects
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/loom-daemon dist/loom-daemon-x86_64-unknown-linux-gnu
      - name: Build the loom-worker base image (no push, local FROM target)
        run: docker build -f docker/worker/Dockerfile -t ghcr.io/rjwalters/loom-worker:ci-smoke .
      - name: Build the loom-worker-session image (no push)
        run: |
          docker build -f docker/session/Dockerfile \
            --build-arg BASE_IMAGE=ghcr.io/rjwalters/loom-worker:ci-smoke \
            -t loom-worker-session:ci-smoke .
      - name: Run the smoke test
        run: ./docker/session/test-image.sh loom-worker-session:ci-smoke
