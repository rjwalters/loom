name: Shell Script Linting

on:
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - '.shellcheckrc'
      - '.github/workflows/shell-lint.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '.shellcheckrc'
      - '.github/workflows/shell-lint.yml'

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install shellcheck v0.10.0
        run: |
          SHELLCHECK_VERSION="v0.10.0"
          wget -qO- "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJv
          sudo cp "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/bin/shellcheck
          sudo chmod +x /usr/bin/shellcheck
          shellcheck --version

      - name: Run shellcheck
        run: |
          set -euo pipefail

          # EVERY tracked `.sh`, not just defaults/scripts/ (#8072). Until this
          # change 129 tracked `.sh` files were never linted at all, including
          # defaults/hooks/ (the guard layer) and scripts/ (the CI ratchets).
          #
          # Scope is `.sh` by extension, matching check-shell-syntax.sh's own
          # documented choice. Five tracked shell scripts have no `.sh`
          # extension (.githooks/pre-commit, {,defaults/}.loom/bin/loom,
          # scripts/loom, guard-readonly-dirs.sh.template) and are NOT covered;
          # two of them have live findings. Widening to them is a separate
          # change with its own fixes, not a silent extension of this one.
          # Portable read loop rather than `mapfile -d ''` (bash 4.4+) so this
          # exact block can be pasted into a dev shell on macOS, where /bin/bash
          # is still 3.2. A gate nobody can reproduce locally gets worked around.
          ALL=()
          while IFS= read -r -d '' f; do ALL+=("$f"); done < <(git ls-files -z '*.sh')

          # An empty or implausibly small file list means discovery broke, not
          # that the repo stopped having shell. Without this, a bad glob makes
          # the job pass while linting nothing.
          if (( ${#ALL[@]} < 400 )); then
            echo "ERROR: expected 400+ tracked .sh files, found ${#ALL[@]}." >&2
            echo "Shell discovery is broken -- refusing to pass on an empty lint." >&2
            exit 1
          fi

          # The vendored copy of Repo Skills' generic destructive guard (and its
          # installed .loom/hooks/ mirror) is upstream's file -- its own header
          # says DO NOT hand-edit, fixes go to rjwalters/repo (#4041). SC1078
          # false-positives on apostrophes inside its prose comments, so that ONE
          # check is dropped for those two paths; all other checks still apply.
          VENDORED=()
          GENERAL=()
          for f in "${ALL[@]}"; do
            case "$f" in
              */hooks/guard-destructive-generic.sh) VENDORED+=("$f") ;;
              *)                                    GENERAL+=("$f") ;;
            esac
          done

          # Both arrays are expansion-guarded: under macOS bash 3.2 an empty
          # array under `set -u` is an unbound-variable error, not an empty
          # word list, which would surface as a confusing crash instead of the
          # intended message.
          if (( ${#GENERAL[@]} > 0 )); then
            echo "Linting ${#GENERAL[@]} tracked shell scripts (all checks)..."
            shellcheck --severity=warning --format=gcc "${GENERAL[@]}"
          fi

          if (( ${#VENDORED[@]} > 0 )); then
            echo "Linting ${#VENDORED[@]} vendored guard copies (SC1078 excluded)..."
            shellcheck --severity=warning --format=gcc --exclude=SC1078 "${VENDORED[@]}"
          fi

          echo "All ${#ALL[@]} tracked shell scripts passed shellcheck."
