name: Full configured hosted build gate

# Reusable execution of the existing command; no substitute suite or cached verdict.
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      issue:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  hosted-build-gate:
    name: Full configured build gate (immutable candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      LOOM_GATE_SHA: ${{ inputs.candidate_sha }}
      LOOM_GATE_ISSUE: ${{ inputs.issue }}
      CARGO_BUILD_JOBS: '2'
      LOOM_BUILD_GATE_TIER: full
    steps:
      - name: Validate immutable candidate inputs
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('CARGO_TARGET_DIR', require('path').join(process.env.RUNNER_TEMP, 'loom-hosted-gate-target'));
            if (!/^[0-9a-f]{40}$/.test(process.env.LOOM_GATE_SHA)) {
              throw new Error('gate_sha must be a full lowercase immutable commit SHA');
            }
            if (!/^[1-9][0-9]{0,9}$/.test(process.env.LOOM_GATE_ISSUE)) {
              throw new Error('gate_issue must be a positive issue number');
            }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Create exact-candidate managed worktree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git branch hosted-gate-base "$LOOM_GATE_SHA"
          bash .loom/scripts/worktree.sh "$LOOM_GATE_ISSUE" "hosted-gate-$GITHUB_RUN_ID" --base hosted-gate-base
      - name: Verify worktree and record gate predicates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {execFileSync} = require('child_process');
            const cwd = path.join(process.env.GITHUB_WORKSPACE, '.loom/worktrees', `issue-${process.env.LOOM_GATE_ISSUE}`);
            const git = (...args) => execFileSync('git', args, {cwd, encoding:'utf8'}).trim();
            const sha = git('rev-parse', 'HEAD');
            if (sha !== process.env.LOOM_GATE_SHA) throw new Error('managed worktree does not match candidate SHA');
            const config = JSON.parse(fs.readFileSync(path.join(cwd, '.loom/config.json'), 'utf8'));
            if (config.buildGate?.enabled !== true || config.buildGate.command !== 'bash .loom/scripts/build-gate.sh') {
              throw new Error('candidate does not configure the expected enabled full gate');
            }
            const commitsAhead = Number(git('rev-list', '--count', 'origin/main..HEAD'));
            if (!(commitsAhead > 0)) throw new Error('candidate has no commits ahead of origin/main');
            const evidence = {sha, issue:process.env.LOOM_GATE_ISSUE, originMain:git('rev-parse','origin/main'), commitsAhead,
              changedFiles:git('diff','--name-only','origin/main...HEAD').split('\n').filter(Boolean),
              realChangeGlobs:config.buildGate.realChangeGlobs, command:config.buildGate.command,
              realChangeDecision:'orchestrator must verify matching deliverables or record an explicit scope exception',
              host:process.env.RUNNER_OS, target:process.env.CARGO_TARGET_DIR};
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'hosted-gate-evidence.json'), JSON.stringify(evidence,null,2));
            core.info(JSON.stringify(evidence));
      - name: Run the configured full build gate
        working-directory: .loom/worktrees/issue-${{ inputs.issue }}
        shell: bash
        run: bash .loom/scripts/build-gate.sh 2>&1 | tee "$RUNNER_TEMP/hosted-gate.log"
      - name: Run additional OTLP feature unit tests
        working-directory: .loom/worktrees/issue-${{ inputs.issue }}
        shell: bash
        run: cargo nextest run --package loom-daemon --features otlp --lib --bins --profile ci 2>&1 | tee "$RUNNER_TEMP/hosted-otlp-tests.log"
      - name: Retain actual gate output and immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-gate-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/hosted-gate.log
            ${{ runner.temp }}/hosted-gate-evidence.json
            ${{ runner.temp }}/hosted-otlp-tests.log
          if-no-files-found: warn
