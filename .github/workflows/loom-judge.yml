name: Loom Judge

# Periodic support role for the Loom orchestration system.
#
# Judge evaluates PRs labeled `loom:review-requested` and either approves
# (moving them to `loom:pr`) or requests changes (moving them to
# `loom:changes-requested`).
#
# Cadence: every 5 minutes (matches the daemon's historical interval).
#
# Disabled by default. To enable on your fork:
#   1. Uncomment the `schedule:` block below.
#   2. Add a `CLAUDE_API_KEY` secret to the repository
#      (Settings -> Secrets and variables -> Actions).
#
# This is Phase 2a of the shepherd/daemon deprecation epic (#3372 / #3375).

on:
  # Not dead code: this commented block IS the fork opt-in the header describes (#8060).
  # schedule:
  #   # Uncomment and set CLAUDE_API_KEY secret to enable.
  #   - cron: "*/5 * * * *"
  workflow_dispatch:  # Allow manual runs for testing.

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Bare tier alias, not a pinned ID (#8060). The #3477 Phase 1 rule was
        # "pin an exact ID and bump deliberately on lineup changes"; nobody
        # bumped, and these five files sat two generations behind while the
        # daemon path resolved `sonnet`/`opus` to the current generation. A
        # deliberate bump nobody performs is a stale pin, so the alias — which
        # the CLI resolves at dispatch — is the honest encoding of the intent.
        # `stale-model-pins` in ci.yml keeps a pinned ID from creeping back.
        run: claude -p "/loom:judge" --model opus --dangerously-skip-permissions
