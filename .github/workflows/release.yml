name: Build and Release
#
# Release artifacts (Epic #4990): on GitHub Release creation this workflow
# cross-builds `loom-daemon` for every platform in the fleet's target triples
# and uploads, for EACH one, the binary plus a `.sha256` checksum file as
# Release assets:
#
#   - loom-daemon-aarch64-apple-darwin(.sha256)
#   - loom-daemon-x86_64-unknown-linux-gnu(.sha256)
#   - loom-daemon-aarch64-unknown-linux-gnu(.sha256)
#
# Phase 1 (#5003) shipped the unsigned build + checksum foundation. Phase 2
# (#5011, this change) layers OPTIONAL platform signing on top, following the
# public-mechanism/private-identity split: the mechanism is tracked here, every
# deployer-specific value arrives as a secret (see
# `dashboard/docs/reference-deployment.md`):
#
#   - macOS Developer ID codesign of the aarch64-apple-darwin artifact, plus
#     optional notarization, when the Developer ID / notary secrets are set.
#   - cosign detached-signature (`.sig`) over the Linux artifacts.
#
# The macOS signing steps are gated on Actions secrets being present and skip
# cleanly (with a LOUD entry in the run summary, never silent) when they are
# absent — a no-secrets release still succeeds with unsigned macOS artifacts +
# checksums, byte-for-byte as Phase 1 left it. No org name, team ID, cert
# reference, or other deployer identity lives in this file or any tracked file:
# all identity comes from secrets only. If you ever need to hardcode one here,
# that's a scope regression — put it in a secret instead.
#
# Linux signing is KEYLESS by default (#5054): cosign gets a short-lived
# Sigstore certificate from the workflow's own GitHub Actions OIDC token, so it
# needs NO secret to be provisioned and publishes no long-lived key material.
# That is what lets `loom-daemon-update.sh` verify for real on a stock install
# instead of loud-skipping for want of a distributed public key. A repo that
# still wants classic key signing sets the COSIGN_PRIVATE_KEY secret, which
# takes precedence (see the detect step below); it then owes its consumers the
# matching public key out of band.
#
# Artifacts include checksums and platform signatures; Linux keyless signatures
# carry a .pem certificate. Update verification is owned by loom-daemon-update.sh.
#
# Release on every VERSION bump (#7609): a `push` to `main` that
# changes `VERSION` runs the `resolve` job first, which creates the tag
# `v<VERSION>` at that commit and a GitHub Release for it (skipping cleanly
# when the Release already exists), and every later job keys off
# `needs.resolve.outputs.{tag,publish}` instead of the raw trigger event. A
# Release created with the workflow's own GITHUB_TOKEN does NOT fire a second
# `release` event, so a bump produces exactly one run. This is what keeps the
# signed artifacts current with `main` — before it, Releases were cut by hand
# at minor versions only, the fleet's self-update could never resolve a
# current artifact (#6010), and every host rebuilt from source (and on macOS
# re-signed locally, #7605). A hand-created Release or a `workflow_dispatch`
# dry run behaves exactly as before.
#
# Each target builds in its own matrix job with `fail-fast: false`: one
# platform's build failure fails that job (and therefore the overall workflow
# run) loudly — it never silently drops just that platform's artifact while
# reporting overall success.
#
# The Linux legs (`x86_64-unknown-linux-gnu`, `aarch64-unknown-linux-gnu`) pin
# `os: ubuntu-22.04` rather than `ubuntu-latest` (#8842): a shipped binary's
# glibc requirement tracks the runner it was built on, and `ubuntu-latest` is
# a moving label that silently rolled to a newer glibc floor than the fleet's
# oldest worker supports — the root cause of the 2026-09-24 incident (#8837)
# where a cross-host prebuilt bricked a glibc-2.35 worker. See
# .loom/docs/release-glibc-floor.md for the decided floor and its own
# release-time verification step.
#
# `build-worker-image` (#5325, multi-arch #7388) publishes
# `ghcr.io/rjwalters/loom-worker` — a pinned OCI base image for fleet workers
# — alongside the raw binary/checksum artifacts above. It is a SEPARATE
# deliverable from `build-daemon`: it needs only the already-built
# `x86_64-unknown-linux-gnu` + `aarch64-unknown-linux-gnu` binaries (no
# rebuild), and it is deliberately gated to push only from the canonical repo
# on an actual `release` event (see the job's own comments) — a fork's
# `workflow_dispatch` dry run still builds the native (amd64) leg of the
# image (verifying the Dockerfile) but never attempts to push a multi-arch
# manifest to a registry namespace it has no write access to. Shape decision
# (sweep-execution environment, not daemon-as-PID-1) and the image's `FROM`
# contract: docker/worker/README.md.
#
# `build-session-image` (#6899, Epic #6896 Phase 1, ADR-0017) publishes
# `ghcr.io/rjwalters/loom-worker-session` — a same-version FROM layer on top
# of loom-worker adding the Codex CLI and a persistent tmux-server entrypoint
# for Phase 2's per-account session containers. Mirrors build-worker-image's
# shape (build+smoke-test unconditionally, push gated to a canonical-repo
# release) exactly; see docker/session/README.md for its own FROM contract.
#
# `build-native-image` (#8403, Epic #6896 Phase 3, ADR-0017) publishes
# `ghcr.io/rjwalters/loom-worker-native` — a same-version FROM layer on top of
# loom-worker adding the PINNED Pi/OpenCode CLIs, for the per-sweep EPHEMERAL
# containers native-harness sweeps run in. Same shape as build-session-image
# (which serves the other, PERSISTENT lifetime for Codex); see
# docker/native/README.md for why the two are separate images rather than one.

on:
  release:
    types: [created]
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (e.g., v0.1.0)'
        required: false
        type: string
      gate_sha:
        description: 'Optional immutable 40-character commit SHA: run only the full hosted build gate'
        required: false
        type: string
      gate_issue:
        description: 'Issue number for the hosted gate managed worktree (required with gate_sha)'
        required: false
        type: string

# One run per tag: a second push of the same VERSION (or a manual re-run) waits
# rather than racing the first run's asset uploads. Never cancels — a half-
# uploaded Release is worse than a late one.
concurrency:
  group: release-${{ github.event.inputs.gate_sha || github.event.release.tag_name || github.event.inputs.tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  # Keyless cosign signing of the Linux artifacts (#5054): mints the workflow's
  # OIDC token so Fulcio can issue the short-lived signing certificate. This is
  # the ONLY thing that grants signing authority here — there is no key to leak,
  # and no secret to provision before a release can be signed.
  id-token: write
  # `build-worker-image` (#5325) pushes ghcr.io/rjwalters/loom-worker using the
  # default GITHUB_TOKEN — no separate registry secret to provision. Read-only
  # everywhere else; only that job's own `permissions:` block actually uses this.
  packages: write

jobs:
  hosted-build-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.gate_sha != ''
    uses: ./.github/workflows/hosted-build-gate.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      candidate_sha: ${{ inputs.gate_sha }}
      issue: ${{ inputs.gate_issue }}

  # Resolves the ONE tag every later job builds, uploads to, and downloads
  # from, and whether this run publishes at all:
  #   release           → the created Release's tag; publish=true
  #   workflow_dispatch → inputs.tag (may be empty = build github.ref);
  #                       publish=false (Actions artifacts only, as before)
  #   push (VERSION)    → v<VERSION>; creates tag + Release if absent →
  #                       publish=true; publish=skip if it already exists
  resolve:
    name: Resolve release tag
    if: github.event_name != 'workflow_dispatch' || inputs.gate_sha == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      # `true` only on the path that CREATES the Release here (a VERSION bump
      # on main). That Release is created with `--latest=false` (#8515), so
      # something has to promote it once every asset has landed — see the
      # `promote-release` job. Every other path (a hand-created Release, a
      # workflow_dispatch dry run, a Release that already existed) leaves the
      # repository's "Latest" pointer exactly where it found it.
      promote: ${{ steps.resolve.outputs.promote }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag (and create the Release on a VERSION bump)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release)
              # A human/`/repo:release` created this Release themselves and
              # GitHub already applied their "Latest" choice to it. Re-deciding
              # that here would be this workflow overriding an explicit act, so
              # promote=false (#8515).
              {
                echo "tag=$RELEASE_TAG"
                echo "publish=true"
                echo "promote=false"
              } >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              {
                echo "tag=$INPUT_TAG"
                echo "publish=false"
                echo "promote=false"
              } >> "$GITHUB_OUTPUT"
              ;;
            push)
              version="$(./scripts/version.sh)"
              tag="v${version}"
              if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
                echo "::notice::Release $tag already exists — this push publishes nothing."
                echo "- SKIPPED: Release \`$tag\` already exists." >> "$GITHUB_STEP_SUMMARY"
                # promote=false: nothing was built or uploaded by this run, so
                # it has no standing to move the "Latest" pointer (#8515).
                {
                  echo "tag=$tag"
                  echo "publish=skip"
                  echo "promote=false"
                } >> "$GITHUB_OUTPUT"
              else
                # --target creates the tag at this exact commit when it does not
                # exist yet; --generate-notes diffs against the previous tag.
                #
                # --latest=false is load-bearing (#8515): this Release is
                # created BEFORE `build-daemon` has uploaded a single asset, so
                # without it `releases/latest` would name an asset-less Release
                # for the whole duration of the build matrix — minutes during
                # which every updater on every platform correctly concludes
                # "this release has no artifact for my target" and either
                # rebuilds from source (soft path) or hard-fails (`--fetch`).
                # The Release, its tag and its notes are all still published
                # immediately and fetchable BY TAG; only the repository's
                # "Latest" pointer waits, and it is moved by the
                # `promote-release` job once every matrix leg has uploaded.
                # A matrix failure therefore leaves "Latest" on the previous,
                # complete Release rather than advancing it onto a broken one.
                #
                # Bounded retry (#8290): a one-off HTTP 403/5xx from the
                # releases API (observed once, "Resource not accessible by
                # integration", immediately followed by a clean run of the
                # identical call one bump later) previously failed this step
                # outright and left that version's tag/Release uncreated for
                # good. Retry a transient-looking failure up to 2 times
                # (3 attempts total) with a short backoff, logging every
                # attempt, before giving up for real.
                max_attempts=3
                attempt=1
                while :; do
                  # `|| create_status=$?` serves two purposes here under
                  # `set -e`: (1) it stops a failing `gh` call from
                  # aborting the whole step immediately (a command
                  # followed by `||` is exempt from errexit); (2) it lets
                  # us capture the real exit status right here — `if
                  # create_output="$(...)"; then …; fi` with no `else`
                  # would instead report the *if statement's own* status
                  # (0) on the false branch, not the failed command's.
                  create_status=0
                  create_output="$(gh release create "$tag" --repo "$REPO" --target "$SHA" \
                    --title "$tag" --generate-notes --latest=false 2>&1)" || create_status=$?
                  if [ "$create_status" -eq 0 ]; then
                    echo "$create_output"
                    break
                  fi
                  echo "::warning::gh release create for $tag failed on attempt $attempt/$max_attempts: $create_output"
                  # A concurrent run (or a retry racing our own prior attempt
                  # that actually succeeded server-side before timing out)
                  # can make gh report the release already exists — that is
                  # success, not a transient failure, so don't retry-loop on it.
                  if printf '%s' "$create_output" | grep -qiE 'already exists'; then
                    echo "::notice::Release $tag already exists (created by a concurrent/prior attempt) — treating as success."
                    break
                  fi
                  if [ "$attempt" -ge "$max_attempts" ]; then
                    echo "::error::gh release create for $tag failed after $max_attempts attempts — giving up. Last output: $create_output"
                    exit "$create_status"
                  fi
                  if printf '%s' "$create_output" | grep -qE 'HTTP (403|5[0-9]{2})'; then
                    backoff=$((attempt * 5))
                    echo "Transient-looking failure (403/5xx) — retrying in ${backoff}s (attempt $((attempt + 1))/$max_attempts)..."
                    sleep "$backoff"
                    attempt=$((attempt + 1))
                  else
                    echo "::error::gh release create for $tag failed with a non-retryable error: $create_output"
                    exit "$create_status"
                  fi
                done
                echo "- Created Release \`$tag\` at \`${SHA:0:12}\` (VERSION bump on main), NOT yet marked Latest (#8515)." >> "$GITHUB_STEP_SUMMARY"
                {
                  echo "tag=$tag"
                  echo "publish=true"
                  echo "promote=true"
                } >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::unsupported event $EVENT_NAME"; exit 1
              ;;
          esac

  build-daemon:
    name: Build loom-daemon (${{ matrix.target }})
    needs: resolve
    if: needs.resolve.outputs.publish != 'skip'
    runs-on: ${{ matrix.os }}
    strategy:
      # Never mask a platform's failure with another's success, and never let
      # one platform's failure cancel an in-flight build for another.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14 # Apple Silicon runner (native build)
            cross: false
          - target: x86_64-unknown-linux-gnu
            # Pinned, not `ubuntu-latest` (#8842): the shipped binary's glibc
            # requirement tracks whatever glibc THIS runner ships, and
            # `ubuntu-latest` is a moving label — it silently rolled from
            # Ubuntu 22.04 (glibc 2.35) to 24.04 (glibc 2.39) well before
            # 2026-09-24, which is exactly what bricked a glibc-2.35 fleet
            # worker that day (#8837). `ubuntu-22.04` pins the build host's
            # glibc floor to the documented minimum instead — see
            # .loom/docs/release-glibc-floor.md for the decided floor and how to
            # change it.
            os: ubuntu-22.04 # native build
            cross: false
          - target: aarch64-unknown-linux-gnu
            # Same pin, same reason: the cross-compilation toolchain below
            # (`gcc-aarch64-linux-gnu`) links against ITS runner's sysroot, so
            # an unpinned `ubuntu-latest` here would drift this artifact's
            # glibc floor exactly like the native x86_64 build above — the
            # aarch64 leg is not exempt just because it cross-compiles.
            os: ubuntu-22.04
            # No native aarch64 Linux runner assumption is made here — cross
            # compile via an aarch64 gcc/binutils toolchain instead, which
            # works on any pinned-version Ubuntu runner regardless of
            # arm64-runner availability for this repo/org.
            cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag || github.ref }}

      # Cheap release-time gate (#8842, complements the `ubuntu-22.04` pin
      # above): confirm the runner this build actually landed on still
      # reports the documented glibc floor (.loom/docs/release-glibc-floor.md)
      # rather than trusting the OS-version label alone. This is what
      # catches it loudly, at build time, if a pinned `ubuntu-22.04` label is
      # ever retired/rerouted by GitHub Actions to a newer image — the exact
      # kind of silent drift `ubuntu-latest` already did once (#8837) — before
      # a newer-glibc artifact ships to the fleet again.
      - name: Verify build host glibc floor
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        run: |
          set -euo pipefail
          floor_major=2
          floor_minor=35
          host_version="$(ldd --version | head -n1 | awk '{print $NF}')"
          host_major="$(printf '%s' "$host_version" | cut -d. -f1)"
          host_minor="$(printf '%s' "$host_version" | cut -d. -f2)"
          echo "Build host glibc: ${host_version} (documented floor: ${floor_major}.${floor_minor})"
          if [ "$host_major" -gt "$floor_major" ] || { [ "$host_major" -eq "$floor_major" ] && [ "$host_minor" -gt "$floor_minor" ]; }; then
            echo "::error::Build host glibc ${host_version} is newer than the documented floor ${floor_major}.${floor_minor} — this runner has drifted (see .loom/docs/release-glibc-floor.md). The shipped ${{ matrix.target }} binary would require a newer glibc than the fleet's oldest supported host provides. Re-pin the runner (or lower workers) before releasing."
            exit 1
          fi
          echo "OK: build host glibc is within the documented floor."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # dtolnay/rust-toolchain's `targets:` input installs the target onto
      # whatever toolchain the action itself resolves — here, `stable`. This
      # repo pins `channel = "1.96.0"` in rust-toolchain.toml, so `cargo`
      # actually builds under 1.96.0, a toolchain the step above never
      # touched — leaving cross targets like aarch64-unknown-linux-gnu
      # without std and failing with `error[E0463]: can't find crate for
      # core` (#5167). `rustup target add` (unlike the action's `targets:`
      # input) operates on the directory's *active* toolchain, which rustup
      # resolves via rust-toolchain.toml, so it correctly lands the target on
      # 1.96.0 instead. The toolchain channel remains pinned in exactly one
      # place: rust-toolchain.toml.
      - name: Add Rust target for pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          # Include the runner image (#9036): rust-cache's automatic key has
          # runner.os ("Linux") but not the image version, so after #8899
          # pinned these legs to ubuntu-22.04 they restored a target dir built
          # on ubuntu-24.04 (glibc 2.39) and failed to link its C objects
          # against glibc 2.35 (undefined __isoc23_sscanf/__isoc23_strtol).
          key: ${{ matrix.target }}-${{ matrix.os }}

      - name: Install cross-compilation toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Fast preflight (#5167 acceptance criterion): confirm the pinned
      # toolchain actually has this target's std installed before kicking off
      # the full `cargo build`, so a future toolchain/target mismatch fails in
      # seconds instead of after several minutes of dependency compilation.
      - name: Verify target std is installed
        run: |
          set -euo pipefail
          if ! rustup target list --installed | grep -qx "${{ matrix.target }}"; then
            echo "::error::rustup did not install std for target '${{ matrix.target }}' on the active toolchain ($(rustc --version)). Check that rust-toolchain.toml's pinned channel supports this target." >&2
            exit 1
          fi
          echo "Confirmed: ${{ matrix.target }} std is installed for $(rustc --version)."

      - name: Build loom-daemon
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --package loom-daemon --release --features otlp --target ${{ matrix.target }}

      - name: Verify released OTLP capability
        if: ${{ !matrix.cross }}
        run: target/${{ matrix.target }}/release/loom-daemon telemetry-capabilities --require-otlp

      - name: Decode released binary telemetry with the pinned Collector
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          LOOM_OTLP_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/loom-daemon
        run: cargo test --package loom-daemon --release --features otlp --target ${{ matrix.target }} --test otlp_collector -- --ignored --nocapture

      - name: Package artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/loom-daemon" "dist/loom-daemon-${{ matrix.target }}"

      # Detect which signing secrets are present and record the decision as step
      # outputs. GitHub Actions cannot reference `secrets.*` directly in an
      # `if:` condition, so the canonical idiom is: map secrets into env here,
      # test them, and gate later steps on THESE outputs. This step also emits
      # the LOUD skip lines the epic's design principle 2 requires — every
      # absent-secret path writes an explicit "SKIPPED (why)" row to the run
      # summary, so the skip is asserted, not implied by checksum-only output.
      - name: Detect signing secrets (loud skip if absent)
        id: signing
        env:
          MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          macos_sign=false
          notarize=false
          linux_sign=false
          linux_sign_mode=none

          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          summary "### Signing (${target})"

          case "$target" in
            *-apple-darwin)
              if [ -n "${MACOS_SIGNING_CERT_P12:-}" ] \
                  && [ -n "${MACOS_SIGNING_CERT_PASSWORD:-}" ] \
                  && [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
                macos_sign=true
                summary "- Signed: Developer ID secrets present — codesigning \`${target}\` in place."
                if [ -n "${MACOS_NOTARY_KEY:-}" ] \
                    && [ -n "${MACOS_NOTARY_KEY_ID:-}" ] \
                    && [ -n "${MACOS_NOTARY_ISSUER_ID:-}" ]; then
                  notarize=true
                  summary "- Notarized: notary API key secrets present — notarizing after signing."
                else
                  summary "- SKIPPED notarization: notary API key secrets absent (belt-and-suspenders only for the curl/gh download path, which sets no quarantine attribute — not required)."
                  echo "::notice::macOS notarization skipped for ${target} (notary secrets absent)."
                fi
              else
                summary "- SKIPPED signing: Developer ID cert/identity secrets absent — shipping UNSIGNED \`${target}\` + checksum (Phase 1 behavior)."
                echo "::notice::macOS signing skipped for ${target} (Developer ID secrets absent); shipping unsigned artifact + checksum."
              fi
              ;;
            *-linux-*)
              # Precedence: an explicitly provisioned key wins (a repo that set
              # COSIGN_PRIVATE_KEY has already told its consumers which key to
              # trust, and silently switching it to keyless would invalidate
              # that). Otherwise keyless, which needs no secret at all — so the
              # DEFAULT for this repo, and for every fork, is a really-signed
              # Linux artifact rather than an unsigned one (#5054).
              if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
                linux_sign=true
                linux_sign_mode=key
                summary "- Signed (key mode): COSIGN_PRIVATE_KEY secret present — writing detached \`${target}.sig\`. Consumers must resolve the matching public key themselves (LOOM_DAEMON_UPDATE_COSIGN_PUBKEY / \`.loom/cosign.pub\`)."
              elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
                linux_sign=true
                linux_sign_mode=keyless
                summary "- Signed (keyless): using this workflow's GitHub Actions OIDC identity — writing detached \`${target}.sig\` + its signing certificate \`${target}.pem\`. No key material is distributed; consumers verify the signer identity."
              else
                summary "- SKIPPED signing: no COSIGN_PRIVATE_KEY secret AND no OIDC token (the job lacks \`id-token: write\`) — shipping UNSIGNED \`${target}\` + checksum (Phase 1 behavior)."
                echo "::notice::Linux signing skipped for ${target} (no cosign key and no OIDC token); shipping unsigned artifact + checksum."
              fi
              ;;
          esac

          {
            echo "macos_sign=${macos_sign}"
            echo "notarize=${notarize}"
            echo "linux_sign=${linux_sign}"
            echo "linux_sign_mode=${linux_sign_mode}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign macOS artifact (Developer ID)
        if: steps.signing.outputs.macos_sign == 'true'
        env:
          MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          artifact="dist/loom-daemon-${{ matrix.target }}"
          # Import the Developer ID cert into a throwaway keychain scoped to this
          # job's RUNNER_TEMP so no identity persists on the runner. The p12 and
          # its password are secrets; the identity string (which embeds the org
          # name + team ID) is likewise a secret — never spelled out here.
          keychain="$RUNNER_TEMP/loom-signing.keychain-db"
          p12="$RUNNER_TEMP/loom-cert.p12"
          printf '%s' "$MACOS_SIGNING_CERT_P12" | base64 --decode > "$p12"
          security create-keychain -p "$MACOS_SIGNING_CERT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$MACOS_SIGNING_CERT_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          # Allow codesign to use the imported key non-interactively.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_SIGNING_CERT_PASSWORD" "$keychain" >/dev/null
          # Put our keychain on the user search list so codesign resolves the identity.
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain"
          # `--options runtime` (hardened runtime) is a notarization prerequisite;
          # `--timestamp` binds a secure timestamp so the signature outlives the
          # cert's validity window.
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "$artifact"
          codesign --verify --strict --verbose=2 "$artifact"
          rm -f "$p12"

      - name: Notarize macOS artifact
        if: steps.signing.outputs.notarize == 'true'
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          artifact="dist/loom-daemon-${{ matrix.target }}"
          # notarytool only accepts container formats (zip/dmg/pkg), so submit a
          # zip of the bare binary. A bare Mach-O cannot be stapled (stapling
          # supports only bundles/dmg/pkg), so notarization is registered
          # server-side with no on-disk ticket. For this repo's curl/gh download
          # path — which sets no quarantine attribute — that server-side record
          # is all Gatekeeper would ever consult, so no staple is needed and the
          # uploaded asset stays the bare signed binary.
          key="$RUNNER_TEMP/notary-key.p8"
          zip="$RUNNER_TEMP/loom-daemon-${{ matrix.target }}.zip"
          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$key"
          ditto -c -k "$artifact" "$zip"
          xcrun notarytool submit "$zip" \
            --key "$key" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          rm -f "$key" "$zip"

      - name: Install cosign
        if: steps.signing.outputs.linux_sign == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign Linux artifact (cosign)
        if: steps.signing.outputs.linux_sign == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGN_MODE: ${{ steps.signing.outputs.linux_sign_mode }}
        run: |
          set -euo pipefail
          artifact="dist/loom-daemon-${{ matrix.target }}"
          sig="dist/loom-daemon-${{ matrix.target }}.sig"
          cert="dist/loom-daemon-${{ matrix.target }}.pem"
          if [ "$SIGN_MODE" = "keyless" ]; then
            # Keyless (#5054): cosign exchanges this workflow's OIDC token for a
            # short-lived Fulcio certificate whose SAN is
            #   https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/<tag>
            # and records the signature in Rekor. Publishing the certificate
            # next to the signature is what lets a consumer verify with NO
            # distributed key:
            #   cosign verify-blob --certificate <target>.pem --signature <target>.sig \
            #     --certificate-identity-regexp '^https://github\.com/<slug>/\.github/workflows/[^@]+@refs/tags/<tag>$' \
            #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <binary>
            cosign sign-blob --yes \
              --output-signature "$sig" \
              --output-certificate "$cert" \
              "$artifact"
          else
            # Key mode (only when COSIGN_PRIVATE_KEY is set): detached signature
            # verified as `cosign verify-blob --key <pubkey> --signature <sig>`.
            # COSIGN_PASSWORD is read from the env by cosign to decrypt the key.
            key="$RUNNER_TEMP/cosign.key"
            printf '%s' "$COSIGN_PRIVATE_KEY" > "$key"
            cosign sign-blob --yes --key "$key" \
              --output-signature "$sig" \
              "$artifact"
            rm -f "$key"
          fi

      # Checksum is computed AFTER signing so it covers the FINAL bytes (macOS
      # codesign rewrites the Mach-O in place). Phase 3 verifies this checksum
      # unconditionally, so it must match whatever is uploaded. In the
      # no-secrets case nothing above modified the binary, so this is
      # byte-identical to Phase 1's checksum.
      - name: Compute checksum
        run: |
          set -euo pipefail
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "loom-daemon-${{ matrix.target }}" > "loom-daemon-${{ matrix.target }}.sha256"
          else
            sha256sum "loom-daemon-${{ matrix.target }}" > "loom-daemon-${{ matrix.target }}.sha256"
          fi
          ls -la

      # Upload this platform's assets under a verify -> upload-missing ->
      # re-verify loop (#8071).
      #
      # This step used to be a bare `softprops/action-gh-release@v3`, which does
      # not retry: ONE transient "Error saving asset" from GitHub's asset API
      # failed the job with the Release left partially uploaded, and nothing in
      # CI noticed — every occurrence was found later by an Auditor pass. It was
      # not a one-off: v0.19.118 (aarch64-linux binary), v0.19.119/120/121
      # (x86_64-linux binary and sidecars) and v0.19.123 (aarch64-darwin, all of
      # it) each shipped an incomplete asset set. The gaps hit 96-byte `.sig`
      # files as readily as the ~26MB binary, so this is API flakiness rather
      # than a size/timeout effect — per-file retry is the right shape, and a
      # whole-step retry wrapper would not be.
      #
      # The completeness check IS the retry loop's condition, so "retry" and
      # "verify every expected file landed" are one mechanism that cannot
      # disagree with itself: the step succeeds only once the Release actually
      # carries every expected file in GitHub's terminal `uploaded` state, and
      # otherwise fails loudly naming exactly what is missing.
      - name: Upload release assets
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd dist

          # The expected set is whatever these four patterns match ON DISK —
          # the same list the old `files:` block used. Deriving it from disk
          # rather than from a hardcoded per-target table keeps every skip path
          # correct with no branching: a darwin build has no `.sig`/`.pem`, an
          # unsigned build has neither, and a key-mode (non-keyless) signature
          # has a `.sig` but no `.pem`. Whatever the signing steps produced is
          # exactly what must arrive on the Release.
          expected=()
          for candidate in \
            "loom-daemon-${TARGET}" \
            "loom-daemon-${TARGET}.sha256" \
            "loom-daemon-${TARGET}"*.sig \
            "loom-daemon-${TARGET}"*.pem
          do
            # An unmatched glob stays literal (nullglob is off), so the -f test
            # is what filters the "this target produced no signature" case.
            if [ -f "$candidate" ]; then
              expected+=("$candidate")
            fi
          done

          # Floor: the binary and its checksum are unconditional for every
          # target. If either is absent HERE, an earlier step silently produced
          # nothing and retrying the upload would only mask that.
          for required in "loom-daemon-${TARGET}" "loom-daemon-${TARGET}.sha256"; do
            if [ ! -f "$required" ]; then
              echo "::error::expected artifact '$required' was never produced in dist/ — refusing to upload a partial asset set for ${TARGET}." >&2
              exit 1
            fi
          done

          MAX_ATTEMPTS=4

          list_uploaded() {
            # Only assets GitHub reports in the terminal `uploaded` state count.
            # An asset left `open`/`starting` is a half-written upload: it shows
            # up in the Release's asset list but is not fetchable — precisely
            # the partial state this step exists to catch.
            gh api "repos/${REPO}/releases/tags/${TAG}" \
              --jq '.assets[] | select(.state == "uploaded") | .name'
          }

          attempt=1
          while :; do
            if ! uploaded="$(list_uploaded)"; then
              echo "::warning::could not read ${TAG}'s asset list (attempt ${attempt}/${MAX_ATTEMPTS}) — treating every expected asset as unconfirmed" >&2
              uploaded=""
            fi

            missing=()
            for f in "${expected[@]}"; do
              if ! printf '%s\n' "$uploaded" | grep -qxF -- "$f"; then
                missing+=("$f")
              fi
            done

            if [ "${#missing[@]}" -eq 0 ]; then
              echo "All ${#expected[@]} expected asset(s) for ${TARGET} are present on ${TAG}."
              {
                echo "### Release assets (${TARGET})"
                for f in "${expected[@]}"; do
                  echo "- uploaded: \`$f\`"
                done
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
              echo "::error::Release ${TAG} is still missing ${#missing[@]} asset(s) for ${TARGET} after ${MAX_ATTEMPTS} upload attempts: ${missing[*]}" >&2
              {
                echo "### Release assets (${TARGET}) — INCOMPLETE"
                for f in "${missing[@]}"; do
                  echo "- MISSING: \`$f\`"
                done
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: uploading ${#missing[@]} asset(s) to ${TAG}: ${missing[*]}"
            for f in "${missing[@]}"; do
              # --clobber makes each retry idempotent: an asset a previous
              # attempt half-created is replaced rather than colliding. A
              # per-file failure is deliberately NOT fatal here — the loop's
              # next completeness read is the only thing that decides, so one
              # flaky file never abandons the others that would have succeeded.
              if ! gh release upload "$TAG" "$f" --repo "$REPO" --clobber; then
                echo "::warning::upload of '$f' failed on attempt ${attempt}/${MAX_ATTEMPTS} — will retry" >&2
              fi
            done

            # Linear backoff, which doubles as the settle window the asset list
            # needs before the next completeness read.
            sleep "$((attempt * 5))"
            attempt="$((attempt + 1))"
          done

      - name: Upload artifacts (for manual runs)
        if: needs.resolve.outputs.publish == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: loom-daemon-${{ matrix.target }}
          # Mirror the "Upload release assets" file list above, including the
          # `.pem` glob (#5174): a keyless-signed Linux artifact needs its
          # signing certificate to verify, and a manual backfill run onto an
          # existing release can't complete without it.
          path: |
            dist/loom-daemon-${{ matrix.target }}
            dist/loom-daemon-${{ matrix.target }}.sha256
            dist/loom-daemon-${{ matrix.target }}*.sig
            dist/loom-daemon-${{ matrix.target }}*.pem
          retention-days: 7

  promote-release:
    name: Promote the Release to Latest
    # #8515: `resolve` creates the Release with `--latest=false`, so between
    # then and here `releases/latest` still names the PREVIOUS, complete
    # Release instead of one whose per-platform uploads are still in flight.
    # This job moves the pointer, and it is the only thing that does.
    #
    # The "every expected asset for every target has uploaded" guarantee is
    # `needs: build-daemon` itself, not a list re-derived here: each matrix leg
    # ends in a retry-until-complete upload step that fails loudly unless the
    # Release carries every file THAT leg produced, and a job depending on a
    # matrix job runs only when EVERY leg succeeded. Restating the target
    # triples here would add a second list that could silently disagree with
    # the matrix (a fourth platform added there and forgotten here would be
    # promoted over) — exactly the "one mechanism per behaviour" rule in
    # `.loom/docs/ci-principles.md`. `build-worker-image` below derives its own
    # completeness guarantee from the same `needs:` edge, for the same reason.
    #
    # Consequence, and the reason this is safer than the draft-release variant
    # of #8515: if any platform's build or upload fails, this job is skipped
    # (an `if:` with no status-check function keeps the implicit `success()`),
    # the workflow is red, and "Latest" simply stays where it was — on a
    # Release that does have every artifact. Nothing is left invisible: the new
    # Release is published, tagged and fetchable by exact tag throughout.
    needs: [resolve, build-daemon]
    if: needs.resolve.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark the Release as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # Floor check (not a substitute for the `needs:` guarantee above):
          # the Release must carry at least one binary + `.sha256` PAIR before
          # it is worth pointing the fleet at. This catches the degenerate
          # "every leg reported success but the Release is empty" case — an
          # asset wipe, a tag recreated underneath us — without duplicating the
          # per-target list.
          assets="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          pairs=0
          while IFS= read -r name; do
            case "$name" in
              ""|*.sha256|*.sig|*.pem) continue ;;
              loom-daemon-*)
                if grep -qxF "${name}.sha256" <<<"$assets"; then
                  pairs=$((pairs + 1))
                fi
                ;;
            esac
          done <<<"$assets"

          if [ "$pairs" -eq 0 ]; then
            echo "::error::Release ${TAG} carries no complete loom-daemon binary + .sha256 pair — refusing to mark it Latest (#8515)." >&2
            echo "- REFUSED: \`$TAG\` was not promoted to Latest — no complete binary/checksum pair on the Release." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Out-of-order promotion guard (concurrent release runs).
          #
          # `gh release edit --latest` sends `make_latest=true`, which pins THIS
          # release as Latest regardless of its creation date — unlike the
          # `legacy`, date-ordered default it replaces. That is safe only if
          # promotions can never complete out of order, and here they can: this
          # workflow's `concurrency` group is keyed per tag/SHA with
          # `cancel-in-progress: false`, so runs for DIFFERENT releases are
          # explicitly allowed to overlap. They demonstrably do — v0.19.295 ran
          # 18:37:25Z→18:52:30Z while v0.19.296 started at 18:42:40Z; start gaps
          # run 5-20 min against 15-18 min durations. A run whose matrix is
          # slower than its successor's would otherwise land its promotion LAST
          # and drag Latest backward onto an older release until the next bump,
          # rolling every host below it down a version.
          #
          # So: a newer release already holding the pointer makes this job a
          # deliberate no-op, not a failure. The fleet is already on a newer
          # COMPLETE Release, which is exactly where it should be.
          read_latest() {
            gh release view --repo "$REPO" --json tagName,createdAt \
              --jq '[.tagName, .createdAt] | @tsv' 2>/dev/null || true
          }

          tag_created="$(gh release view "$TAG" --repo "$REPO" --json createdAt --jq '.createdAt' 2>/dev/null || true)"

          # True when the release named by $1 (tag) / $2 (createdAt) is strictly
          # newer than $TAG. Conservative on purpose — EITHER signal claiming
          # "newer" holds the pointer where it is: creation date (what `legacy`
          # ordered by, and what the concurrent-run race actually inverts) or
          # semantic version. A promotion skipped when it could have run costs
          # one release cycle of staleness and self-heals on the next bump; a
          # promotion made when it should not have been is the regression this
          # guard exists to prevent.
          is_newer_than_tag() {
            other_tag="$1"
            other_created="$2"
            [ -n "$other_tag" ] || return 1
            [ "$other_tag" != "$TAG" ] || return 1

            other_epoch=""
            tag_epoch=""
            if [ -n "$other_created" ] && [ -n "$tag_created" ]; then
              other_epoch="$(date -u -d "$other_created" +%s 2>/dev/null || true)"
              tag_epoch="$(date -u -d "$tag_created" +%s 2>/dev/null || true)"
            fi
            if [ -n "$other_epoch" ] && [ -n "$tag_epoch" ] && [ "$other_epoch" -gt "$tag_epoch" ]; then
              return 0
            fi

            # `sort -V` puts the higher semantic version last.
            highest="$(printf '%s\n%s\n' "${other_tag#v}" "${TAG#v}" | sort -V | tail -n1)"
            [ "${other_tag#v}" != "${TAG#v}" ] && [ "$highest" = "${other_tag#v}" ]
          }

          latest_tsv="$(read_latest)"
          latest_tag="$(printf '%s' "$latest_tsv" | cut -f1)"
          latest_created="$(printf '%s' "$latest_tsv" | cut -f2)"
          if is_newer_than_tag "$latest_tag" "$latest_created"; then
            echo "releases/latest already names ${latest_tag}, which is newer than ${TAG} — leaving the pointer where it is."
            echo "- SKIPPED: \`$TAG\` was not promoted to Latest — \`$latest_tag\` is newer and already Latest (out-of-order promotion guard, #8515)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Bounded retry on a transient forge failure, mirroring the
          # `gh release create` loop in `resolve` (#8290): the whole point of
          # this job is that the pointer advances, so a one-off 403/5xx here
          # must not be what leaves the fleet pinned to the previous release.
          max_attempts=3
          attempt=1
          while :; do
            edit_status=0
            edit_output="$(gh release edit "$TAG" --repo "$REPO" --latest 2>&1)" || edit_status=$?
            if [ "$edit_status" -eq 0 ]; then
              echo "$edit_output"
              break
            fi
            echo "::warning::gh release edit --latest for $TAG failed on attempt $attempt/$max_attempts: $edit_output"
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::gh release edit --latest for $TAG failed after $max_attempts attempts — the Release is complete but NOT marked Latest. Last output: $edit_output" >&2
              exit "$edit_status"
            fi
            if printf '%s' "$edit_output" | grep -qE 'HTTP (403|5[0-9]{2})'; then
              backoff=$((attempt * 5))
              echo "Transient-looking failure (403/5xx) — retrying in ${backoff}s (attempt $((attempt + 1))/$max_attempts)..."
              sleep "$backoff"
              attempt=$((attempt + 1))
            else
              echo "::error::gh release edit --latest for $TAG failed with a non-retryable error: $edit_output" >&2
              exit "$edit_status"
            fi
          done

          # Read back what the forge actually believes, rather than trusting
          # our own write: `releases/latest` is the exact endpoint every
          # updater resolves against (`gh release view` with no tag).
          #
          # The assertion is "$TAG **or newer**", not strict equality: the same
          # concurrency the guard above exists for lets a newer release's
          # promotion land in the gap between our `edit` and this read. That
          # repo state is entirely correct, and failing a healthy release run
          # over it is exactly the false red `.loom/docs/ci-principles.md`
          # forbids. Anything OLDER than $TAG is still a hard failure.
          latest_tsv="$(read_latest)"
          latest_tag="$(printf '%s' "$latest_tsv" | cut -f1)"
          latest_created="$(printf '%s' "$latest_tsv" | cut -f2)"
          if [ "$latest_tag" = "$TAG" ]; then
            echo "- Promoted \`$TAG\` to Latest with ${pairs} complete binary/checksum pair(s) uploaded (#8515)." >> "$GITHUB_STEP_SUMMARY"
          elif is_newer_than_tag "$latest_tag" "$latest_created"; then
            echo "releases/latest now names ${latest_tag}, which is newer than ${TAG} — a concurrent release run took the pointer after our write. Correct state, not a failure."
            echo "- Promoted \`$TAG\` to Latest (${pairs} complete binary/checksum pair(s)); \`$latest_tag\`, newer, has since taken the pointer (#8515)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::after promotion, releases/latest names '${latest_tag:-<none>}', which is neither ${TAG} nor newer." >&2
            exit 1
          fi

  build-worker-image:
    name: Build and publish loom-worker image
    # Waits for EVERY matrix leg (including the macOS/aarch64 daemon builds)
    # to succeed before publishing — a failed platform build for `build-daemon`
    # fails that job as a whole, so this job never runs (and never publishes)
    # against a release the binary matrix itself considers broken.
    needs: [resolve, build-daemon]
    if: needs.resolve.outputs.publish != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag || github.ref }}

      # Image version = loom version (AC): read the same version.sh every
      # other version-bearing file in the repo is kept in sync against, at
      # the exact commit this release/tag checked out above.
      - name: Resolve image version
        id: version
        run: |
          set -euo pipefail
          echo "version=$(./scripts/version.sh)" >> "$GITHUB_OUTPUT"

      # Reuse the binaries `build-daemon` already built and checksummed for
      # this exact commit rather than rebuilding from source a second time —
      # a `release` event fetches them back off the Release assets that job's
      # own "Upload release assets" step just published; a `workflow_dispatch`
      # dry run (no Release object yet) fetches the matching Actions artifacts
      # from "Upload artifacts (for manual runs)" instead. Multi-arch (#7388):
      # both the x86_64 and aarch64 Linux binaries are fetched — the aarch64
      # one was already being built by `build-daemon`'s matrix, just not
      # consumed by this job until now (see docker/worker/README.md
      # "Versioning and publishing").
      - name: Download loom-daemon release assets (release event)
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'loom-daemon-x86_64-unknown-linux-gnu*' \
            --pattern 'loom-daemon-aarch64-unknown-linux-gnu*' \
            --dir dist
          cd dist
          sha256sum -c loom-daemon-x86_64-unknown-linux-gnu.sha256
          sha256sum -c loom-daemon-aarch64-unknown-linux-gnu.sha256

      - name: Download loom-daemon build artifact - amd64 (workflow_dispatch)
        if: needs.resolve.outputs.publish == 'false'
        uses: actions/download-artifact@v8
        with:
          name: loom-daemon-x86_64-unknown-linux-gnu
          path: dist

      - name: Download loom-daemon build artifact - arm64 (workflow_dispatch)
        if: needs.resolve.outputs.publish == 'false'
        uses: actions/download-artifact@v8
        with:
          name: loom-daemon-aarch64-unknown-linux-gnu
          path: dist

      # Stage both triple-named binaries under the `linux-<arch>` naming the
      # Dockerfile's `LOOM_DAEMON_BIN` default expects (`TARGETARCH`-keyed —
      # see docker/worker/Dockerfile) so the same COPY resolves correctly
      # inside each per-platform leg of the multi-platform build below.
      - name: Verify binaries are present, executable, and staged per-arch
        run: |
          set -euo pipefail
          test -f dist/loom-daemon-x86_64-unknown-linux-gnu
          test -f dist/loom-daemon-aarch64-unknown-linux-gnu
          chmod +x dist/loom-daemon-x86_64-unknown-linux-gnu dist/loom-daemon-aarch64-unknown-linux-gnu
          cp dist/loom-daemon-x86_64-unknown-linux-gnu dist/loom-daemon-linux-amd64
          cp dist/loom-daemon-aarch64-unknown-linux-gnu dist/loom-daemon-linux-arm64

      # QEMU: registers binfmt_misc handlers so the arm64 leg of the
      # multi-platform build below can actually run arm64 code (e.g. `npm
      # install`-time postinstall scripts, `--version` sanity checks) under
      # emulation on this amd64 runner — there is no native arm64 GitHub
      # Actions runner assumption here.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the NATIVE (linux/amd64) leg ONLY, with `load: true` (never
      # `push` here) so the image lands in the local docker daemon's store
      # where `docker run` — and therefore the smoke test below — can
      # actually see it. `buildx build --load` does not support a
      # multi-platform result (the classic image store cannot hold a
      # manifest list), so this deliberately stays single-platform; the
      # multi-arch manifest is built and pushed separately below, once this
      # leg's smoke test has passed. Runs unconditionally, on every event and
      # every fork, so the Dockerfile itself is validated regardless of
      # whether this run is allowed to push.
      - name: Build loom-worker image (native amd64, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ghcr.io/rjwalters/loom-worker:${{ steps.version.outputs.version }}
            ghcr.io/rjwalters/loom-worker:latest

      - name: Smoke-test the built image
        run: ./docker/worker/test-image.sh "ghcr.io/rjwalters/loom-worker:${{ steps.version.outputs.version }}"

      # Build AND PUSH the real multi-arch manifest (amd64 + arm64) under the
      # same tags, gated on both "this is a real release" and "this is the
      # canonical repo" — mirrors the macOS/cosign secret-gated skip pattern
      # above, but for a permissions axis instead of a secrets one: a fork
      # running this workflow (via workflow_dispatch, or its own release) has
      # a valid GITHUB_TOKEN but no write access to ghcr.io/rjwalters/*, so
      # pushing there would just fail loudly mid-release. Gating this step
      # behind the smoke test above means a broken image never reaches the
      # registry — the arm64 leg itself is not independently smoke-tested in
      # CI (no native arm64 runner here; see docker/worker/README.md for the
      # manual Apple-Silicon verification this still requires).
      - name: Build and push multi-arch loom-worker image
        if: needs.resolve.outputs.publish == 'true' && github.repository == 'rjwalters/loom'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rjwalters/loom-worker:${{ steps.version.outputs.version }}
            ghcr.io/rjwalters/loom-worker:latest

  build-session-image:
    name: Build and publish loom-worker-session image
    # `build-session-image` (#6899, ADR-0017 Phase 1) publishes
    # ghcr.io/rjwalters/loom-worker-session — a same-version FROM layer on
    # top of loom-worker adding the Codex CLI + a persistent tmux-server
    # entrypoint (see docker/session/README.md for the full FROM contract).
    # Depends on build-worker-image succeeding (its own smoke test already
    # validated the exact base image this layer builds FROM) even though
    # this job re-builds that base image locally itself, below — job
    # isolation means the image build-worker-image loaded into ITS runner's
    # local docker store does not carry over to this job's fresh runner, so
    # rebuilding locally (identical steps, same inputs) is simpler and more
    # robust than transferring a `docker save` tarball between jobs, and
    # keeps this job correct on a workflow_dispatch dry run too, where
    # nothing was pushed to GHCR for a registry-pull FROM to resolve against.
    # Multi-arch (#7388): the `needs:` dependency additionally guarantees
    # build-worker-image's own multi-arch PUSH step has already completed
    # before this job's own multi-arch push step runs, so the REGISTRY
    # `ghcr.io/rjwalters/loom-worker:<version>` this job's BASE_IMAGE names
    # for that step is already a real amd64+arm64 manifest, not amd64-only.
    needs: [resolve, build-worker-image]
    if: needs.resolve.outputs.publish != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag || github.ref }}

      - name: Resolve image version
        id: version
        run: |
          set -euo pipefail
          echo "version=$(./scripts/version.sh)" >> "$GITHUB_OUTPUT"

      # Multi-arch (#7388): both the x86_64 and aarch64 Linux `loom-daemon`
      # binaries — mirrors build-worker-image's own download/staging steps
      # exactly (this job's local base-image rebuild below needs the same
      # per-arch staging the base Dockerfile's LOOM_DAEMON_BIN ARG expects).
      - name: Download loom-daemon release assets (release event)
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'loom-daemon-x86_64-unknown-linux-gnu*' \
            --pattern 'loom-daemon-aarch64-unknown-linux-gnu*' \
            --dir dist
          cd dist
          sha256sum -c loom-daemon-x86_64-unknown-linux-gnu.sha256
          sha256sum -c loom-daemon-aarch64-unknown-linux-gnu.sha256

      - name: Download loom-daemon build artifact - amd64 (workflow_dispatch)
        if: needs.resolve.outputs.publish == 'false'
        uses: actions/download-artifact@v8
        with:
          name: loom-daemon-x86_64-unknown-linux-gnu
          path: dist

      - name: Download loom-daemon build artifact - arm64 (workflow_dispatch)
        if: needs.resolve.outputs.publish == 'false'
        uses: actions/download-artifact@v8
        with:
          name: loom-daemon-aarch64-unknown-linux-gnu
          path: dist

      - name: Verify binaries are present, executable, and staged per-arch
        run: |
          set -euo pipefail
          test -f dist/loom-daemon-x86_64-unknown-linux-gnu
          test -f dist/loom-daemon-aarch64-unknown-linux-gnu
          chmod +x dist/loom-daemon-x86_64-unknown-linux-gnu dist/loom-daemon-aarch64-unknown-linux-gnu
          cp dist/loom-daemon-x86_64-unknown-linux-gnu dist/loom-daemon-linux-amd64
          cp dist/loom-daemon-aarch64-unknown-linux-gnu dist/loom-daemon-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild the NATIVE (linux/amd64) base image locally (never pushed
      # FROM here — always push: false, load: true) so the exact same-version
      # tag docker/session/Dockerfile's BASE_IMAGE build-arg names below is
      # present in THIS job's local docker store — identical to
      # build-worker-image's own native smoke-test build step. Single-platform
      # deliberately, same reason as that job: `buildx build --load` cannot
      # produce a multi-platform result.
      - name: Build loom-worker base image (local, for FROM)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ghcr.io/rjwalters/loom-worker:${{ steps.version.outputs.version }}

      - name: Build loom-worker-session image (native amd64, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/session/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            BASE_IMAGE=ghcr.io/rjwalters/loom-worker:${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/rjwalters/loom-worker-session:${{ steps.version.outputs.version }}
            ghcr.io/rjwalters/loom-worker-session:latest

      - name: Smoke-test the built image
        run: ./docker/session/test-image.sh "ghcr.io/rjwalters/loom-worker-session:${{ steps.version.outputs.version }}"

      # Build AND PUSH the real multi-arch manifest (amd64 + arm64), gated
      # exactly like build-worker-image's own multi-arch push step. Unlike
      # the native build above (FROM the just-built LOCAL base image),
      # `BASE_IMAGE` here names the REGISTRY tag: `needs: build-worker-image`
      # guarantees that job's own multi-arch push step already completed by
      # the time this step runs, so `ghcr.io/rjwalters/loom-worker:<version>`
      # already resolves to a real multi-arch manifest — buildx pulls the
      # matching per-arch base layer for each platform leg automatically,
      # rather than resolving from this job's amd64-only local store (which
      # has no arm64 base image to offer the arm64 leg at all).
      - name: Build and push multi-arch loom-worker-session image
        if: needs.resolve.outputs.publish == 'true' && github.repository == 'rjwalters/loom'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/session/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/rjwalters/loom-worker:${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/rjwalters/loom-worker-session:${{ steps.version.outputs.version }}
            ghcr.io/rjwalters/loom-worker-session:latest

  build-native-image:
    name: Build and publish loom-worker-native image
    # `build-native-image` (#8403, Epic #6896 Phase 3) publishes
    # ghcr.io/rjwalters/loom-worker-native — a same-version FROM layer on top
    # of loom-worker adding the PINNED Pi/OpenCode CLIs, for the per-sweep
    # EPHEMERAL containers native-harness sweeps run in (docker/native/README.md
    # explains why this is a separate image from loom-worker-session rather
    # than another CLI added to it: a different container LIFETIME, not a
    # different CLI).
    #
    # Every structural decision below is build-session-image's, for exactly
    # the same reasons documented there — the `needs:` dependency (base-image
    # smoke test already passed, AND its multi-arch push has completed before
    # this job's own push step names the registry tag as BASE_IMAGE), the
    # local single-platform base rebuild (job isolation means that job's
    # loaded image is not in this runner's store, and `buildx --load` cannot
    # produce a multi-platform result), and the canonical-repo/release push
    # gate. Kept as a sibling job rather than a matrix over the two overlay
    # images on purpose: a matrix would couple two independent deliverables'
    # failure modes, and CI here is deliberately dumb and reliable.
    needs: [resolve, build-worker-image]
    if: needs.resolve.outputs.publish != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag || github.ref }}

      - name: Resolve image version
        id: version
        run: |
          set -euo pipefail
          echo "version=$(./scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Download loom-daemon release assets (release event)
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'loom-daemon-x86_64-unknown-linux-gnu*' \
            --pattern 'loom-daemon-aarch64-unknown-linux-gnu*' \
            --dir dist
          cd dist
          sha256sum -c loom-daemon-x86_64-unknown-linux-gnu.sha256
          sha256sum -c loom-daemon-aarch64-unknown-linux-gnu.sha256

      - name: Download loom-daemon build artifact - amd64 (workflow_dispatch)
        if: needs.resolve.outputs.publish == 'false'
        uses: actions/download-artifact@v8
        with:
          name: loom-daemon-x86_64-unknown-linux-gnu
          path: dist

      - name: Download loom-daemon build artifact - arm64 (workflow_dispatch)
        if: needs.resolve.outputs.publish == 'false'
        uses: actions/download-artifact@v8
        with:
          name: loom-daemon-aarch64-unknown-linux-gnu
          path: dist

      - name: Verify binaries are present, executable, and staged per-arch
        run: |
          set -euo pipefail
          test -f dist/loom-daemon-x86_64-unknown-linux-gnu
          test -f dist/loom-daemon-aarch64-unknown-linux-gnu
          chmod +x dist/loom-daemon-x86_64-unknown-linux-gnu dist/loom-daemon-aarch64-unknown-linux-gnu
          cp dist/loom-daemon-x86_64-unknown-linux-gnu dist/loom-daemon-linux-amd64
          cp dist/loom-daemon-aarch64-unknown-linux-gnu dist/loom-daemon-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build loom-worker base image (local, for FROM)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ghcr.io/rjwalters/loom-worker:${{ steps.version.outputs.version }}

      - name: Build loom-worker-native image (native amd64, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/native/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            BASE_IMAGE=ghcr.io/rjwalters/loom-worker:${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/rjwalters/loom-worker-native:${{ steps.version.outputs.version }}
            ghcr.io/rjwalters/loom-worker-native:latest

      - name: Smoke-test the built image
        run: ./docker/native/test-image.sh "ghcr.io/rjwalters/loom-worker-native:${{ steps.version.outputs.version }}"

      - name: Build and push multi-arch loom-worker-native image
        if: needs.resolve.outputs.publish == 'true' && github.repository == 'rjwalters/loom'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/native/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/rjwalters/loom-worker:${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/rjwalters/loom-worker-native:${{ steps.version.outputs.version }}
            ghcr.io/rjwalters/loom-worker-native:latest
