name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Cargo.lock'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

# Supersede on a PR; NEVER on main (#8198, mirroring ci.yml's #7779 fix).
#
# `github.ref` is `refs/heads/main` for every push to main, so one shared group
# meant each merge cancelled the previous merge's Security Scan -- including the
# CodeQL Analysis job, which only runs on non-PR events and therefore has no
# other place it gets verified. Observed live on 2026-09-18: CodeQL for commit
# e2c02f41 started 10:06:56Z and was cancelled 10:08:19Z, 13s before the next
# main commit appeared. That silently loses security coverage on any main commit
# followed by another merge inside the scan's runtime, which at ~3.3 merges/hour
# (#7779's measurement) is close to the steady state.
#
# Keyed on the PR number when there is one, and on the commit SHA otherwise, so
# every main commit -- and every scheduled scan of a distinct tip -- gets its own
# group and has nothing to supersede. See .loom/docs/ci-principles.md rule 2:
# never cancel verification of a distinct commit.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Belt-and-suspenders cancellation (#6683) — same rationale and mechanism as
  # ci.yml's identically-named job: native `cancel-in-progress` above does not
  # reliably cancel a superseded run that is still `queued` (zero jobs
  # materialized), only one that has already reached `in_progress`. This job
  # explicitly cancels any other queued/in_progress run of THIS workflow on
  # the SAME head branch (`--branch`-scoped, never touches another ref's
  # run). No `needs:`, so it runs in parallel and does not gate the jobs below.
  cancel-superseded:
    name: Cancel Superseded Runs (same ref)
    # PR events only (#8198), exactly as ci.yml's identically-named job since
    # #7779. The rationale above is entirely about a superseded PR push. On a
    # push to main (or a scheduled run) there is nothing to supersede:
    # `github.head_ref` is empty, so REF fell back to `github.ref_name` =
    # `main`, and this job cancelled every other queued/in_progress main run --
    # the dominant cause of the cancellation rate in ci.yml, not the
    # `concurrency:` stanza alone. Each main commit is distinct work that
    # deserves its own verification.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older queued/in_progress runs for this ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          REF: ${{ github.head_ref || github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Checking for superseded '$WORKFLOW' runs on ref '$REF' (current run: $CURRENT_RUN_ID)"
          gh run list --repo "$REPO" --workflow "$WORKFLOW" --branch "$REF" \
            --json databaseId,status --jq \
            '.[] | select(.status == "queued" or .status == "in_progress") | .databaseId' \
            | while read -r run_id; do
                if [[ "$run_id" != "$CURRENT_RUN_ID" ]]; then
                  echo "Cancelling superseded run $run_id (workflow=$WORKFLOW ref=$REF)"
                  gh run cancel "$run_id" --repo "$REPO" \
                    || echo "::warning::failed to cancel run $run_id (may have already completed, or GITHUB_TOKEN lacks actions:write — e.g. a fork PR)"
                fi
              done

  cargo-audit:
    name: Cargo Audit (Rust Dependencies)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit
      - run: cargo audit --deny warnings

  codeql:
    name: CodeQL Analysis
    # Only run on push to main and weekly schedule, not on PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript, typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
