# =============================================================================
# loom-observability-ingest — Cloudflare Workers deployment template
# =============================================================================
# This file is BOTH the working config used by this repo's test suite AND the
# template a third party copies to deploy the backend to their own Cloudflare
# account.
#
# Every value you must supply is tagged `CHANGE ME` and carries an obviously
# fake placeholder. `npm run preflight` fails while any placeholder survives,
# so a half-configured deploy is caught before `wrangler deploy` runs.
#
#   Full deploy walkthrough .... docs/deploy-runbook.md
#   SSO gate / public view ..... docs/cloudflare-access.md
# =============================================================================

# -----------------------------------------------------------------------------
# Worker identity
# -----------------------------------------------------------------------------
# `name` is the Worker's name in your account and the first label of its
# workers.dev URL (https://<name>.<your-subdomain>.workers.dev). Keeping the
# default is fine; change it only if one account hosts several instances.
name = "loom-observability-ingest"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# CHANGE ME — only if your Cloudflare credential can reach more than one
# account. Wrangler infers the account when the credential has exactly one and
# errors out otherwise. Find yours with `wrangler whoami`.
#
# Preferred: leave this commented out and `export CLOUDFLARE_ACCOUNT_ID=...`
# instead, so your account id never lands in git.
# account_id = "REPLACE_WITH_YOUR_CLOUDFLARE_ACCOUNT_ID"

# workers.dev gives you a public URL with zero DNS setup — right for the first
# smoke test.
#
# CHANGE ME to `false` once you serve from a custom domain (`[[routes]]`
# below). Cloudflare Access can only gate hostnames inside a zone you own, so a
# still-enabled workers.dev URL is an unauthenticated bypass straight around
# your Access policy — see docs/cloudflare-access.md.
workers_dev = true

# CHANGE ME — required before you can put Cloudflare Access in front of this
# Worker, optional otherwise. The zone (`example.com`) must already be active
# in the same Cloudflare account; `custom_domain = true` makes Wrangler create
# and manage the DNS record for you.
#
# [[routes]]
# pattern = "loom-dashboard.example.com"
# custom_domain = true

# -----------------------------------------------------------------------------
# Static assets — the Phase-3 dashboard UI (`web/`), served by THIS Worker.
# -----------------------------------------------------------------------------
# Nothing account-specific here; you should not need to change any of it.
#
# The UI and the API deliberately share one Worker, one hostname, and therefore
# one Cloudflare Access policy. A split deploy (UI on Pages, API here) would
# put the two on different hostnames, which means CORS, a second Access
# application, and a cross-origin cookie problem — for zero benefit at this
# scale.
#
# `directory` is Vite's build output (`cd web && npm run build`). It must EXIST
# for Wrangler to parse this file at all, even for `--dry-run` or the test
# suite, so `npm test` / `npm run preflight` / `npm run dev` first run
# `scripts/ensure-web-dist.sh`, which drops a placeholder when the UI has not
# been built. `npm run deploy` always does a real build first.
#
# `not_found_handling = "none"` is load-bearing: it makes any request that does
# not match a file here fall through to the Worker (`src/index.ts`), which is
# what keeps `/ingest`, `/admin/*`, `/api/*`, and `/public/*` reachable. The
# SPA alternative ("single-page-application") would rewrite every unmatched
# path to index.html and shadow the entire API — which is why the UI routes on
# the URL *hash* (`#/hosts/<id>`) and never needs a server-side rewrite. See
# `web/src/router.ts`.
#
# `run_worker_first = ["/"]` + `binding` are load-bearing for the single-URL
# layout (issue #4795): the Worker must see `/` itself so it can validate the
# Cloudflare Access JWT and tell the UI which dataset it is entitled to. Left
# to the asset router, `/` would be served as a static index.html before any
# Worker code ran, and an anonymous visitor would get a UI that immediately
# calls `/api/*` and 403s. Every other asset path (`/assets/*`) is still
# served directly by the router — those are JS/CSS bundles with no fleet data
# in them.
[assets]
directory = "./web/dist"
not_found_handling = "none"
binding = "ASSETS"
run_worker_first = ["/"]

# -----------------------------------------------------------------------------
# D1 — durable history for every ingested telemetry record.
# -----------------------------------------------------------------------------
# CHANGE ME — `database_id` below is an all-zeros placeholder. Create the
# database in YOUR account and paste back the id it prints:
#
#   wrangler d1 create loom-observability
#
# `database_name` may be anything; `binding` is the name `src/index.ts` reads
# off `Env` (`env.DB`) and must NOT be renamed without editing the source.
[[d1_databases]]
binding = "DB"
database_name = "loom-observability"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# -----------------------------------------------------------------------------
# Durable Object — live "what is running right now across every host" state,
# independent of D1's durable history.
# -----------------------------------------------------------------------------
# Nothing account-specific here: Durable Objects are created implicitly on the
# first deploy, so there is no id to paste. `name` is the binding
# `src/index.ts` reads (`env.FLEET_STATE`) and `class_name` must match the
# class exported from `src/fleetState.ts` — renaming either requires a matching
# source edit plus a new `[[migrations]]` tag below.
[[durable_objects.bindings]]
name = "FLEET_STATE"
class_name = "FleetState"

# Durable Object class migrations. `tag` is an append-only history: never edit
# or delete a tag that has already been deployed — add a new one.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FleetState"]

# -----------------------------------------------------------------------------
# Retention policy — see src/retention.ts. Both bounds are enforced on every
# scheduled run; either alone is sufficient to cap D1 growth, but both are
# applied for defense in depth (a burst of hosts could blow the row cap well
# before the age cutoff, and a single very-chatty host could blow the age
# cutoff's effective size before enough time passes).
# -----------------------------------------------------------------------------
# Tune to your fleet size and D1 plan limits. These are plain (non-secret)
# vars, so `wrangler deploy` publishes exactly what is written here.
[vars]
RETENTION_DAYS = "90"
MAX_RECORDS = "500000"

# Display timezone for the UI: an IANA name (e.g. "America/Los_Angeles").
#
# Unset (the default here) means each viewer sees times in their own browser
# zone. Setting it pins the whole deployment to one zone, which is what you
# want once the charts matter: `bucketKey` decides which calendar day a sweep
# is counted in, so a browser-derived zone gives two viewers different daily
# totals for the same data. An invalid name falls back rather than failing.
#
# DISPLAY_TIMEZONE = "America/Los_Angeles"

# CHANGE ME (both, together) — required only if you want the single-URL
# fallback layout (docs/cloudflare-access.md): anonymous visitors to `/` see
# the public view, a `2amlogic.com`-style Access identity sees the full
# dashboard. Leave both commented out to run `/` as always-public (the
# Worker fails closed — no team domain/AUD configured means every request is
# treated as unauthenticated, never the other way around).
#
#   CF_ACCESS_TEAM_DOMAIN — your team's Cloudflare Access domain, e.g.
#     "yourteam.cloudflareaccess.com" (Zero Trust dashboard → Settings →
#     Custom Pages, or any Access app's overview page shows it). Used to
#     build the JWKS URL (".../cdn-cgi/access/certs") and the expected `iss`.
#   CF_ACCESS_AUD — the Application Audience (AUD) tag of the `/login`
#     Access application, shown on that app's overview page. Pins JWT
#     acceptance to tokens minted for apps you named here — neither value is
#     a secret. Accepts a COMMA-SEPARATED LIST: Access names the session
#     cookie per hostname but mints the token per application, so a browser
#     on a hostname running several path-scoped apps may hold the `/api/*`
#     app's token instead of `/login`'s. List every app on this hostname
#     whose session should count as signed-in (typically `/login` and
#     `/api/*`) or an already-signed-in operator flaps back to the public
#     view — see src/accessAuth.ts's module doc.
#
# CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_YOUR_TEAM.cloudflareaccess.com"
# CF_ACCESS_AUD = "REPLACE_WITH_YOUR_LOGIN_APP_AUD_TAG,REPLACE_WITH_YOUR_API_APP_AUD_TAG"

# Runs the retention sweep hourly. `wrangler dev` does not fire this on a
# real clock; trigger it directly in tests / via the admin endpoint instead
# (see src/index.ts `/admin/retention/run`).
[triggers]
crons = ["0 * * * *"]

# -----------------------------------------------------------------------------
# Secrets — NEVER written into this file (it is committed). Set them with:
#
#   wrangler secret put ADMIN_TOKEN         # deployed Worker
#   echo 'ADMIN_TOKEN="..."' > .dev.vars    # local `wrangler dev` (gitignored)
#
#   ADMIN_TOKEN — bearer token gating the /admin/* host-key management routes.
#                 Generate with `openssl rand -hex 32`. While it is unset every
#                 /admin/* route answers 503, so host provisioning is
#                 impossible — set it before the first deploy.
#
# See .dev.vars.example.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Multiple environments (optional)
# -----------------------------------------------------------------------------
# A named environment deploys a separate Worker (`<name>-<env>`) with its own
# bindings: `wrangler deploy --env staging`.
#
# IMPORTANT: `vars`, `d1_databases`, `durable_objects`, and `routes` are NOT
# inherited from the top level — a named environment must redeclare each one it
# needs, and needs its own `wrangler secret put --env staging ADMIN_TOKEN`.
#
# [env.staging]
# workers_dev = true
#
# [[env.staging.d1_databases]]
# binding = "DB"
# database_name = "loom-observability-staging"
# database_id = "REPLACE_WITH_YOUR_STAGING_D1_DATABASE_ID"
# migrations_dir = "migrations"
#
# [[env.staging.durable_objects.bindings]]
# name = "FLEET_STATE"
# class_name = "FleetState"
#
# [env.staging.vars]
# RETENTION_DAYS = "7"
# MAX_RECORDS = "50000"
